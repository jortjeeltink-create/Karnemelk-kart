}

// Stoelen op gelijke afstand langs de rand van de tafel: jij onderaan, daarna met de klok mee.
// De vorm van de tafel (zie .rail in het thema): 'ovaal', 'recht' (afgeronde rechthoek), 'acht' (achthoek) of 'rond'
// (cirkel). Bij 'rij' is er geen tafel om omheen te zitten: het bord vult het scherm en de spelers staan in een rij erboven.
const TABLE_SHAPE = 'rij';
const seatCache = new Map();
function seatPositions(n, aspect) {
  const key = `${n}:${aspect.toFixed(2)}`;
  if (seatCache.has(key)) return seatCache.get(key);
  // Vult het bord het scherm (TABLE_SHAPE 'rij'), dan staan de spelers in een rij bovenaan, jij als eerste; vanaf
  // 6 spelers in twee rijen. Het tweede getal is dan de rij: 0 of 1 (zie placeSeats).
  if (TABLE_SHAPE === 'rij') {
    const per = n > 5 ? Math.ceil(n / 2) : n, row = [];
    for (let s = 0; s < n; s++) { const r = s < per ? 0 : 1, m = r ? n - per : per; row.push([((r ? s - per : s) + .5) / m * 100, r]); }
    seatCache.set(key, row);
    return row;
  }
  // de rand in procenten van de tafel (zie .rail): zijkanten op 6% en 94%, boven- en onderkant als halve ellips.
  // Een ronde tafel is een cirkel die in de breedte en de hoogte past. Bij een rechte of achthoekige tafel is de
  // bocht hoekiger (bol kleiner dan 1), zodat de stoelen langs de rand blijven staan.
  let rx = 44, ry = 25.5, top = 30.5, bot = 64.5;
  if (TABLE_SHAPE === 'rond') { rx = Math.min(44, 42.5 / aspect); ry = rx * aspect; top = bot = 47.5; }
  const bol = { recht: .36, acht: .62 }[TABLE_SHAPE] || 1;
  const pts = [], rond = (v) => Math.sign(v) * Math.abs(v) ** bol;
  const cap = (cy, a0, a1) => { for (let k = 0; k <= 48; k++) { const a = a0 + (a1 - a0) * k / 48; pts.push([50 + rx * rond(Math.cos(a)), cy + ry * rond(Math.sin(a))]); } };
  cap(bot, Math.PI / 2, Math.PI);
  cap(top, Math.PI, Math.PI * 2);
  cap(bot, 0, Math.PI / 2);
  // afstanden in echte verhoudingen, zodat de stoelen ook op een smalle tafel gelijk verdeeld zijn
  const len = [0];
  for (let i = 1; i < pts.length; i++) len.push(len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], (pts[i][1] - pts[i - 1][1]) / aspect));
  const total = len[len.length - 1], out = [];
  for (let s = 0; s < n; s++) {
    const want = total * s / n;
    let i = 1;
    while (i < len.length - 1 && len[i] < want) i++;
    const t = (want - len[i - 1]) / ((len[i] - len[i - 1]) || 1);
    out.push([pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]);
  }
  seatCache.set(key, out);
  return out;
}

// Zet de stoelen op hun plek. Valt een naambordje of label buiten het scherm, dan schuift het naar binnen.
function placeSeats() {
  const scr = $('#screen').getBoundingClientRect(), minX = scr.left + 4, maxX = scr.right - 4;
  const inward = (cx, half) => cx - half < minX ? minX - (cx - half) : cx + half > maxX ? maxX - (cx + half) : 0;
  for (const t of document.querySelectorAll('.table')) {
    const r = t.getBoundingClientRect();
    if (!r.width || !r.height) continue;
    const seats = t.querySelectorAll('.seat');
    const pos = seatPositions(seats.length, r.width / r.height);
    // Bij een rij spelers: --rij is de hoogte van één rij (uit de stijl, want soms liggen er kaarten onder de
    // spelers) en --strook de ruimte die de rijen samen innemen; het bord begint daaronder.
    const stap = TABLE_SHAPE === 'rij' ? parseFloat(getComputedStyle(t).getPropertyValue('--rij')) || 62 : 0;
    if (stap) t.style.setProperty('--strook', `${(seats.length > 5 ? 2 : 1) * stap + 12}px`);
    seats.forEach((el, i) => {
      const [x, y] = pos[i];
      const cx = r.left + x / 100 * r.width;
      const shift = inward(cx, el.querySelector('.plate').offsetWidth / 2);
      el.style.left = shift ? `calc(${x}% + ${shift}px)` : `${x}%`;
      el.style.top = stap ? `${30 + y * stap}px` : `${y}%`;
      el.classList.toggle('top', y < 50);
      const tag = el.querySelector('.tag');
      if (tag) tag.style.setProperty('--tx', `${inward(cx + shift, tag.offsetWidth / 2 + 4)}px`);
    });
    const d = t.querySelector('.dealer');
    if (d && pos.length) {
      const [x, y] = pos[+d.dataset.seat] || pos[0];
      if (stap) { d.style.left = `calc(${x}% + 17px)`; d.style.top = `${15 + y * stap}px`; }
      else { d.style.left = `${x + (50 - x) * .2 + (x < 50 ? 9 : -9)}%`; d.style.top = `${y + (50 - y) * .22}%`; }
    }
  }
}

// De tafel: rand, vilt, iets in het midden en de spelers eromheen (order: wie op welke stoel, jij eerst).
// seat(i) -> { deck: de stapel voor de dealer, now, dim, kick, tag: [soort, tekst] }
function tableHTML({ order: seatsOrder, people, center = '', seat = () => ({}), dealer = -1, chip = 'H', cls = '' }) {
  const seats = seatsOrder.map((i) => {
    const p = people[i], o = seat(i) || {};
    const btn = o.target ? ` type="button" data-act="pick" data-to="${i}" aria-label="${esc(p.name)} is de vrouw"`
      : o.kick ? ` type="button" data-act="kickask" data-seat="${i}" aria-label="${esc(p.name)} van tafel halen"` : '';
    const el = btn ? 'button' : 'div';
    const hole = o.cards ? Array.from({ length: o.cards }, () => cardHTML(null, { cls: 'mini' })).join('') : '';
    const line = p.empty ? '' : p.connected === false ? '<span class="off">weg</span>'
      : p.sips != null ? `<span class="${p.sips ? '' : 'zero'}" title="Strafpunten">${STRAF}${p.sips}</span>` : '';
    const isMe = S && i === S.you && !p.empty;
    return `<${el} class="seat${o.now ? ' now' : ''}${o.target ? ' target' : ''}${o.picked ? ' picked' : ''}${o.dim ? ' dim' : ''}${p.empty ? ' empty' : ''}${isMe ? ' me' : ''}${p.connected === false ? ' off' : ''}" style="--pc:${PC[i % PC.length]}"${btn}>
      ${hole ? `<div class="hole">${hole}</div>` : ''}<span class="ava">${p.empty ? '+' : esc(initial(p.name))}</span>
      <span class="plate"><b>${p.empty ? 'Vrij' : esc(p.name)}</b>${line}</span>
      ${o.tag ? `<span class="tagwrap"><span class="tag ${o.tag[0]}">${o.tag[1]}</span></span>` : ''}
    </${el}>`;
  }).join('');
  const d = seatsOrder.indexOf(dealer);
  const ban = ui.banner ? `<div class="banner"><p class="felt-sub">${esc(ui.banner.sub)}</p><p class="banner-t">${esc(ui.banner.title)}</p></div>` : '';
  return `<div class="table ${cls}"><div class="rail"></div><div class="felt"></div>${d >= 0 ? `<span class="dealer" data-seat="${d}" title="${chip === 'D' ? 'Deler' : 'Host'}" aria-hidden="true">${chip}</span>` : ''}<div class="center">${center}</div>${seats}${ban}</div>`;
}

const sheetTop = (title, kick = '', close = true) => `<div class="sheet-top"><div>${kick ? `<p class="kick">${kick}</p>` : ''}<h2 class="sheet-title" id="sheetTitle">${title}</h2></div>${close ? '<button class="xbtn" type="button" data-act="close" aria-label="Sluiten">✕</button>' : ''}</div>`;
const limitSeg = () => `<div class="seg" role="group" aria-label="Tot hoeveel strafpunten">${T.LIMITS.map((n) => `<button type="button" data-act="limit" data-n="${n}" aria-pressed="${S.limit === n}">${n}</button>`).join('')}</div>`;

/* ================= SCHERMEN ================= */
function vHome() {
  const empty = Array.from({ length: 4 }, () => ({ name: 'Vrije plek', empty: true }));
  const fan = `<div class="fan">${[{ r: 10, s: 0 }, { r: 9, s: 3 }, { r: 8, s: 1 }, { r: 7, s: 2 }].map((c) => cardHTML(c)).join('')}</div>`;
  const table = tableHTML({ order: [0, 1, 2, 3], people: empty, cls: 'lobby home', center: `<p class="felt-sub">Kaartspel voor op tafel</p><div class="felt-logo small">Toepen</div>${fan}` });
  const busy = ui.joining ? 'disabled' : '';
  return `
  ${table}
  <div class="startcard cream">
    <div class="chips"><span class="chip">${T.MIN_PLAYERS} tot ${T.MAX_PLAYERS} spelers</span><span class="chip line">Ieder op eigen telefoon</span></div>
    <p>Iedereen krijgt vier kaarten en alleen jij ziet de jouwe. Wie de laatste slag wint, wint de ronde. Durf je te kloppen? Dan gaat de inzet omhoog, en wie past krijgt meteen strafpunten.</p>
    <label class="fld">Jouw naam<input class="inp" id="nameIn" maxlength="${T.NAME_MAX}" placeholder="Bijvoorbeeld Sanne" autocomplete="nickname" enterkeyhint="next" value="${esc(ui.name)}"></label>
    <form class="addrow" id="joinForm" autocomplete="off">
      <input class="inp code" id="codeIn" maxlength="4" placeholder="CODE" aria-label="Code van de tafel" autocapitalize="characters" spellcheck="false" enterkeyhint="go" value="${esc(ui.code)}">
      <button class="addbtn" type="submit" ${busy}>Meedoen</button>
    </form>
    <div class="or">of</div>
    <button class="cta" type="button" data-act="create" ${busy}><span>${ui.joining ? 'Verbinden…' : 'Nieuwe tafel'}</span>${ARR}</button>
    ${ui.error ? `<p class="errline">${esc(ui.error)}</p>` : ''}
    <div class="howrow"><button class="ghostbtn" type="button" data-uitleg="toepen"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-2px;margin-right:6px"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>Uitleg</button><button class="ghostbtn" type="button" data-act="rules">Spelregels</button></div>
  </div>
  <p class="note">Wat een strafpunt is, spreken jullie samen af.</p>`;
}

function vLobby() {
  const n = S.players.length, host = isHost(), short = T.MIN_PLAYERS - liveCount();
  const table = tableHTML({
    order: order(), people: S.players, cls: 'lobby', dealer: S.host, chip: 'H',
    center: `<p class="felt-sub">Code van de tafel</p><div class="felt-logo code">${S.code}</div><p class="felt-sub">${n} van ${T.MAX_PLAYERS} plekken</p>`,
    seat: (i) => ({ kick: host && i !== S.you, now: i === S.host }),
  });
  const dock = `<div class="ask-h"><h2>${host ? 'Jij bent de host' : 'Je zit aan tafel'}</h2><button class="sharebtn" type="button" data-act="share">${SHARE}Uitnodigen</button></div>
    <p class="sub">Vrienden doen mee met code <b>${S.code}</b> of met de link. Er wordt gespeeld tot <b>${S.limit} strafpunten</b>: wie die haalt, ligt eruit. De laatste die overblijft, wint.</p>
    ${host
      ? `<div class="optrow">Tot hoeveel strafpunten${limitSeg()}</div>
        <button class="cta" type="button" data-act="start" ${short > 0 ? 'disabled' : ''}><span>${short > 0 ? `Wacht op ${short} ${short === 1 ? 'speler' : 'spelers'}` : 'Start het spel'}</span>${ARR}</button>
        ${n > 1 ? '<p class="fine">Tik op een speler om die van tafel te halen.</p>' : ''}`
      : `<p class="waitline">Wachten tot ${nameOf(S.host)} het spel start</p>`}
    <button class="linkbtn" type="button" data-act="leaveask">Verlaat tafel</button>`;
  return `${table}<div class="dock">${dock}</div>`;
}

function vSpel() {
  const ph = S.phase, r = lastEv('ronde');
  const playing = ph === 'spelen' || ph === 'klop' || ph === 'was';
  const seat = (i) => {
    const p = S.players[i], o = { cards: playing ? p.cards : 0 };
    if (ph === 'spelen' && i === S.turn) o.now = true;
    if (p.out) { o.dim = true; o.tag = ['calm', 'Af']; } else if (playing && !p.inRound) { o.dim = true; o.tag = ['calm', 'Gepast']; }
    if (ph === 'klop') { if (S.klop.by === i) o.tag = ['rose', 'Klop!']; if (S.klop.wait.includes(i)) o.now = true; }
    if (ph === 'was') { if (S.was.by === i) o.tag = ['rose', 'Vuile was']; if (S.was.wait.includes(i)) o.now = true; }
    if (ph === 'ronde' && r) { if (i === r.winner) o.tag = ['', 'Wint!']; else if (r.losers.includes(i)) o.tag = ['bad', `+${r.stake}`]; }
    if (ph === 'klaar' && i === S.winner) o.tag = ['', 'Winnaar'];
    return o;
  };
  const people = S.players.map((p) => ({ ...p, sips: p.pts }));
  return `${tableHTML({ order: order(), people, center: centerHTML(), dealer: S.dealer, chip: 'D', seat })}<div class="dock${ui.dockPop ? ' pop' : ''}">${dockHTML()}</div>`;
}

// het midden van de tafel: de ronde en de inzet, de kaarten van deze slag (of even de vorige) en wat er gebeurt
function centerHTML() {
  const ph = S.phase;
  if (ph === 'klaar') {
    const toep = lastEv('toep');
    return `<p class="felt-sub">${toep && toep.player === S.winner ? 'Toep: vier dezelfde' : 'Toepen is klaar'}</p><div class="felt-logo small">${S.winner === S.you ? 'Jij<br>wint!' : `${nameOf(S.winner)}<br>wint!`}</div>`;
  }
  const dots = `<span class="streak" aria-label="${S.tricks} van ${T.HAND} slagen gespeeld">${Array.from({ length: T.HAND }, (_, k) => `<u class="${k < S.tricks ? 'on' : ''}"></u>`).join('')}</span>`;
  const pot = `<div class="pot">Ronde ${S.round}<i></i>voor ${S.stake}<i></i>${dots}</div>`;
  const show = ui.slag, cards = show ? show.cards : S.trick, winner = show ? show.winner : -1;
  let call = '';
  if (ph === 'klop') call = `<div class="callout bad">Klop!<small>${who(S.klop.by)} wil voor ${S.klop.to}</small></div>`;
  else if (ph === 'was') call = `<div class="callout">Vuile was?<small>kijken of geloven</small></div>`;
  else if (ph === 'ronde') { const r = lastEv('ronde'); call = r ? `<div class="callout up">${r.winner === S.you ? 'Jij wint' : `${nameOf(r.winner)} wint`}<small>de ronde</small></div>` : ''; }
  else if (show) call = `<div class="callout up">${show.winner === S.you ? 'Jouw slag' : `Slag voor ${nameOf(show.winner)}`}<small>slag ${show.nr} van ${T.HAND}</small></div>`;
  else if (!cards.length) call = `<div class="callout">${S.turn === S.you ? 'Jij komt uit' : `${nameOf(S.turn)} komt uit`}<small>slag ${S.tricks + 1} van ${T.HAND}</small></div>`;
  const trick = cards.length ? `<div class="trick">${cards.map((t) => `<figure class="${t.p === winner ? 'win' : ''}">${cardHTML(t.card)}<figcaption>${t.p === S.you ? 'jij' : nameOf(t.p)}</figcaption></figure>`).join('')}</div>` : '';
  return `${pot}${trick}${call}`;
}

// je eigen kaarten; als je aan de beurt bent, kun je de kaarten die mogen aantikken
function handHTML(play) {
  if (!S.hand || !S.hand.length) return '';
  const busy = ui.sent === S.seq;
  return `<div class="hand${play ? ' mine' : ''}">${S.hand.map((c, k) => {
    const can = play && S.legal[k] && !busy;
    const inner = cardHTML(c, { cls: play && !S.legal[k] ? 'no' : '' });
    return can ? `<button class="cardbtn can" type="button" data-act="play" data-r="${c.r}" data-s="${c.s}" aria-label="Leg ${spoken(c)} op">${inner}</button>` : `<div class="cardbtn">${inner}</div>`;
  }).join('')}</div>`;
}

const standMini = () => `<div class="ministand">${S.players.map((p, i) => ({ p, i })).sort((a, b) => a.p.pts - b.p.pts).map(({ p, i }) => `<span class="${p.out ? 'out' : ''}" style="--pc:${PC[i % PC.length]}"><i></i>${i === S.you ? 'Jij' : esc(p.name)}<b>${p.pts}</b></span>`).join('')}</div>`;

function dockHTML() {
  return { klaar: klaarDock, ronde: rondeDock, klop: klopDock, was: wasDock }[S.phase]?.() || spelDock();
}

function spelDock() {
  const p = S.players[S.you];
  if (p.out) return `<div class="ask-h"><h2>Jij ligt eruit</h2></div><p class="sub">Je hebt ${S.limit} strafpunten of meer. Kijk mee tot er een winnaar is.</p>${standMini()}`;
  if (!p.inRound) return `<div class="ask-h"><h2>Jij hebt gepast</h2></div><p class="sub">Deze ronde speel je niet meer mee.</p><p class="waitline">Wachten op ${nameOf(S.turn)}</p>`;
  const mine = S.turn === S.you, t = S.trick, suit = t.length ? t[0].card.s : -1;
  const follow = suit >= 0 && S.hand.some((c) => c.s === suit);
  let head, sub;
  if (mine) {
    head = !t.length ? 'Jij komt uit' : follow ? `Bekennen: ${suitWord(suit)}` : 'Jij bent aan de beurt';
    sub = !t.length ? 'Kies een kaart. Die kleur moet de rest bekennen.'
      : follow ? `Leg een ${suitWord(suit)} op. De hoogste ${suitWord(suit)} wint de slag.` : `Je hebt geen ${suitWord(suit)}: leg een kaart naar keuze op.`;
  } else {
    head = `${nameOf(S.turn)} is aan de beurt`;
    sub = S.tricks === T.HAND - 1 ? 'De laatste slag: wie die wint, wint de ronde.' : `Slag ${S.tricks + 1} van ${T.HAND}. Wie de vierde slag wint, wint de ronde.`;
  }
  const btns = [];
  if (S.can.klop) btns.push(`<button class="abtn klop" type="button" data-act="klop" ${dis()}>Klop<small>voor ${S.stake + 1}</small></button>`);
  if (S.can.was) btns.push(`<button class="abtn" type="button" data-act="wasask" ${dis()}>Vuile was</button>`);
  if (S.can.kans) btns.push(`<button class="abtn gold" type="button" data-act="kans" ${dis()}>Kans op toep</button>`);
  const away = !mine && isHost() && S.players[S.turn] && !S.players[S.turn].connected
    ? `<p class="fine warn">${nameOf(S.turn)} is weg.</p><button class="abtn wide" type="button" data-act="playfor" ${dis()}>Speel voor ${nameOf(S.turn)} (de laagste kaart)</button>` : '';
  return `<div class="ask-h"><h2>${head}</h2></div><p class="sub">${sub}</p>${handHTML(mine)}${btns.length ? `<div class="btnrow">${btns.join('')}</div>` : ''}${away}`;
}

function klopDock() {
  const k = S.klop;
  if (k.wait.includes(S.you)) {
    return `<div class="ask-h"><h2>${nameOf(k.by)} klopt!</h2></div>
      <p class="sub">Er wordt nu gespeeld voor <b>${B.sipsText(k.to)}</b>. Ga je mee, of pas je? Passen kost <b>${B.sipsText(k.from)}</b>, en dan doe je deze ronde niet meer mee.</p>
      ${handHTML(false)}
      <div class="btnrow"><button class="abtn yes" type="button" data-act="mee" ${dis()}>Mee</button><button class="abtn no" type="button" data-act="pas" ${dis()}>Pas<small>${B.sipsText(k.from)}</small></button></div>`;
  }
  return `<div class="ask-h"><h2>${k.by === S.you ? 'Jij klopt' : `${nameOf(k.by)} klopt`}</h2></div>
    <p class="sub">Nu voor ${B.sipsText(k.to)}. Iedereen kiest: mee of passen.</p>
    <p class="waitline">Wachten op ${k.wait.map(nameOf).join(', ')}</p>${handHTML(false)}`;
}

function wasDock() {
  const w = S.was, by = nameOf(w.by);
  if (w.wait.includes(S.you)) {
    return `<div class="ask-h"><h2>${by}: vuile was!</h2></div>
      <p class="sub"><b>Kijken:</b> klopt het, dan krijg jij 1 strafpunt. Is het bluf, dan is ${by} betrapt en speelt met de eigen kaarten verder. <b>Geloven:</b> ${by} krijgt nieuwe kaarten.</p>
      <div class="btnrow"><button class="abtn" type="button" data-act="kijk" ${dis()}>Kijken</button><button class="abtn yes" type="button" data-act="geloof" ${dis()}>Geloven</button></div>`;
  }
  return `<div class="ask-h"><h2>${w.by === S.you ? 'Jij roept vuile was' : `${by} roept vuile was`}</h2></div>
    <p class="sub">De anderen kiezen: kijken of geloven.</p>
    <p class="waitline">Wachten op ${w.wait.map(nameOf).join(', ')}</p>${handHTML(false)}`;
}

function rondeDock() {
  const r = lastEv('ronde'), p = S.players[S.you];
  if (!r) return '';
  const won = r.winner === S.you, lost = r.losers.includes(S.you);
  const text = `${won ? 'Jij won' : `${nameOf(r.winner)} won`} de laatste slag. ${r.losers.length
    ? `${r.losers.map((i) => (i === S.you ? 'jij' : nameOf(i))).join(', ')} ${r.losers.length === 1 ? 'krijgt' : 'krijgen'} ${B.sipsText(r.stake)}.`
    : 'De rest had al gepast.'}`;
  const outs = r.out.length ? `<p class="sub">${r.out.map(nameOf).join(', ')} ${r.out.length === 1 ? 'heeft' : 'hebben'} ${S.limit} strafpunten en ${r.out.length === 1 ? 'ligt' : 'liggen'} eruit.</p>` : '';
  return `<div class="res-h ${won ? 'good' : lost ? 'bad' : ''}"><span class="verdict">${won ? 'Gewonnen!' : lost ? `+${r.stake}` : 'Ronde voorbij'}</span><span class="sub">${text}</span></div>
    ${outs}${standMini()}
    ${p.out ? '<p class="waitline">Wachten op de volgende ronde</p>' : `<button class="cta" type="button" data-act="next" ${dis()}><span>Volgende ronde</span>${ARR}</button>`}`;
}

function klaarDock() {
  const w = S.winner, toep = lastEv('toep');
  const why = toep && toep.player === w ? `${who(w)} ${w === S.you ? 'hebt' : 'heeft'} toep: vier dezelfde kaarten.` : `${who(w)} ${w === S.you ? 'bent' : 'is'} als laatste over.`;
  return `<div class="res-h good"><span class="verdict">${w === S.you ? 'Jij wint!' : `${nameOf(w)} wint!`}</span><span class="sub">${why}</span></div>
    ${standMini()}
    ${isHost()
      ? `<div class="optrow">Tot hoeveel strafpunten${limitSeg()}</div><button class="cta" type="button" data-act="opnieuw" ${dis()}><span>Nog een potje</span>${ARR}</button>`
      : `<p class="waitline">Wachten tot ${nameOf(S.host)} een nieuw potje start</p>`}`;
}

/* ================= VELLEN ================= */
function menuHTML() {
  const host = isHost(), game = S && S.phase !== 'lobby';
  return `${sheetTop('Menu')}
  <nav class="mlist">
    <button type="button" data-act="uitleg">Uitleg met plaatjes <span>›</span></button>
    <button type="button" data-act="rules">Spelregels <span>›</span></button>
    ${game ? '<button type="button" data-act="score">Stand <span>›</span></button>' : ''}
    <button type="button" data-act="mute">Geluid <span>${Snd.muted ? 'uit' : 'aan'}</span></button>
    ${S ? `<button type="button" data-act="share">Uitnodigen <span>${S.code}</span></button>` : ''}
    ${game && host ? '<button type="button" data-act="againask">Terug naar de lobby <span>›</span></button>' : ''}
    ${S ? '<button type="button" data-act="leaveask">Verlaat tafel <span>›</span></button>' : ''}
    <a href="/review?spel=toepen">Wat vind je ervan? <span>★</span></a>
    <a href="/melden?spel=toepen${S ? `&code=${S.code}` : ''}">Iets melden <span>›</span></a>
    <a href="/">Naar De Spelkeet <span>›</span></a>
  </nav>`;
}

function scoreHTML() {
  const rows = S.players.map((p, i) => ({ p, i })).sort((a, b) => a.p.pts - b.p.pts);
  return `${sheetTop('Stand')}
  <div class="scorecard"><table>
    <thead><tr><th>Speler</th><th>Strafpunten</th><th>Rondes gewonnen</th><th></th></tr></thead>
    <tbody>${rows.map(({ p, i }) => `<tr style="--pc:${PC[i % PC.length]}"><td><i></i>${esc(p.name)}</td><td>${p.pts}</td><td>${p.won}</td><td>${p.out ? 'af' : ''}</td></tr>`).join('')}</tbody>
  </table></div>
  <p class="sub">Er wordt gespeeld tot ${S.limit} strafpunten. Wie die haalt, ligt eruit; de laatste die overblijft, wint.</p>`;
}

function rulesHTML() {
  return `${sheetTop('Spelregels', 'Toepen')}
  <button class="ghostbtn rules-how" type="button" data-act="uitleg"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-2px;margin-right:6px"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>Bekijk de uitleg met plaatjes</button>
  <div class="rules">
    <p>Iedereen speelt op zijn eigen telefoon en ziet alleen zijn eigen kaarten. Er wordt gespeeld met 32 kaarten: de 7 tot en met de aas. Van laag naar hoog: <b>boer, vrouw, heer, aas, 7, 8, 9, 10</b>.</p>
    <h3>Een ronde</h3>
    <ol>
      <li><b>Delen.</b> Iedereen krijgt 4 kaarten. De speler na de deler komt uit.</li>
      <li><b>Bekennen.</b> Heb je de kleur die is uitgekomen, dan moet je die opleggen. Heb je hem niet, dan mag je elke kaart opleggen.</li>
      <li><b>De slag.</b> De hoogste kaart in de gevraagde kleur wint de slag. Wie de slag wint, komt de volgende keer uit.</li>
      <li><b>De laatste slag telt.</b> Wie de vierde slag wint, wint de ronde. De rest krijgt de inzet als strafpunten. Normaal is dat 1.</li>
    </ol>
    <h3>Kloppen</h3>
    <p>Denk je de laatste slag te winnen? Tik op <b>Klop</b>, wanneer je maar wilt. De inzet gaat dan één omhoog. De anderen kiezen meteen: <b>mee</b>, of <b>passen</b>. Wie past, krijgt de inzet van vóór de klop en doet deze ronde niet meer mee. Een ander mag daarna weer overkloppen, maar je kunt niet twee keer achter elkaar zelf kloppen. En niet hoger dan je zelf nog mag halen: sta je op 7 van de 10, dan klop je hooguit tot 3.</p>
    <h3>Vuile was</h3>
    <p>Alleen voor de eerste kaart van een ronde. Heb je vier plaatjes (boer, vrouw, heer), of drie plaatjes en een 7? Roep dan vuile was en ruil je hele hand voor vier nieuwe kaarten. Je mag ook bluffen. De anderen kiezen: <b>kijken</b> of <b>geloven</b>. Klopt het en keek je, dan krijg jij 1 strafpunt. Was het bluf en keek er iemand, dan is de bluffer betrapt en speelt hij met zijn eigen kaarten verder. Gelooft iedereen het, dan krijgt hij nieuwe kaarten.</p>
    <h3>Kans op toep</h3>
    <p>Ook alleen voor de eerste kaart. Heb je drie dezelfde kaarten? Ruil dan de vierde voor een nieuwe. Krijg je zo vier dezelfde (toep), dan win je meteen het hele spel. Bluffen kan hier niet. Wie bij het delen meteen vier dezelfde krijgt, wint ook.</p>
    <h3>Winnen</h3>
    <p>De host kiest of jullie tot 10 of tot 15 strafpunten spelen. Wie dat haalt, ligt eruit. Wie als laatste overblijft, wint Toepen.</p>
    <p class="small">Is iemand weg? Bij een klop gaat hij vanzelf mee en een vuile was gelooft hij. Is hij aan de beurt, dan kan de host een kaart voor hem opleggen: de laagste die mag. Tijdens een potje kan er niemand aanschuiven. Wat een strafpunt is, spreken jullie samen af.</p>
  </div>`;
}

function openSheet(key, html) { ui.sheet = { key, html }; renderSheet(); }
function closeSheet() { ui.sheet = null; renderSheet(); }

function renderSheet() {
  const ov = $('#overlay'), sh = $('#sheet');
  if (!ui.sheet) { if (!ov.hidden) { ov.hidden = true; sh.innerHTML = ''; } ui.sheetHtml = null; return; }
  const wasHidden = ov.hidden;
  if (!wasHidden && ui.sheetHtml === ui.sheet.html) return;
  sh.innerHTML = ui.sheet.html;
  sh.classList.toggle('anim', wasHidden);
  ov.hidden = false;
  ui.sheetHtml = ui.sheet.html;
  if (wasHidden) { const first = sh.querySelector('button, a'); if (first) first.focus({ preventScroll: true }); }
}

function toast(msg, cls = '') {
  const box = $('#toasts'), el = document.createElement('div');
  // dezelfde melding nog in beeld (bijvoorbeeld na een paar keer tikken)? Dan alleen de nieuwe
  for (const old of box.querySelectorAll('div:not(.net)')) if (old.textContent === msg) old.remove();
  el.textContent = msg; if (cls) el.className = cls;
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 2800);
}

function netPill() {
  const box = $('#toasts');
  let el = box.querySelector('.net');
  const bad = S && Net.status !== 'open';
  if (bad && !el) { el = document.createElement('div'); el.className = 'net'; el.textContent = 'Verbinding kwijt, opnieuw verbinden…'; box.prepend(el); }
  if (!bad && el) el.remove();
}

function celebrate() {
  if (reduce) return;
  const box = $('#confetti'), cols = ['#f7c548', '#d690c9', '#ff6b8b', '#2fbf71', '#ff7a00', '#f3efdb'];
  box.innerHTML = Array.from({ length: 70 }, () => `<i style="left:${(Math.random() * 100).toFixed(1)}%;background:${cols[Math.floor(Math.random() * cols.length)]};--t:${(2.4 + Math.random() * 2).toFixed(2)}s;--dl:${(Math.random() * .6).toFixed(2)}s;--x:${Math.round((Math.random() - .5) * 160)}px;--r:${Math.round(360 + Math.random() * 720)}deg"></i>`).join('');
  setTimeout(() => { box.innerHTML = ''; }, 5200);
}

/* ================= TEKENEN ================= */
function view() {
  if (!S) return 'home';
  if (S.phase === 'lobby') return 'lobby';
  return 'spel';
}

function render() {
  const v = view();
  // een nieuwe stap: het dock springt even op
  const step = S ? `${v}:${S.phase}:${S.turn}:${S.tricks}:${S.round}` : v;
  ui.dockPop = step !== ui.lastStep;
  ui.lastStep = step;
  document.documentElement.dataset.view = v;
  const scr = $('#screen');
  const nameIn = $('#nameIn'), codeIn = $('#codeIn');
  if (nameIn) ui.name = nameIn.value;
  if (codeIn) ui.code = codeIn.value;
  const keep = v === ui.lastView ? scr.scrollTop : 0;
  const html = { home: vHome, lobby: vLobby, spel: vSpel }[v]();
  scr.classList.toggle('is-game', v !== 'home');
  scr.innerHTML = `<div class="view v-${v}${v !== 'home' ? ' game' : ''}">${html}</div>`;
  placeSeats();
  scr.scrollTop = keep;
  ui.lastView = v;
  const own = $('#owe');
  if (S && S.phase !== 'lobby') {
    const n = S.players[S.you].pts;
    own.hidden = false;
    own.classList.toggle('zero', !n);
    own.innerHTML = `${STRAF}${n}`;
    own.setAttribute('aria-label', `Jij hebt ${B.sipsText(n)}`);
  } else own.hidden = true;
  if (ui.sheet && ui.sheet.key === 'menu') ui.sheet.html = menuHTML();
  if (ui.sheet && ui.sheet.key === 'score' && S) ui.sheet.html = scoreHTML();
  renderSheet();
  netPill();
}

/* ================= BEDIENING ================= */
function myName() {
  const input = $('#nameIn');
  const name = T.cleanNames([input ? input.value : ui.name])[0] || '';
  if (!name) { ui.error = 'Vul eerst je naam in.'; render(); const n = $('#nameIn'); if (n) n.focus(); return null; }
  me.name = name; ui.name = name; store.set(KEY.me, me);
  return name;
}

function joinWith(code) {
  const name = myName();
  if (!name) return;
  code = String(code || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (code.length !== 4) { ui.error = 'Vul de code van 4 letters in.'; render(); return; }
  ui.joining = true; ui.error = ''; ui.code = code;
  Snd.ac();
  Net.go({ t: 'join', code, name, token: me.token });
  render();
}

// een zet sturen en even wachten op de server, zodat een dubbele tik niet twee keer telt
function move(msg) {
  Snd.ac();
  const seq = S.seq;
  ui.sent = seq;
  Net.send(msg);
  setTimeout(() => { if (ui.sent === seq) { ui.sent = -1; render(); } }, 2500);
  render();
}

const actions = {
  create() {
    const name = myName();
    if (!name) return;
    ui.joining = true; ui.error = '';
    Snd.ac();
    Net.go({ t: 'create', name, token: me.token });
    render();
  },
  start() { Snd.ac(); Net.send({ t: 'start' }); },
  limit(el) { Snd.chip(); Net.send({ t: 'settings', limit: +el.dataset.n }); },
  share() {
    const url = `${location.origin}/toepen/${S.code}`, text = `Doe mee met Toepen aan tafel ${S.code}`;
    closeSheet();
    if (navigator.share) navigator.share({ title: 'Toepen', text, url }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Link gekopieerd'), () => toast(url));
    else toast(url);
  },
  kickask(el) {
    const i = +el.dataset.seat;
    openSheet('kick', `${sheetTop(`${nameOf(i)} van tafel halen?`)}
      <p>${nameOf(i)} kan daarna opnieuw meedoen met de code.</p>
      <button class="cta" type="button" data-act="kick" data-seat="${i}"><span>Ja, van tafel halen</span>${ARR}</button>
      <button class="ghostbtn" type="button" data-act="close">Nee</button>`);
  },
  kick(el) { Net.send({ t: 'kick', seat: +el.dataset.seat }); closeSheet(); },
  play(el) { Snd.chip(); move({ t: 'play', card: { r: +el.dataset.r, s: +el.dataset.s } }); },
  playfor() { move({ t: 'play' }); },
  klop() { move({ t: 'klop' }); },
  mee() { move({ t: 'mee' }); },
  pas() { move({ t: 'pas' }); },
  wasask() {
    openSheet('was', `${sheetTop('Vuile was roepen?')}
      <p>Vier plaatjes (boer, vrouw, heer), of drie plaatjes en een 7: dan ruil je je hele hand voor vier nieuwe kaarten. Je mag ook bluffen.</p>
      <p>De anderen kiezen kijken of geloven. Klopt het, dan krijgt wie keek 1 strafpunt. Was het bluf en keek er iemand, dan speel je met je eigen kaarten verder.</p>
      <button class="cta" type="button" data-act="was"><span>Ja, vuile was!</span>${ARR}</button>
      <button class="ghostbtn" type="button" data-act="close">Nee</button>`);
  },
  was() { closeSheet(); move({ t: 'was' }); },
  kijk() { move({ t: 'kijk' }); },
  geloof() { move({ t: 'geloof' }); },
  kans() { move({ t: 'kans' }); },
  next() { move({ t: 'next' }); },
  opnieuw() { move({ t: 'opnieuw' }); },
  mine() {
    const n = S.players[S.you].pts;
    toast(n ? `Jij hebt ${B.sipsText(n)} van de ${S.limit}` : 'Jij hebt nog geen strafpunten');
  },
  menu() { openSheet('menu', menuHTML()); },
  uitleg() { closeSheet(); window.Uitleg?.open('toepen'); },
  rules() { openSheet('rules', rulesHTML()); },
  score() { openSheet('score', scoreHTML()); },
  mute() { Snd.muted = !Snd.muted; store.set(KEY.mute, Snd.muted); if (!Snd.muted) Snd.chip(); openSheet('menu', menuHTML()); },
  againask() {
    openSheet('again', `${sheetTop('Terug naar de lobby?')}
      <p>De stand begint dan opnieuw. In de lobby kunnen nieuwe spelers aanschuiven en kun je spelers van tafel halen.</p>
      <button class="cta" type="button" data-act="again"><span>Ja, terug naar de lobby</span>${ARR}</button>
      <button class="ghostbtn" type="button" data-act="close">Nee, verder spelen</button>`);
  },
  again() { Net.send({ t: 'again' }); closeSheet(); },
  leaveask() {
    openSheet('leave', `${sheetTop('Tafel verlaten?')}
      <p>${S && S.phase !== 'lobby' ? 'Met de code kom je terug op je eigen plek, met je eigen stand.' : 'Met de code kun je later weer aanschuiven.'}</p>
      <button class="cta" type="button" data-act="leave"><span>Ja, verlaten</span>${ARR}</button>
      <button class="ghostbtn" type="button" data-act="close">Nee, blijven</button>`);
  },
  leave() { Net.send({ t: 'leave' }); leaveLocal(); },
  close: closeSheet,
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled && actions[el.dataset.act]) { actions[el.dataset.act](el); return; }
  if (e.target === $('#overlay')) closeSheet();
});
document.addEventListener('submit', (e) => { if (e.target.id === 'joinForm') { e.preventDefault(); joinWith($('#codeIn').value); } });
document.addEventListener('input', (e) => {
  if (e.target.id === 'codeIn') { const v = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); if (v !== e.target.value) e.target.value = v; }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#overlay').hidden) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'nameIn') { e.preventDefault(); const c = $('#codeIn'); if (c && c.value.length === 4) joinWith(c.value); else if (c) c.focus(); }
});
addEventListener('resize', placeSeats);

/* ================= START ================= */
// zat je net nog aan een tafel (en open je niet een andere link)? Dan meteen terug op je plek.
const lastTable = store.get(KEY.table, null);
if (lastTable && typeof lastTable.code === 'string' && (!urlCode || urlCode === lastTable.code)) {
  ui.joining = true;
  Net.go({ t: 'join', code: lastTable.code, name: me.name, token: me.token });
}
render();
if (urlCode && !ui.joining) { const n = $('#nameIn'); if (n && !n.value) n.focus(); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeSeats);
</script>
</body>
</html>
