  <!-- de vraag: welke kaart? -->
  <circle cx="390" cy="380" r="62" fill="#a28fe3" stroke="#f3efdb" stroke-width="10"/>
  <text x="390" y="408" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="84" fill="#fff">?</text>
