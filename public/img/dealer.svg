<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="vilt" cx="50%" cy="38%" r="72%"><stop offset="0" stop-color="#35a862"/><stop offset=".55" stop-color="#21823f"/><stop offset="1" stop-color="#125a2e"/></radialGradient>
    <pattern id="rug" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="22" height="22" fill="#3a1d43"/><rect width="5" height="22" fill="#a28fe3" fill-opacity=".5"/></pattern>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#vilt)"/>
  <rect x="26" y="26" width="460" height="460" rx="90" fill="none" stroke="#f7c548" stroke-opacity=".4" stroke-width="6"/>
  <!-- de stapel van de dealer -->
  <g transform="rotate(-12 190 260)">
    <rect x="104" y="146" width="176" height="246" rx="22" fill="url(#rug)" stroke="#f3efdb" stroke-width="12" transform="translate(14 12)"/>
    <rect x="104" y="146" width="176" height="246" rx="22" fill="url(#rug)" stroke="#f3efdb" stroke-width="12"/>
  </g>
  <!-- de bovenste kaart: schoppen aas -->
