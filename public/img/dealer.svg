    <rect x="228" y="100" width="176" height="246" rx="22" fill="#fffdf4" stroke="#e4dec2" stroke-width="4"/>
    <text x="252" y="150" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="46" fill="#24132a">A</text>
    <path transform="translate(316 232) scale(1.25)" d="M0 -46 C18 -24 44 -10 44 12 C44 30 26 38 10 30 C12 40 16 48 22 54 H-22 C-16 48 -12 40 -10 30 C-26 38 -44 30 -44 12 C-44 -10 -18 -24 0 -46 Z" fill="#24132a"/>
