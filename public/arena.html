<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena</title>
<meta name="description" content="Arena: het wedspel met minispellen. Twee spelers vechten een duel uit op hun eigen telefoon, de rest zet munten in op wie er wint.">
<meta name="theme-color" content="#0c0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arena">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/arena.webmanifest">
<link rel="icon" href="/img/arena.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/arena-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;700&family=Sofia+Sans+Extra+Condensed:wght@500;700;800;900&display=swap">
<style>
:root{
  /* De arena: een donkere vloer onder de schijnwerpers, links de rode hoek en rechts de blauwe. Bovenaan de spelers
     in een rij met hun munten, in het midden het duel, onderin een donkere actiebalk. */
  --night:#0c0a14;
  --night-3:#050408;
  --cream:#f3efdb;
  --cream-2:#e4dec2;
  --cream-3:#d6cfae;
  --plum:#1d1630;
  --plum-2:#5d5378;
  --red:#ff4d5e;
  --red-2:#c9283a;
  --blue:#4f8dff;
  --blue-2:#2a62d8;
  --gold:#ffc94d;
  --good:#3ee07f;
  --bad:#ff5a64;
  --ink-soft:#bdb6d0;
  --glass:rgba(255,255,255,.08);
  --glass-line:rgba(255,255,255,.24);
  --glow:var(--gold);
  --display:"Sofia Sans Extra Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --mono:"Martian Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --read:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --s1:11px; --s2:13px; --s3:15px;
  color-scheme:dark;
}
html[data-view="lobby"],html[data-view="home"]{--glow:var(--red)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{background:var(--night)}
body{margin:0;background:radial-gradient(120% 90% at 50% 26%,#2a1c3f 0%,var(--night) 55%,var(--night-3) 100%) fixed;color:var(--cream);font-family:var(--mono);font-size:var(--s2);line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:800;letter-spacing:0}
p{margin:0}
.glow{position:fixed;left:50%;top:-34vh;width:150vw;max-width:1100px;height:70vh;transform:translateX(-50%);background:radial-gradient(closest-side,var(--glow),transparent);opacity:.22;pointer-events:none;z-index:0;transition:background .6s}
.stars{position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.55) 1px,transparent 1.6px),radial-gradient(rgba(255,201,77,.5) 1px,transparent 1.6px);background-size:61px 67px,97px 89px;background-position:0 0,31px 43px;opacity:.12;pointer-events:none;z-index:0}

/* ---------- vaste UI ---------- */
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px 6px}
.bar-r{display:flex;gap:8px}
.glass{background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -6px 14px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.35)}
.round{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;color:var(--cream)}
.round:hover{background:rgba(255,255,255,.14)}
.owe{display:inline-flex;align-items:center;gap:5px;height:42px;padding:0 13px;border-radius:999px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.owe svg{width:16px;height:16px}
.owe.zero{color:var(--ink-soft)}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:900;font-size:24px;line-height:1;letter-spacing:.06em;color:var(--cream);white-space:nowrap}
.brand svg{width:24px;height:24px;color:var(--red);flex:none}

.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.screen.is-game{padding-bottom:0}
.view{display:flex;flex-direction:column;gap:14px;min-height:100%}
.view.game{display:grid;grid-template-rows:minmax(300px,1fr) auto;height:100%;min-height:0;gap:0}

.kick{font-size:var(--s1);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.cream{background:var(--cream);color:var(--plum);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.chip{display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;background:var(--plum);color:var(--cream);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.3}
.chip.line{background:transparent;color:var(--plum);box-shadow:inset 0 0 0 1px rgba(29,22,48,.35)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cta,.dock .cta{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:60px;border-radius:18px;padding:8px 9px 8px 20px;font-family:var(--display);font-weight:700;font-size:25px;line-height:1.1;color:#fff;text-decoration:none;text-align:left;background:linear-gradient(90deg,#7a1424 0%,#d2343f 50%,#ff8f5a 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 12px 24px -14px rgba(0,0,0,.85);transition:filter .2s,transform .2s}
.cta:hover{filter:brightness(1.1)}
.cta:active{transform:translateY(1px)}
.cta .arr{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.2);flex:none}
.cta:disabled{background:var(--cream-2);color:var(--plum-2);box-shadow:inset 0 0 0 1.5px rgba(29,22,48,.2);filter:none;transform:none}
.cta:disabled .arr{background:rgba(29,22,48,.08)}
.dock .cta:disabled{background:rgba(255,255,255,.08);color:var(--ink-soft);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.ghostbtn{display:block;width:100%;border-radius:16px;padding:14px 20px;font-size:var(--s2);font-weight:700;color:var(--plum);box-shadow:inset 0 0 0 1px rgba(29,22,48,.3);text-decoration:none;text-align:center}
.howrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.howrow .ghostbtn{padding-left:10px;padding-right:10px;white-space:nowrap}
.rules-how{margin:0 0 14px}
.ghostbtn:hover{background:var(--cream-2)}
.linkbtn{justify-self:start;padding:4px 0;font-size:var(--s1);font-weight:700;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
.linkbtn.warn{color:var(--gold)}

/* ---------- de arena ---------- */
/* Het veld vult het scherm; de spelers staan in een rij erboven, jij als eerste. */
.table{position:relative;min-height:0;container-type:size;margin:4px -6px 8px;--rij:62px;--strook:74px}
.rail{position:absolute;inset:calc(var(--strook) + 6px) 1.5% 2%;border-radius:34px;background:linear-gradient(180deg,#4a4458 0%,#18141f 45%,#07060a 100%);box-shadow:0 26px 60px rgba(0,0,0,.7),0 0 0 1.5px rgba(255,201,77,.75),inset 0 2px 0 rgba(255,255,255,.22),inset 0 -4px 10px rgba(0,0,0,.6)}
.felt{position:absolute;inset:calc(var(--strook) + 15px) calc(1.5% + 9px) calc(2% + 9px);border-radius:26px;overflow:hidden;background:radial-gradient(ellipse 60% 90% at 0% 50%,rgba(255,77,94,.42),transparent 70%),radial-gradient(ellipse 60% 90% at 100% 50%,rgba(79,141,255,.42),transparent 70%),radial-gradient(ellipse 70% 55% at 50% 40%,#3a3158 0%,#1c1730 55%,#100d1c 100%);box-shadow:inset 0 0 0 2px rgba(255,201,77,.55),inset 0 10px 40px rgba(0,0,0,.45),inset 0 -20px 50px rgba(0,0,0,.45)}
.felt::before{content:"";position:absolute;left:50%;top:10%;bottom:10%;width:0;border-left:1.5px dashed rgba(255,255,255,.13)}
.center{position:absolute;left:50%;top:calc(var(--strook) + (100% - var(--strook)) / 2);z-index:2;transform:translate(-50%,-50%);width:90cqw;display:grid;justify-items:center;gap:1.6cqh;text-align:center}
.table:has(.banner) .center{opacity:.08;transition:opacity .15s}
.pot{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:rgba(243,239,219,.88);white-space:nowrap}
.pot i{width:3px;height:3px;border-radius:50%;background:rgba(243,239,219,.5)}
.felt-logo{font-family:var(--display);font-weight:900;font-size:min(20cqw,110px);line-height:.8;letter-spacing:.02em;text-transform:uppercase;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25),0 0 30px rgba(255,255,255,.2)}
.felt-logo.small{font-size:min(17cqw,84px);line-height:.86}
.felt-logo.code{letter-spacing:.14em;margin-right:-.14em;color:var(--gold);text-shadow:0 4px 0 rgba(90,52,0,.5),0 0 30px rgba(255,201,77,.35)}
.felt-sub{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,239,219,.78)}
.bigword{font-family:var(--display);font-weight:900;font-size:min(15cqw,calc((100cqh - var(--strook)) * .16),76px);line-height:.88;text-transform:uppercase;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.3),0 0 30px rgba(255,255,255,.25)}
.bigword.gold{color:var(--gold);text-shadow:0 4px 0 rgba(90,52,0,.5),0 0 30px rgba(255,201,77,.4)}
.spelnaam{font-family:var(--display);font-weight:900;font-size:min(11.5cqw,calc((100cqh - var(--strook)) * .12),56px);line-height:.9;text-transform:uppercase;color:var(--gold);text-shadow:0 3px 0 rgba(90,52,0,.5)}
.detail{font-family:var(--read);font-size:14px;font-weight:600;color:rgba(243,239,219,.9)}
.banner{position:absolute;inset:var(--strook) 0 0;z-index:6;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;pointer-events:none;background:radial-gradient(closest-side,rgba(5,4,8,.86),rgba(5,4,8,0));animation:banner 2s ease both}
.banner-t{font-family:var(--display);font-weight:900;font-size:min(15cqw,74px);line-height:.85;text-transform:uppercase;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(255,77,94,.5);max-width:80cqw}
@keyframes banner{0%{opacity:0;transform:scale(.85)}14%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

/* de twee in de arena: links de rode hoek, rechts de blauwe */
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:2.5cqw;width:100%}
.fighter{--kant:var(--red);--fava:min(17cqw,calc((100cqh - var(--strook)) * .17),76px);display:grid;justify-items:center;gap:3px;min-width:0;padding:10px 6px 9px;border-radius:20px;background:rgba(0,0,0,.34);border:2px solid var(--kant);box-shadow:0 0 26px -8px var(--kant),inset 0 1px 0 rgba(255,255,255,.1);color:#fff;transition:opacity .3s,transform .15s,box-shadow .2s}
.fighter.blauw{--kant:var(--blue)}
.fava{display:grid;place-items:center;width:var(--fava);height:var(--fava);border-radius:50%;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.55),rgba(255,255,255,0) 46%),var(--pc);box-shadow:0 0 0 3px #0c0a14,0 0 0 5.5px var(--kant),0 10px 20px rgba(0,0,0,.55);font-family:var(--display);font-weight:900;font-size:calc(var(--fava) * .52);line-height:1;text-shadow:0 2px 4px rgba(0,0,0,.35)}
.fighter b{max-width:100%;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--display);font-weight:900;font-size:min(8cqw,30px);line-height:1}
.fighter small{min-height:1.3em;font-family:var(--read);font-size:12.5px;font-weight:600;color:rgba(243,239,219,.82);line-height:1.3}
.fighter small svg{width:26px;height:26px;vertical-align:middle}
.fighter.win{border-color:var(--gold);box-shadow:0 0 34px -4px rgba(255,201,77,.8),inset 0 1px 0 rgba(255,255,255,.1)}
.fighter.win small{color:var(--gold)}
.fighter.lose{opacity:.55}
.fighter.lose small{color:var(--bad)}
button.fighter:active{transform:scale(.97)}
button.fighter[aria-pressed="true"]{background:color-mix(in srgb,var(--kant) 34%,rgba(0,0,0,.4));box-shadow:0 0 0 3px #fff,0 0 34px -4px var(--kant)}
.vsx{font-family:var(--display);font-weight:900;font-size:min(10cqw,44px);line-height:1;color:var(--gold);text-shadow:0 3px 0 rgba(90,52,0,.6),0 0 22px rgba(255,201,77,.4);white-space:nowrap}
.bcs{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:22px;margin-top:3px}
.bc{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 7px 0 3px;border-radius:999px;background:rgba(255,255,255,.12);font-style:normal;font-size:10.5px;font-weight:700;color:#fff}
.bc::before{content:attr(data-i);display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--pc);font-family:var(--display);font-weight:900;font-size:11px;line-height:1}
.bc u{text-decoration:none;color:var(--gold)}
.bc.ok{background:rgba(62,224,127,.22);box-shadow:inset 0 0 0 1px rgba(62,224,127,.6)}
.bc.mis{background:rgba(255,90,100,.2);box-shadow:inset 0 0 0 1px rgba(255,90,100,.55)}
.bc.mis u{color:var(--bad)}
.bc.none{padding:0 8px;background:none;color:rgba(243,239,219,.4);font-weight:500}
.bc.none::before{content:none}
.dbig{min-height:1em;font-family:var(--display);font-weight:900;font-size:min(13cqw,calc((100cqh - var(--strook)) * .13),60px);line-height:1;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.dbig.go{color:var(--good);text-shadow:0 0 26px rgba(62,224,127,.6)}
.dbig.wait{color:var(--bad)}
.dbig.klein{font-size:min(7cqw,26px);color:rgba(243,239,219,.8)}

/* het grote tikvlak voor wie zelf in de arena staat */
.pad{position:absolute;inset:calc(var(--strook) + 15px) calc(1.5% + 9px) calc(2% + 9px);z-index:4;display:grid;place-content:center;justify-items:center;gap:6px;padding:16px;border-radius:26px;text-align:center;color:#fff;background:linear-gradient(180deg,#34304a,#17142a);box-shadow:inset 0 0 0 3px rgba(255,255,255,.16),inset 0 -14px 30px rgba(0,0,0,.35);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden}
.pad *{pointer-events:none}
.padk{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.pad b{font-family:var(--display);font-weight:900;font-size:min(30cqw,calc((100cqh - var(--strook)) * .34),150px);line-height:.9;font-variant-numeric:tabular-nums;text-shadow:0 5px 0 rgba(0,0,0,.25)}
.pad span.ps{min-height:1.4em;font-family:var(--read);font-size:16px;font-weight:600;color:rgba(255,255,255,.92)}
.pad.wait{background:linear-gradient(180deg,#e0384a,#8f1525)}
.pad.go{background:linear-gradient(180deg,#3fe487,#109a4c)}
.pad.go:active{filter:brightness(1.15)}
.pad.count{background:linear-gradient(180deg,#3d3760,#1b1733)}
.pad.done{background:linear-gradient(180deg,#2c2940,#131022)}
.pad.early{background:linear-gradient(180deg,#5a1a24,#2a0b10)}
.padbar{position:absolute;left:0;right:0;bottom:0;height:10px;background:rgba(0,0,0,.3)}
.padbar u{display:block;height:100%;width:0;background:#fff;opacity:.85}

/* de nepseintjes bij Valse start: een andere kleur dan groen */
.pad.nep.n0{background:linear-gradient(180deg,#ffab3d,#e0720a)}
.pad.nep.n1{background:linear-gradient(180deg,#5aa0ff,#2358d6)}
.pad.nep.n2{background:linear-gradient(180deg,#b574ff,#6d2bd0)}
.dbig.nep{color:#ffab3d}
/* Snelle som en Welke kleur?: de vraag groot in beeld, de antwoorden als knoppen */
.vraag{min-height:1em;font-family:var(--display);font-weight:900;font-size:min(22cqw,calc((100cqh - var(--strook)) * .26),120px);line-height:.95;color:#fff;text-transform:uppercase;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 5px 0 rgba(0,0,0,.35)}
.vraag.klein{font-size:min(13cqw,calc((100cqh - var(--strook)) * .13),60px)}
.quiz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quiz.kleur{grid-template-columns:repeat(2,minmax(0,1fr))}
.ans{min-height:68px;border-radius:18px;font-family:var(--display);font-weight:900;font-size:34px;line-height:1;color:var(--plum);background:linear-gradient(180deg,#fffdf4,#e4dec2);box-shadow:inset 0 -3px 0 rgba(29,22,48,.2),0 12px 24px -14px rgba(0,0,0,.85);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.ans *{pointer-events:none}
.quiz.kleur .ans{min-height:58px;font-size:27px;text-transform:uppercase;color:#fff;background:var(--k);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.quiz.kleur .ans.licht{color:#3a2c00;text-shadow:none}
.quiz.dicht .ans{background:rgba(255,255,255,.08);box-shadow:none;pointer-events:none}
.quiz.dicht .ans span{visibility:hidden}
.ans:disabled{opacity:.3}
.ans.sel:disabled{opacity:1;box-shadow:0 0 0 3px #fff,0 12px 24px -14px rgba(0,0,0,.85)}
.dock:has(.quiz:not(.dicht):not(.klaar)){border-top-color:var(--glow);box-shadow:0 -14px 40px rgba(0,0,0,.45),0 -3px 22px -6px var(--glow)}

/* de eindstand */
.rank{display:grid;gap:3px;width:min(86cqw,360px);margin-top:2px}
.rank div{display:grid;grid-template-columns:22px 14px minmax(0,1fr) auto;align-items:center;gap:6px;padding:0 12px;height:min(calc((100cqh - var(--strook)) * .068),30px);border-radius:10px;background:rgba(0,0,0,.34);font-size:12px;font-weight:700;text-align:left}
.rank div.top{background:rgba(255,201,77,.2);box-shadow:inset 0 0 0 1.5px rgba(255,201,77,.7)}
.rank div.low{box-shadow:inset 0 0 0 1.5px rgba(255,90,100,.6)}
.rank div.me b{color:var(--gold)}
.rank em{font-style:normal;color:rgba(243,239,219,.6)}
.rank i{width:11px;height:11px;border-radius:50%;background:var(--pc)}
.rank b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:19px;line-height:1}
.rank span{display:inline-flex;align-items:center;gap:4px;color:var(--gold);font-variant-numeric:tabular-nums}
.rank svg{width:12px;height:12px}

/* stoelen */
.seat{--ava:40px;position:absolute;left:50%;top:50%;z-index:3;width:var(--ava);height:var(--ava);margin:calc(var(--ava) / -2) 0 0 calc(var(--ava) / -2);display:block;color:var(--cream);transition:opacity .3s,filter .3s}
.ava{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.55),rgba(255,255,255,0) 46%),var(--pc);box-shadow:0 0 0 3px #0c0a14,0 0 0 4.5px rgba(255,255,255,.22),0 10px 20px rgba(0,0,0,.55);font-family:var(--display);font-weight:900;font-size:calc(var(--ava) * .52);line-height:1;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.35);transition:transform .1s}
.seat.empty .ava{background:rgba(0,0,0,.35);box-shadow:0 0 0 2px rgba(255,255,255,.18);color:rgba(255,255,255,.55);border:1.5px dashed rgba(255,255,255,.35)}
.seat.off .ava{filter:grayscale(1) brightness(.7)}
.seat.now .ava{box-shadow:0 0 0 3px #0c0a14,0 0 0 5px var(--gold),0 0 26px rgba(255,201,77,.6),0 10px 20px rgba(0,0,0,.55)}
.seat.rood .ava{box-shadow:0 0 0 3px #0c0a14,0 0 0 5px var(--red),0 0 22px rgba(255,77,94,.7),0 10px 20px rgba(0,0,0,.55)}

<script type="module">
import * as A from '/shared/arena.js';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
// vaste kleur per stoel aan tafel
const PC = ['#4f8dff', '#d690c9', '#ff7a00', '#2fbf71', '#f7c548', '#ff4a24', '#a28fe3', '#36c5d6', '#e86aa0', '#9ccf3c'];
const ARR = '<span class="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';
// een strafkaart: zo zie je de strafpunten
const STRAF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="3" width="11" height="17" rx="2.2" transform="rotate(14 12 11.5)"/><path d="M12.4 8.2v4.4M12.1 15.6v.2" stroke-linecap="round"/></svg>';
// een munt
const MUNT = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><circle cx="12" cy="12" r="6.2" fill="none" stroke="rgba(0,0,0,.38)" stroke-width="1.8"/></svg>';
const SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
// steen, papier en schaar als eigen tekeningetjes
const ICO = {
  steen: '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 31c-3-8 2-18 12-20 7-2 14 0 18 6 4 7 3 15-4 19-8 5-22 5-26-5z" fill="currentColor"/><path d="M16 23c2-4 6-7 11-7" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.6" stroke-linecap="round"/></svg>',
  papier: '<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="11" y="6" width="26" height="36" rx="3.5" fill="currentColor"/><path d="M17 16h14M17 23h14M17 30h9" stroke="rgba(128,128,128,.75)" stroke-width="2.6" stroke-linecap="round"/></svg>',
  schaar: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" aria-hidden="true"><circle cx="13" cy="36" r="6"/><circle cx="35" cy="36" r="6"/><path d="M17 31L33 6M31 31L15 6"/></svg>',
};
const INKT = { rood: '#ff4d5e', blauw: '#4f8dff', groen: '#3ee07f', geel: '#ffd23f' };
const NEP_TEKST = ['TIK!', 'NU!', 'JA!'];   // de nepseintjes doen alsof, maar alleen groen telt
const SPS_NAAM = { steen: 'Steen', papier: 'Papier', schaar: 'Schaar' };
const munten = (n) => `${n} ${n === 1 ? 'munt' : 'munten'}`;
const straf = (n) => `${n} ${n === 1 ? 'strafpunt' : 'strafpunten'}`;
const sec = (ms) => (ms / 1000).toFixed(2).replace('.', ',');
// Stop op 0: wat stond er op de klok toen je stopte (na de 0 loopt hij door in de min)
const klok = (ms) => { const r = A.STOP_DOEL - ms; return r < 0 ? `−${sec(-r)}` : sec(r); };

/* ================= OPSLAG (alleen gemak, per telefoon) ================= */
const KEY = { me: 'arena-ik', table: 'arena-tafel', mute: 'arena-stil' };
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k) ?? 'null'); return v ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* opslag niet beschikbaar */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* idem */ } },
};

// wie ben ik: een geheime sleutel per telefoon, zodat je na wegvallen op je eigen plek terugkomt.
// Je naam neemt hij over van een ander spel in De Spelkeet als je die daar al eens hebt ingevuld.
const me = (() => {
  const v = store.get(KEY.me, {}) || {};
  let token = typeof v.token === 'string' && /^[A-Za-z0-9_-]{16,64}$/.test(v.token) ? v.token : null;
  if (!token) {
    const abc = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_', a = new Uint8Array(24);
    crypto.getRandomValues(a);
    token = [...a].map((x) => abc[x & 63]).join('');
  }
  const name = typeof v.name === 'string' && v.name ? v.name : ['bussen-ik', 'boer-ik', 'mexen-ik', 'dealer-ik', 'paard-ik', 'rotonde-ik', 'mijn-ik', 'bord-ik'].map((k) => (store.get(k, {}) || {}).name).find((n) => typeof n === 'string' && n);
  const o = { token, name: typeof name === 'string' ? name.slice(0, A.NAME_MAX) : '' };
  store.set(KEY.me, o);
  return o;
})();
const urlCode = ((location.pathname.match(/^\/arena\/([A-Za-z]{4})$/) || [])[1] || new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);

/* ================= GELUID ================= */
const Snd = {
  ctx: null, out: null, muted: !!store.get(KEY.mute, false),
  ac() {
    if (this.muted) return null;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.out = this.ctx.createDynamicsCompressor();
      this.out.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(f, d, { type = 'sine', vol = .15, at = 0, slide = 0, lp = 0 } = {}) {
    const c = this.ac(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    let node = o;
    if (lp) { const f2 = c.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = lp; o.connect(f2); node = f2; }
    node.connect(g); g.connect(this.out); o.start(t); o.stop(t + d + .05);
  },
  noise(d, { vol = .2, at = 0, freq = 2600 } = {}) {
    const c = this.ac(); if (!c) return;
    const t = c.currentTime + at, len = Math.ceil(c.sampleRate * d), buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = .9; g.gain.value = vol;
    src.connect(bp); bp.connect(g); g.connect(this.out); src.start(t);
  },
  chip() { this.tone(2400, .04, { type: 'triangle', vol: .08 }); this.tone(1800, .05, { type: 'triangle', vol: .06, at: .03 }); },
  tik() { this.tone(1500, .03, { type: 'square', vol: .04 }); },
  tel() { this.tone(660, .09, { type: 'triangle', vol: .1 }); },
  af() { this.tone(1320, .2, { type: 'triangle', vol: .12 }); },
  flip() { this.noise(.11, { vol: .35, freq: 3200 }); this.tone(1700, .03, { type: 'triangle', vol: .04, at: .07 }); },
  // een nieuwe ronde: een kort trompetje
  horn() { [523, 659, 784].forEach((f, k) => this.tone(f, .16, { type: 'sawtooth', vol: .06, at: k * .09, lp: 2200 })); },
  turn() { this.tone(988, .09, { type: 'triangle', vol: .1 }); this.tone(1319, .14, { type: 'triangle', vol: .1, at: .1 }); },
  good() { [660, 880, 1320].forEach((f, i) => this.tone(f, .2, { type: 'triangle', vol: .12, at: i * .07 })); },
  bad() { this.tone(233, .34, { type: 'sawtooth', vol: .08, slide: .6, lp: 1400 }); this.tone(175, .38, { type: 'square', vol: .05, slide: .6, at: .03, lp: 1000 }); },
  win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, .24, { type: 'triangle', vol: .11, at: i * .1 })); },
};
const buzz = (p) => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* niet ondersteund */ } };

// het scherm aan laten zolang je aan tafel zit
let wake = null;
async function keepAwake(on) {
  try {
    if (on && !wake && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wake = await navigator.wakeLock.request('screen');
      wake.addEventListener('release', () => { wake = null; });
    } else if (!on && wake) { const w = wake; wake = null; await w.release(); }
  } catch (e) { wake = null; }
}

/* ================= VERBINDING ================= */
const Net = {
  ws: null, want: null, retry: 0, timer: 0, status: 'idle',
  url: `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/arena`,
  // msg wordt (opnieuw) gestuurd bij elke verbinding: zo kom je na wegvallen vanzelf terug aan tafel
  go(msg) { this.want = msg; if (!this.send(msg)) this.open(); },
  open() {
    if (this.ws && this.ws.readyState <= 1) return;
    clearTimeout(this.timer);
    this.setStatus('connecting');
    let ws;
    try { ws = new WebSocket(this.url); } catch (e) { this.later(); return; }
    this.ws = ws;
    ws.onopen = () => { this.retry = 0; this.setStatus('open'); if (this.want) this.send(this.want); };
    ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } onMessage(m); };
    ws.onclose = () => { if (this.ws !== ws) return; this.ws = null; this.setStatus('closed'); if (this.want) this.later(); };
    ws.onerror = () => {};
  },
  later() { clearTimeout(this.timer); this.timer = setTimeout(() => this.open(), Math.min(5000, 400 * 2 ** this.retry++)); },
  send(o) { if (this.ws && this.ws.readyState === 1) { this.ws.send(JSON.stringify(o)); return true; } return false; },
  stop() { this.want = null; clearTimeout(this.timer); if (this.ws) { const ws = this.ws; this.ws = null; ws.close(); } this.setStatus('idle'); },
  setStatus(s) { this.status = s; netPill(); },
};
const wakeNet = () => { if (Net.want && (!Net.ws || Net.ws.readyState > 1)) { Net.retry = 0; Net.open(); } };
document.addEventListener('visibilitychange', () => { if (!document.hidden) { wakeNet(); if (S) keepAwake(true); } });
addEventListener('online', wakeNet);
setInterval(() => { if (S) Net.send({ t: 'ping' }); }, 20000);

/* ================= STAAT ================= */
let S = null;   // de laatste stand van de server (alleen wat jij mag zien)
const ui = {
  joining: false, error: '', name: me.name, code: urlCode,
  seen: 0, banner: null, bannerTimer: 0, lastView: null, lastStep: null, lastHtml: '', dockPop: false, sheet: null, sheetHtml: null, build: null,
  bet: { ronde: 0, op: -1, n: 1 },   // op wie jij wilt inzetten en hoeveel, tot je het vastzet
};

function onMessage(m) {
  if (m.t === 'state') return onState(m);
  if (m.t === 'joinFailed') {
    Net.stop(); store.del(KEY.table);
    S = null; ui.joining = false; ui.error = m.msg;
    return render();
  }
  if (m.t === 'left') return leaveLocal(m.reason);
  if (m.t === 'err') toast(m.msg);
}

function onState(m) {
  // is de server bijgewerkt terwijl deze pagina openstond? Dan opnieuw laden, anders draait hier oude code.
  // Na het laden kom je met je sleutel vanzelf weer op je eigen plek.
  if (m.build) {
    if (ui.build && ui.build !== m.build) { Net.stop(); location.reload(); return; }
    ui.build = m.build;
  }
  const first = !S || S.code !== m.code;
  S = m;
  if (window.SpelkeetReview) SpelkeetReview.stand('arena', m.phase, m.phase === 'klaar' ? 2 : 0);   // na een potje: hoe vond je het?
  ui.joining = false; ui.error = '';
  store.set(KEY.table, { code: m.code });
  Net.want = { t: 'join', code: m.code, name: me.name, token: me.token };
  if (location.pathname !== `/arena/${m.code}`) history.replaceState(null, '', `/arena/${m.code}`);
  if (m.phase !== 'lobby' && ui.bet.ronde !== m.ronde) ui.bet = { ronde: m.ronde, op: -1, n: 1 };
  duelSync();
  const seq = m.seq || 0;
  if (first || m.phase === 'lobby' || seq < ui.seen) ui.seen = seq;   // geen oude gebeurtenissen opnieuw afspelen
  else for (const ev of m.log || []) if (ev.seq > ui.seen) present(ev);
  ui.seen = seq;
  keepAwake(true);
  render();
}

function leaveLocal(reason) {
  if (window.SpelkeetReview) SpelkeetReview.stand('arena', null, 0);
  Net.stop();
  store.del(KEY.table);
  S = null; ui.banner = null; ui.sheet = null; ui.code = '';
  history.replaceState(null, '', '/arena');
  keepAwake(false);
  render();
  if (reason) toast(reason);
}

function banner(title, sub = '') {
  ui.banner = { title, sub };
  clearTimeout(ui.bannerTimer);
  ui.bannerTimer = setTimeout(() => { ui.banner = null; render(); }, 2000);
}

// een gebeurtenis van de server laten zien en horen
function present(ev) {
  const name = (i) => S.players[i].name, you = S.you;
  switch (ev.type) {
    case 'ronde': {
      Snd.horn();
      const ik = ev.a === you || ev.b === you;
      buzz(ik ? [80, 50, 80] : 40);
      banner(ik ? 'Jij moet de arena in' : `${name(ev.a)} tegen ${name(ev.b)}`, `Ronde ${ev.ronde} · ${A.SPEL_NAAM[ev.spel]}`);
      break;
    }
    case 'inzet': Snd.chip(); break;
    case 'overgeslagen': toast(`${name(ev.player)} slaat deze ronde over`); break;
    case 'duel':
      // het duel begint: weg met de melding, zodat het tikvlak meteen goed te zien is
      ui.banner = null; clearTimeout(ui.bannerTimer);
      Snd.turn();
      if (inArena(you)) buzz([60, 40, 60]);
      break;
    case 'gelijk': toast(`${ev.detail}: nog een keer`); break;
    case 'sps':
      Snd.flip();
      if (ev.w < 0) toast('Gelijk: nog een keer');
      break;
    case 'uitslag': {
      const b = ev.bets.find((x) => x.p === you);
      const goed = ev.winner === you || (b && b.ok), fout = ev.loser === you || (b && !b.ok);
      if (goed) { Snd.good(); celebrate(); } else if (fout) { Snd.bad(); buzz([90, 50, 90]); } else Snd.flip();
      if (ev.loser === you) window.Slok?.drink(A.VERLIES_STRAF, `Je verloor het duel van ${name(ev.winner)}.`, { delay: 1200 });
      if (b && !b.ok) window.Slok?.drink(b.n, `Je zette ${munten(b.n)} op ${name(b.op)}, maar ${name(ev.winner)} won.`, { delay: 1200 });
      if (ev.blut.includes(you)) window.Slok?.bak(`Je bent blut. Je krijgt ${A.BLUT_MUNTEN} nieuwe munten.`, { delay: 1500 });
      break;
    }
    case 'einde':
      Snd.win();
      if (ev.rijkste.includes(you)) celebrate();
      if (ev.armste.includes(you)) window.Slok?.bak('Jij hebt de minste munten.', { delay: 1200 });
      break;
  }
}

/* ================= BOUWSTENEN ================= */
const nameOf = (i) => esc(S.players[i].name);
const who = (i) => i === S.you ? 'Jij' : nameOf(i);
const initial = (name) => [...name.trim()][0]?.toUpperCase() || '?';
const isHost = () => S && S.you === S.host;
const order = () => S.players.map((_, k) => (S.you + k) % S.players.length);
const liveCount = () => S.players.filter((p) => p.connected).length;
const inArena = (i) => i === S.a || i === S.b;
const tegen = (i) => (i === S.a ? S.b : S.a);
const lijst = (ids) => { const n = ids.map(nameOf); return n.length > 1 ? `${n.slice(0, -1).join(', ')} en ${n[n.length - 1]}` : n[0] || ''; };

// Stoelen op gelijke afstand langs de rand van de tafel: jij onderaan, daarna met de klok mee.
// De vorm van de tafel (zie .rail in het thema): 'ovaal', 'recht' (afgeronde rechthoek), 'acht' (achthoek) of 'rond'
// (cirkel). Bij 'rij' is er geen tafel om omheen te zitten: het bord vult het scherm en de spelers staan in een rij erboven.
const TABLE_SHAPE = 'rij';
const seatCache = new Map();
function seatPositions(n, aspect) {
  const key = `${n}:${aspect.toFixed(2)}`;
  if (seatCache.has(key)) return seatCache.get(key);
  // Vult het bord het scherm (TABLE_SHAPE 'rij'), dan staan de spelers in een rij bovenaan, jij als eerste; vanaf
  // 6 spelers in twee rijen. Het tweede getal is dan de rij: 0 of 1 (zie placeSeats).
  if (TABLE_SHAPE === 'rij') {
    const per = n > 5 ? Math.ceil(n / 2) : n, row = [];
    for (let s = 0; s < n; s++) { const r = s < per ? 0 : 1, m = r ? n - per : per; row.push([((r ? s - per : s) + .5) / m * 100, r]); }
    seatCache.set(key, row);
    return row;
  }
  // de rand in procenten van de tafel (zie .rail): zijkanten op 6% en 94%, boven- en onderkant als halve ellips.
  // Een ronde tafel is een cirkel die in de breedte en de hoogte past. Bij een rechte of achthoekige tafel is de
  // bocht hoekiger (bol kleiner dan 1), zodat de stoelen langs de rand blijven staan.
  let rx = 44, ry = 25.5, top = 30.5, bot = 64.5;
  if (TABLE_SHAPE === 'rond') { rx = Math.min(44, 42.5 / aspect); ry = rx * aspect; top = bot = 47.5; }
  const bol = { recht: .36, acht: .62 }[TABLE_SHAPE] || 1;
  const pts = [], rond = (v) => Math.sign(v) * Math.abs(v) ** bol;
  const cap = (cy, a0, a1) => { for (let k = 0; k <= 48; k++) { const a = a0 + (a1 - a0) * k / 48; pts.push([50 + rx * rond(Math.cos(a)), cy + ry * rond(Math.sin(a))]); } };
  cap(bot, Math.PI / 2, Math.PI);
  cap(top, Math.PI, Math.PI * 2);
  cap(bot, 0, Math.PI / 2);
  // afstanden in echte verhoudingen, zodat de stoelen ook op een smalle tafel gelijk verdeeld zijn
  const len = [0];
  for (let i = 1; i < pts.length; i++) len.push(len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], (pts[i][1] - pts[i - 1][1]) / aspect));
  const total = len[len.length - 1], out = [];
  for (let s = 0; s < n; s++) {
    const want = total * s / n;
    let i = 1;
    while (i < len.length - 1 && len[i] < want) i++;
    const t = (want - len[i - 1]) / ((len[i] - len[i - 1]) || 1);
    out.push([pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]);
  }
  seatCache.set(key, out);
  return out;
}

// Zet de stoelen op hun plek. Valt een naambordje of label buiten het scherm, dan schuift het naar binnen.
function placeSeats() {
  const scr = $('#screen').getBoundingClientRect(), minX = scr.left + 4, maxX = scr.right - 4;
  const inward = (cx, half) => cx - half < minX ? minX - (cx - half) : cx + half > maxX ? maxX - (cx + half) : 0;
  for (const t of document.querySelectorAll('.table')) {
    const r = t.getBoundingClientRect();
    if (!r.width || !r.height) continue;
    const seats = t.querySelectorAll('.seat');
    const pos = seatPositions(seats.length, r.width / r.height);
    // Bij een rij spelers: --rij is de hoogte van één rij (uit de stijl, want soms liggen er kaarten onder de
    // spelers) en --strook de ruimte die de rijen samen innemen; het bord begint daaronder.
    const stap = TABLE_SHAPE === 'rij' ? parseFloat(getComputedStyle(t).getPropertyValue('--rij')) || 62 : 0;
    if (stap) t.style.setProperty('--strook', `${(seats.length > 5 ? 2 : 1) * stap + 12}px`);
    seats.forEach((el, i) => {
      const [x, y] = pos[i];
      const cx = r.left + x / 100 * r.width;
      const shift = inward(cx, el.querySelector('.plate').offsetWidth / 2);
      el.style.left = shift ? `calc(${x}% + ${shift}px)` : `${x}%`;
      el.style.top = stap ? `${30 + y * stap}px` : `${y}%`;
      el.classList.toggle('top', y < 50);
      const tag = el.querySelector('.tag');
      if (tag) tag.style.setProperty('--tx', `${inward(cx + shift, tag.offsetWidth / 2 + 4)}px`);
    });
    const d = t.querySelector('.dealer');
    if (d && pos.length) {
      const [x, y] = pos[+d.dataset.seat] || pos[0];
      if (stap) { d.style.left = `calc(${x}% + 17px)`; d.style.top = `${15 + y * stap}px`; }
      else { d.style.left = `${x + (50 - x) * .2 + (x < 50 ? 9 : -9)}%`; d.style.top = `${y + (50 - y) * .22}%`; }
    }
  }
}

// De arena: rand, vloer, iets in het midden en de spelers in een rij erboven (order: wie op welke stoel, jij eerst).
// seat(i) -> { now, dim, kick, cls, tag: [soort, tekst] }
function tableHTML({ order: seatsOrder, people, center = '', over = '', seat = () => ({}), dealer = -1, cls = '' }) {
  const seats = seatsOrder.map((i) => {
    const p = people[i], o = seat(i) || {};
    const btn = o.kick ? ` type="button" data-act="kickask" data-seat="${i}" aria-label="${esc(p.name)} van tafel halen"` : '';
    const el = btn ? 'button' : 'div';
    const line = p.empty ? '' : p.connected === false ? '<span class="off">weg</span>'
      : p.munten != null ? `<span title="Munten">${MUNT}${p.munten}</span>` : '';
    const isMe = S && i === S.you && !p.empty;
    return `<${el} class="seat${o.now ? ' now' : ''}${o.cls ? ` ${o.cls}` : ''}${o.dim ? ' dim' : ''}${p.empty ? ' empty' : ''}${isMe ? ' me' : ''}${p.connected === false ? ' off' : ''}" style="--pc:${PC[i % PC.length]}"${btn}>
      <span class="ava">${p.empty ? '+' : esc(initial(p.name))}</span>
      <span class="plate"><b>${p.empty ? 'Vrij' : esc(p.name)}</b>${line}</span>
      ${o.tag ? `<span class="tagwrap"><span class="tag ${o.tag[0]}">${o.tag[1]}</span></span>` : ''}
    </${el}>`;
  }).join('');
  const d = seatsOrder.indexOf(dealer);
  const ban = ui.banner ? `<div class="banner"><p class="felt-sub">${esc(ui.banner.sub)}</p><p class="banner-t">${esc(ui.banner.title)}</p></div>` : '';
  return `<div class="table ${cls}"><div class="rail"></div><div class="felt"></div>${d >= 0 ? `<span class="dealer" data-seat="${d}" title="Host" aria-hidden="true">H</span>` : ''}<div class="center">${center}</div>${over}${seats}${ban}</div>`;
}

const gameTable = (center, seat, over = '') => tableHTML({ order: order(), people: S.players, center, over, dealer: S.host, seat });
const sheetTop = (title, kick = '', close = true) => `<div class="sheet-top"><div>${kick ? `<p class="kick">${kick}</p>` : ''}<h2 class="sheet-title" id="sheetTitle">${title}</h2></div>${close ? '<button class="xbtn" type="button" data-act="close" aria-label="Sluiten">✕</button>' : ''}</div>`;
const potHTML = () => `<div class="pot">Ronde ${S.ronde} van ${S.rondes}<i></i>${A.SPEL_NAAM[S.spel]}</div>`;

// De twee in de arena naast elkaar: links rood, rechts blauw. sub(i) is het regeltje onder de naam, cls(i) de stand
// (win of lose), pick = je kunt er een aantikken om op in te zetten, chips = wie er op wie heeft ingezet.
function versus({ sub = () => '', cls = () => '', pick = false, chips = false, mid = 'VS' } = {}) {
  const f = (i, id) => {
    const p = S.players[i], kant = i === S.a ? 'rood' : 'blauw', el = pick ? 'button' : 'div';
    let bets = '';
    if (chips) {
      bets = Object.entries(S.bets).filter(([, b]) => b.n > 0 && b.op === i).map(([k, b]) => {
        const r = S.phase === 'uitslag' && S.last ? (b.op === S.last.winner ? ' ok' : ' mis') : '';
        return `<i class="bc${r}" data-i="${esc(initial(S.players[k].name))}" style="--pc:${PC[k % PC.length]}" title="${nameOf(+k)} zet ${munten(b.n)}"><u>${r === ' mis' ? '−' : r ? '+' : ''}${b.n}</u></i>`;
      }).join('') || '<i class="bc none">geen inzet</i>';
    }
    return `<${el} class="fighter ${kant} ${cls(i)}"${pick ? ` type="button" data-act="pickop" data-op="${i}" aria-pressed="${ui.bet.op === i}"` : ''}>
      <span class="fava" style="--pc:${PC[i % PC.length]}">${esc(initial(p.name))}</span><b>${who(i)}</b><small id="${id}">${sub(i)}</small>${chips ? `<span class="bcs">${bets}</span>` : ''}</${el}>`;
  };
  return `<div class="vs">${f(S.a, 'dA')}<span class="vsx">${mid}</span>${f(S.b, 'dB')}</div>`;
}

/* ================= HET DUEL OP JE EIGEN TELEFOON ================= */
// De klok van de server en die van je telefoon lopen niet gelijk. De server stuurt daarom alleen "over zoveel
// milliseconden"; de telefoon rekent dat om naar zijn eigen klok en meet zelf hoe snel je bent. De server bepaalt
// daarna wie er wint.
const D = { key: '', born: 0, t0: 0, end: 0, done: false, early: false, ms: null, n: 0, sentN: 0, lastSend: 0, msg: null, sentAt: 0, tries: 0, tijdSent: 0, tel: '', keuze: -1 };

function duelSync() {
  if (!S || S.phase !== 'duel' || !S.duel) { D.key = ''; return; }
  const now = performance.now(), key = `${S.code}:${S.ronde}:${S.duel.poging}`;
  D.end = now + S.duel.om;
  if (key === D.key) return;
  Object.assign(D, { key, born: now, t0: now + (S.duel.over ?? 0), done: false, early: false, ms: null, n: 0, sentN: 0, lastSend: 0, msg: null, sentAt: 0, tries: 0, tijdSent: 0, tel: '', keuze: -1 });
}

function duelSend(msg) {
  D.done = true; D.msg = msg; D.sentAt = performance.now(); D.tries = 1;
  Net.send(msg);
}

// een tik op het grote vlak
function padTap() {
  if (!S || S.phase !== 'duel' || !S.duel || !inArena(S.you) || D.done || S.duel.klaar[S.you]) return;
  const now = performance.now(), spel = S.duel.spel;
  if (now < D.born + 600) return;   // het vlak staat er net: nog even niks, zodat je niet per ongeluk tikt
  Snd.ac();
  if (spel === 'reactie') {
    if (now < D.t0) { D.early = true; duelSend({ t: 'tik', early: true }); Snd.bad(); buzz(140); }
    else { D.ms = now - D.t0; duelSend({ t: 'tik', ms: Math.round(D.ms) }); Snd.af(); buzz(30); }
  } else if (spel === 'tikken') {
    if (now < D.t0 || now > D.t0 + A.TIK_MS) return;
    D.n++; Snd.tik();
  } else if (spel === 'stop') {
    if (now < D.t0) return;
    D.ms = now - D.t0; duelSend({ t: 'stop', ms: Math.round(D.ms) }); Snd.af(); buzz(30);
  }
  duelPaint();
}

// een antwoord aantikken bij Snelle som en Welke kleur?
function ansTap(k) {
  if (!S || S.phase !== 'duel' || !S.duel || !A.QUIZ.includes(S.duel.spel) || !inArena(S.you) || D.done || S.duel.klaar[S.you]) return;
  const now = performance.now();
  if (now < D.t0) return;
  Snd.ac(); Snd.chip(); buzz(30);
  D.keuze = k;
  duelSend({ t: 'antw', k, ms: Math.round(now - D.t0) });
  render();
}

const put = (el, txt) => { if (el && el.textContent !== txt) el.textContent = txt; };
const setCls = (el, cls) => { if (el && el.className !== cls) el.className = cls; };

// Alles wat met de klok meeloopt: het aftellen, het groene scherm, de teller. Dit draait bij elk beeldje en na elke
// keer tekenen, zodat het scherm ook klopt als de server tussendoor een nieuwe stand stuurt.
function duelPaint() {
  if (!S || S.phase !== 'duel' || !S.duel || !D.key) return;
  const d = S.duel, now = performance.now(), el = now - D.t0, mine = inArena(S.you);
  // de tijd is om: elke telefoon mag dat melden, de server kijkt zelf op de klok
  if (now > D.end + 400 && now - D.tijdSent > 2500) { D.tijdSent = now; Net.send({ t: 'tijd' }); }
  // kwam mijn uitslag niet aan? Dan nog een keer
  if (mine && D.done && D.msg && !d.klaar[S.you] && now - D.sentAt > 1500 && D.tries < 4) { D.sentAt = now; D.tries++; Net.send(D.msg); }
  const done = D.done || !!d.klaar[S.you];
  const tel = el < 0 ? (el < -3000 ? 'Klaar?' : String(Math.ceil(-el / 1000))) : '';
  if (d.spel !== 'reactie' && d.spel !== 'sps' && tel !== D.tel) {
    if (D.tel && !tel) Snd.af(); else if (/^\d$/.test(tel)) Snd.tel();
    D.tel = tel;
  }
  const pad = $('#pad'), big = $('#padBig'), sub = $('#padSub'), bar = $('#padBar'), spec = $('#dBig');
  const wacht = `Wachten op ${S.players[tegen(S.you)]?.name || ''}`;
  if (d.spel === 'reactie') {
    // een nepseintje: het scherm licht op in een andere kleur. Alleen groen telt.
    const nep = el < 0 ? (d.nep || []).find((f) => el >= -f.voor && el < -f.voor + A.NEP_MS) : null;
    if (pad) {
      const st = done ? (D.early ? 'early' : 'done') : el < 0 ? (nep ? 'nep' : 'wait') : 'go';
      setCls(pad, `pad ${st}${st === 'nep' ? ` n${nep.k}` : ''}`);
      put(big, st === 'wait' ? 'Wacht' : st === 'nep' ? NEP_TEKST[nep.k] : st === 'go' ? 'TIK!' : st === 'early' ? 'Te vroeg' : D.ms != null ? `${Math.round(D.ms)} ms` : 'Getikt');
      put(sub, st === 'wait' || st === 'nep' ? 'Tik alleen bij groen' : st === 'go' ? 'Nu!' : d.klaar[tegen(S.you)] ? '' : wacht);
    }
    if (spec) { setCls(spec, `dbig ${el < 0 ? (nep ? 'nep' : 'wait') : 'go'}`); put(spec, el < 0 ? (nep ? 'Nepseintje!' : 'Wacht…') : 'Groen!'); }
  } else if (d.spel === 'tikken') {
    const bezig = el >= 0 && el < A.TIK_MS;
    if (mine && !done) {
      if (bezig && D.n !== D.sentN && now - D.lastSend > 300) { D.sentN = D.n; D.lastSend = now; Net.send({ t: 'tikken', n: D.n }); }
      if (el >= A.TIK_MS) duelSend({ t: 'tikken', n: D.n, klaar: true });
    }
    if (pad) {
      const klaar = D.done || !!d.klaar[S.you];
      setCls(pad, `pad ${el < 0 ? 'count' : klaar ? 'done' : 'go'}`);
      put(big, el < 0 ? tel : String(D.done || !d.klaar[S.you] ? D.n : d.n[S.you]));
      put(sub, el < 0 ? 'Tik zo vaak als je kunt' : klaar ? (d.klaar[tegen(S.you)] ? 'tikken' : wacht) : `nog ${((A.TIK_MS - el) / 1000).toFixed(1).replace('.', ',')} s`);
      if (bar) bar.style.width = `${Math.max(0, Math.min(100, el / A.TIK_MS * 100))}%`;
    }
    if (spec) { setCls(spec, `dbig${bezig ? ' go' : ''}`); put(spec, el < 0 ? tel : bezig ? `${((A.TIK_MS - el) / 1000).toFixed(1).replace('.', ',')} s` : 'Tijd!'); }
  } else if (d.spel === 'stop') {
    if (pad) {
      setCls(pad, `pad ${el < 0 ? 'count' : done ? 'done' : 'go'}`);
      put(big, el < 0 ? tel : done ? (D.ms != null ? klok(D.ms) : 'Gestopt') : el < A.STOP_ZICHT ? klok(el) : '?,??');
      put(sub, el < 0 ? 'Stop de klok op 0' : done ? (d.klaar[tegen(S.you)] ? '' : wacht) : el < A.STOP_ZICHT ? 'De klok verdwijnt zo' : 'Tik als je denkt dat hij op 0 staat');
    }
    // wie toekijkt ziet de klok wel doorlopen
    if (spec) { setCls(spec, 'dbig'); put(spec, el < 0 ? tel : klok(Math.min(el, A.STOP_DOEL + 6000))); }
  } else if (A.QUIZ.includes(d.spel)) {
    // de vraag komt pas in beeld als het aftellen klaar is, bij allebei tegelijk
    const q = $('#qBig'), quiz = $('#quiz'), open = el >= 0;
    if (q) {
      const html = !open ? tel : d.spel === 'som' ? `${esc(d.vraag.tekst)} = ?` : `<span style="color:${INKT[d.vraag.inkt]}">${esc(d.vraag.woord)}</span>`;
      if (q.dataset.h !== html) { q.dataset.h = html; q.innerHTML = html; }
    }
    if (quiz) quiz.classList.toggle('dicht', !open);
  } else if (spec) {
    const over = D.end - now;
    setCls(spec, 'dbig klein');
    put(spec, over < 10000 ? `nog ${Math.max(0, Math.ceil(over / 1000))} s om te kiezen` : '');
  }
}

    <label class="fld">Jouw naam<input class="inp" id="nameIn" maxlength="${A.NAME_MAX}" placeholder="Bijvoorbeeld Sanne" autocomplete="nickname" enterkeyhint="next" value="${esc(ui.name)}"></label>
    <form class="addrow" id="joinForm" autocomplete="off">

function vLobby() {
  const n = S.players.length, host = isHost(), short = A.MIN_PLAYERS - liveCount();
  const table = tableHTML({
    order: order(), people: S.players, cls: 'lobby', dealer: S.host,
    center: `<p class="felt-sub">Code van de arena</p><div class="felt-logo code">${S.code}</div><p class="felt-sub">${n} van ${A.MAX_PLAYERS} plekken · ${S.rondes} rondes</p>`,
    seat: (i) => ({ kick: host && i !== S.you, now: i === S.host }),
  });
  const dock = `<div class="ask-h"><h2>${host ? 'Jij bent de host' : 'Je staat klaar'}</h2><button class="sharebtn" type="button" data-act="share">${SHARE}Uitnodigen</button></div>
    <p class="sub">Vrienden doen mee met code <b>${S.code}</b> of met de link. Iedereen begint met ${A.START_MUNTEN} munten.</p>
    ${host
      ? `<div class="optrow"><span>Aantal rondes</span><div class="seg" role="group" aria-label="Aantal rondes">${A.LENGTES.map((r) => `<button type="button" data-act="rondes" data-n="${r}" aria-pressed="${S.rondes === r}">${r}</button>`).join('')}</div></div>
        <button class="cta" type="button" data-act="start" ${short > 0 ? 'disabled' : ''}><span>${short > 0 ? `Wacht op ${short} ${short === 1 ? 'speler' : 'spelers'}` : 'Open de arena'}</span>${ARR}</button>
        ${n > 1 ? '<p class="fine">Tik op een speler om die van tafel te halen.</p>' : ''}`
      : `<p class="waitline">Wachten tot ${nameOf(S.host)} de arena opent</p>`}
    <button class="linkbtn" type="button" data-act="leaveask">Verlaat de arena</button>`;
  return `${table}<div class="dock">${dock}</div>`;
}

// de hoek van een speler in de arena als label bij zijn stoel
const hoek = (i) => (i === S.a ? { cls: 'rood', tag: ['rood', 'Rood'] } : i === S.b ? { cls: 'blauw', tag: ['blauw', 'Blauw'] } : null);

function vInzet() {
  const klaar = Object.keys(S.bets).length, totaal = klaar + S.wacht.length, mag = !inArena(S.you) && !S.bets[S.you];
  const sub = (i) => { const p = S.players[i]; return p.duels ? `${p.gewonnen} van ${p.duels} gewonnen` : 'Eerste duel'; };
  const center = `${potHTML()}<div class="spelnaam">${A.SPEL_NAAM[S.spel]}</div>${versus({ sub, pick: mag })}<p class="felt-sub">${totaal ? `${klaar} van ${totaal} hebben ingezet` : 'Niemand om in te zetten'}</p>`;
  // wie nog moet inzetten licht op; wie al heeft ingezet niet (op wie blijft geheim)
  const seat = (i) => hoek(i) || (S.bets[i] ? { dim: !S.bets[i].n } : { now: S.wacht.includes(i) });
  return `${gameTable(center, seat)}<div class="dock${ui.dockPop ? ' pop' : ''}">${inzetDock()}</div>`;
}

function inzetDock() {
  const you = S.you, ik = S.players[you], host = isHost();
  // de host laat wie weg is deze ronde overslaan, anders wacht iedereen
  const weg = host ? S.wacht.filter((i) => i !== you && !S.players[i].connected).map((i) => `<button class="linkbtn warn" type="button" data-act="skipbet" data-for="${i}">${nameOf(i)} is weg: sla over</button>`).join('') : '';
  const wachten = S.wacht.filter((i) => i !== you);
  if (inArena(you)) {
    return `<div class="ask-h"><h2>Jij moet de arena in!</h2><span class="stake">${MUNT}${ik.munten}</span></div>
      <p class="sub"><b>${A.SPEL_NAAM[S.spel]}</b> tegen <b>${nameOf(tegen(you))}</b>. ${A.SPEL_UITLEG[S.spel]}</p>
      <p class="waitline">${wachten.length ? `${lijst(wachten)} ${wachten.length === 1 ? 'zet' : 'zetten'} nog in` : 'Het duel begint zo'}</p>${weg}`;
  }
  const b = S.bets[you];
  if (b) {
    return `<div class="ask-h"><h2>${b.n ? `Jij zet ${b.n} op ${nameOf(b.op)}` : 'Je slaat deze ronde over'}</h2><span class="stake">${MUNT}${ik.munten}</span></div>
      <p class="sub">${b.n ? `Wint ${nameOf(b.op)}? Dan krijg je er ${munten(b.n)} bij. Anders ben je ze kwijt en krijg je ${straf(b.n)}.` : 'Je doet de volgende ronde weer mee.'}</p>
      <p class="waitline">${wachten.length ? `Wachten op ${lijst(wachten)}` : 'Het duel begint zo'}</p>${weg}`;
  }
  const max = Math.min(A.MAX_INZET, ik.munten), n = Math.min(ui.bet.n, max), op = ui.bet.op;
  const knop = (i) => `<button class="opt ${i === S.a ? 'rood' : 'blauw'}" type="button" data-act="pickop" data-op="${i}" aria-pressed="${op === i}"><span>${nameOf(i)}</span></button>`;
  return `<div class="ask-h"><h2>Wie wint er?</h2><span class="stake">${MUNT}${ik.munten}</span></div>
    <div class="opts${inArena(op) ? ' has' : ''}">${knop(S.a)}${knop(S.b)}</div>
    <div class="optrow"><span>Inzet</span><div class="seg" role="group" aria-label="Inzet">${[1, 2, 3].map((k) => `<button type="button" data-act="stake" data-n="${k}" aria-pressed="${n === k}" ${k > max ? 'disabled' : ''}>${k}</button>`).join('')}</div></div>
    <button class="cta" type="button" data-act="bet" ${inArena(op) ? '' : 'disabled'}><span>${inArena(op) ? `Zet ${munten(n)} op ${nameOf(op)}` : 'Kies rood of blauw'}</span>${ARR}</button>
    <p class="fine">Goed gegokt: je inzet erbij. Fout: je inzet kwijt en net zoveel strafpunten.</p>${weg}`;
}

function vDuel() {
  const d = S.duel, you = S.you, mine = inArena(you);
  let center, over = '';
  const quiz = A.QUIZ.includes(d.spel);
  if (d.spel === 'sps') {
    // de stand en het laatste rondje: wat koos wie?
    const laatste = d.rondjes[d.rondjes.length - 1];
    const sub = (i) => d.gekozen[i] ? 'Heeft gekozen' : laatste ? `${ICO[laatste[i]]}` : 'Kiest…';
    center = `${potHTML()}${versus({ sub, chips: true, mid: `${d.score[S.a]} – ${d.score[S.b]}` })}<div class="dbig klein" id="dBig"></div>`;
  } else if (mine && quiz) {
    center = `${potHTML()}<div class="vraag" id="qBig"></div><p class="felt-sub">Tegen ${nameOf(tegen(you))}</p>`;
  } else if (mine) {
    center = '';
    over = `<button class="pad count" id="pad" type="button" data-pad aria-label="${A.SPEL_NAAM[d.spel]}: tik hier"><span class="padk">${A.SPEL_NAAM[d.spel]} · tegen ${nameOf(tegen(you))}</span><b id="padBig"></b><span class="ps" id="padSub"></span>${d.spel === 'tikken' ? '<i class="padbar"><u id="padBar"></u></i>' : ''}</button>`;
  } else {
    const sub = (i) => d.spel === 'tikken' ? `${d.n[i]} tikken` : d.klaar[i] ? (d.spel === 'stop' ? 'Gestopt' : quiz ? 'Antwoord gegeven' : 'Getikt') : quiz ? 'Denkt na…' : '…';
    center = `${potHTML()}${versus({ sub, chips: true })}${quiz ? '<div class="vraag klein" id="qBig"></div>' : '<div class="dbig" id="dBig"></div>'}`;
  }
  const seat = (i) => hoek(i) || (S.bets[i] && S.bets[i].n ? { cls: S.bets[i].op === S.a ? 'rood' : 'blauw' } : { dim: true });
  return `${gameTable(center, seat, over)}<div class="dock${ui.dockPop ? ' pop' : ''}">${duelDock()}</div>`;
}

function duelDock() {
  const d = S.duel, you = S.you, host = isHost();
  // de host geeft op voor wie weg is, anders wacht iedereen tot de tijd om is
  const weg = host ? [S.a, S.b].filter((i) => i !== you && !S.players[i].connected).map((i) => `<button class="linkbtn warn" type="button" data-act="opgeven" data-for="${i}">${nameOf(i)} is weg: geef op</button>`).join('') : '';
  const opnieuw = d.poging > 1 ? '<p class="fine" style="display:block;color:var(--gold)">Het was gelijk: nog een keer.</p>' : '';
  if (inArena(you)) {
    if (d.spel === 'sps') {
      const koos = d.mijn;
      return `<div class="ask-h"><h2>${koos ? `Jij koos ${SPS_NAAM[koos].toLowerCase()}` : 'Steen, papier of schaar?'}</h2><span class="stake">${d.score[you]} – ${d.score[tegen(you)]}</span></div>
        <div class="rpsrow">${A.SPS.map((k) => `<button class="rps${koos === k ? ' sel' : ''}" type="button" data-act="kies" data-k="${k}" ${koos ? 'disabled' : ''}>${ICO[k]}<span>${SPS_NAAM[k]}</span></button>`).join('')}</div>
        ${koos ? `<p class="waitline">Wachten op ${nameOf(tegen(you))}</p>` : `<p class="sub">Wie het eerst ${A.SPS_WINS} keer wint, wint het duel.</p>`}${opnieuw}${weg}`;
    }
    if (A.QUIZ.includes(d.spel)) {
      const klaar = D.done || !!d.klaar[you], open = performance.now() >= D.t0;
      const knop = (o, k) => `<button class="ans${D.keuze === k ? ' sel' : ''}${o === 'geel' ? ' licht' : ''}" type="button" data-ans="${k}" ${klaar ? 'disabled' : ''}${d.spel === 'kleur' ? ` style="--k:${INKT[o]}"` : ''}><span>${esc(o)}</span></button>`;
      return `<div class="ask-h"><h2>${klaar ? 'Antwoord gegeven' : d.spel === 'som' ? 'Wat komt eruit?' : 'Welke kleur hebben de letters?'}</h2></div>
        <div class="quiz ${d.spel}${open ? '' : ' dicht'}${klaar ? ' klaar' : ''}" id="quiz">${d.vraag.opties.map(knop).join('')}</div>
        ${klaar ? (d.klaar[tegen(you)] ? '' : `<p class="waitline">Wachten op ${nameOf(tegen(you))}</p>`) : `<p class="sub">${d.spel === 'som' ? 'De snelste met het goede antwoord wint. Fout is verloren.' : 'Niet het woord, maar de kleur van de letters. Fout is verloren.'}</p>`}${opnieuw}${weg}`;
    }
    return `<div class="ask-h"><h2>${A.SPEL_NAAM[d.spel]}</h2></div><p class="sub">${A.SPEL_UITLEG[d.spel]}</p>${opnieuw}${weg}`;
  }
  const b = S.bets[you];
  return `<div class="ask-h"><h2>${nameOf(S.a)} tegen ${nameOf(S.b)}</h2></div>
    <p class="sub">${b && b.n ? `Jij hebt <b>${munten(b.n)}</b> op <b>${nameOf(b.op)}</b> staan. ` : ''}${A.SPEL_UITLEG[d.spel]}</p>${opnieuw}${weg}`;
}

// wat er in het duel gebeurde, in één regel
function detailText(L) {
  const d = L.detail || {}, a = L.a, b = L.b;
  if (d.opgegeven != null) return `${nameOf(d.opgegeven)} was weg`;
  if (d.tijdOm) return d.loot ? 'De tijd was om: het lot besliste' : `De tijd was om voor ${nameOf(L.loser)}`;
  if (d.loot) return `${esc(d.gelijk || 'Steeds gelijk')}: het lot besliste`;
  const ms = (v) => (d.quiz ? (v < 0 ? 'fout' : `${sec(v)} s`) : v < 0 ? 'te vroeg' : `${v} ms`);
  if (d.ms) return `${d.quiz ? `${esc(d.quiz)} · ` : ''}${nameOf(a)} ${ms(d.ms[a])} · ${nameOf(b)} ${ms(d.ms[b])}`;
  if (d.tikken) return `${nameOf(a)} ${d.tikken[a]} tikken · ${nameOf(b)} ${d.tikken[b]} tikken`;
  if (d.stop) return `${nameOf(a)} stopte op ${klok(d.stop[a])} · ${nameOf(b)} op ${klok(d.stop[b])}`;
  if (d.score) return `Steen, papier, schaar: ${d.score[L.winner]} – ${d.score[L.loser]}`;
  return '';
}

function vUitslag() {
  const L = S.last, you = S.you;
  const sub = (i) => i === L.winner ? `+${munten(A.WIN_MUNTEN)}` : straf(A.VERLIES_STRAF);
  const center = `${potHTML()}<div class="bigword gold">${L.winner === you ? 'Jij wint!' : `${nameOf(L.winner)} wint!`}</div><p class="detail">${detailText(L)}</p>${versus({ sub, cls: (i) => (i === L.winner ? 'win' : 'lose'), chips: true })}`;
  const seat = (i) => {
    if (L.blut.includes(i)) return { tag: ['bad', 'Blut!'] };
    if (i === L.winner) return { cls: i === S.a ? 'rood' : 'blauw', tag: ['', `+${A.WIN_MUNTEN}`] };
    if (i === L.loser) return { cls: i === S.a ? 'rood' : 'blauw', tag: ['bad', `Straf ${A.VERLIES_STRAF}`] };
    const b = L.bets.find((x) => x.p === i);
    return b ? { tag: b.ok ? ['', `+${b.n}`] : ['bad', `Straf ${b.n}`] } : { dim: true };
  };
  return `${gameTable(center, seat)}<div class="dock${ui.dockPop ? ' pop' : ''}">${uitslagDock()}</div>`;
}

function uitslagDock() {
  const L = S.last, you = S.you, b = L.bets.find((x) => x.p === you), laatste = S.ronde >= S.rondes;
  let kop, soort = '', regel, act = '';
  if (L.winner === you) { kop = 'Gewonnen!'; soort = 'good'; regel = `Je wint het duel van ${nameOf(L.loser)}.`; act = `<div class="action">${MUNT}<span>Jij krijgt ${munten(A.WIN_MUNTEN)}</span></div>`; }
  else if (L.loser === you) { kop = 'Verloren'; soort = 'bad'; regel = `${nameOf(L.winner)} was beter.`; act = `<div class="action bad">${STRAF}<span>Jij krijgt ${straf(A.VERLIES_STRAF)}</span></div>`; }
  else if (b && b.ok) { kop = 'Goed gegokt!'; soort = 'good'; regel = `Je zette op ${nameOf(b.op)}.`; act = `<div class="action">${MUNT}<span>Jij krijgt ${munten(b.n)}</span></div>`; }
  else if (b) { kop = 'Mis gegokt'; soort = 'bad'; regel = `Je zette op ${nameOf(b.op)}. Je bent ${munten(b.n)} kwijt.`; act = `<div class="action bad">${STRAF}<span>Jij krijgt ${straf(b.n)}</span></div>`; }
  else { kop = `${nameOf(L.winner)} wint`; regel = 'Jij had deze ronde niks ingezet.'; }
  const blut = L.blut.includes(you) ? `<div class="action bad">${STRAF}<span>Blut: een mega strafpunt en ${A.BLUT_MUNTEN} nieuwe munten</span></div>` : '';
  const verder = isHost()
    ? `<button class="cta" type="button" data-act="next"><span>${laatste ? 'Naar de eindstand' : 'Volgende ronde'}</span>${ARR}</button>`
    : `<p class="waitline">Wachten tot ${nameOf(S.host)} doorgaat</p>`;
  return `<div class="res-h ${soort}"><span class="verdict">${kop}</span><span class="sub">${regel}</span></div>${act}${blut}${verder}`;
}

function vKlaar() {
  const E = S.eind, you = S.you;
  const rows = S.players.map((p, i) => ({ p, i })).sort((x, y) => y.p.munten - x.p.munten || x.p.straf - y.p.straf);
  const winnaar = E.rijkste.includes(you) ? (E.rijkste.length > 1 ? 'Jij wint mee!' : 'Jij wint!') : `${lijst(E.rijkste)} ${E.rijkste.length > 1 ? 'winnen' : 'wint'}!`;
  let plek = 0;
  const lijstje = rows.map(({ p, i }, k) => {
    if (!k || p.munten !== rows[k - 1].p.munten) plek = k + 1;
    return `<div class="${E.rijkste.includes(i) ? 'top' : E.armste.includes(i) ? 'low' : ''}${i === you ? ' me' : ''}" style="--pc:${PC[i % PC.length]}"><em>${plek}</em><i></i><b>${esc(p.name)}</b><span>${MUNT}${p.munten}</span></div>`;
  }).join('');
  const center = `<p class="felt-sub">Eindstand na ${S.rondes} rondes</p><div class="bigword gold">${winnaar}</div><div class="rank">${lijstje}</div>`;
  const seat = (i) => (E.rijkste.includes(i) ? { now: true, tag: ['', 'Rijkste'] } : E.armste.includes(i) ? { tag: ['bad', 'Mega'] } : {});
  const ik = S.players[you];
  const kop = E.rijkste.includes(you) ? 'Jij bent de rijkste!' : E.armste.includes(you) ? 'Jij bent de armste' : 'Het zit erop';
  const act = E.armste.includes(you) ? `<div class="action bad">${STRAF}<span>Jij krijgt een mega strafpunt</span></div>` : '';
  const dock = `<div class="res-h ${E.rijkste.includes(you) ? 'good' : E.armste.includes(you) ? 'bad' : ''}"><span class="verdict">${kop}</span><span class="sub">Je eindigt met ${munten(ik.munten)}, ${straf(ik.straf)}${ik.mega ? ` en ${ik.mega} mega ${ik.mega === 1 ? 'strafpunt' : 'strafpunten'}` : ''}.${E.armste.length ? ` Minste munten: ${lijst(E.armste)}.` : ''}</span></div>${act}
    ${isHost() ? `<button class="cta" type="button" data-act="again"><span>Nog een potje</span>${ARR}</button>` : `<p class="waitline">Wachten tot ${nameOf(S.host)} een nieuw potje start</p>`}
    <button class="linkbtn" type="button" data-act="score">Bekijk de hele stand</button>`;
  return `${gameTable(center, seat)}<div class="dock${ui.dockPop ? ' pop' : ''}">${dock}</div>`;
}

/* ================= VELLEN ================= */
function menuHTML() {
  const host = isHost(), game = S && S.phase !== 'lobby';
  return `${sheetTop('Menu')}
  <nav class="mlist">
    <button type="button" data-act="uitleg">Uitleg met plaatjes <span>›</span></button>
    <button type="button" data-act="rules">Spelregels <span>›</span></button>
    ${game ? '<button type="button" data-act="score">Stand <span>›</span></button>' : ''}
    <button type="button" data-act="mute">Geluid <span>${Snd.muted ? 'uit' : 'aan'}</span></button>
    ${S ? `<button type="button" data-act="share">Uitnodigen <span>${S.code}</span></button>` : ''}
    ${game && host ? '<button type="button" data-act="againask">Terug naar de lobby <span>›</span></button>' : ''}
    ${S ? '<button type="button" data-act="leaveask">Verlaat de arena <span>›</span></button>' : ''}
    <a href="/review?spel=arena">Wat vind je ervan? <span>★</span></a>
    <a href="/melden?spel=arena${S ? `&code=${S.code}` : ''}">Iets melden <span>›</span></a>
    <a href="/">Naar De Spelkeet <span>›</span></a>
  </nav>`;
}

function scoreHTML() {
  const rows = S.players.map((p, i) => ({ p, i })).sort((a, b) => b.p.munten - a.p.munten);
  return `${sheetTop('Stand', `Ronde ${S.ronde} van ${S.rondes}`)}
  <div class="scorecard"><table>
    <thead><tr><th>Speler</th><th>Munten</th><th>Straf</th><th>Mega</th><th>Duels</th><th>Goed</th></tr></thead>
    <tbody>${rows.map(({ p, i }) => `<tr style="--pc:${PC[i % PC.length]}"><td><i></i>${esc(p.name)}</td><td>${p.munten}</td><td>${p.straf}</td><td>${p.mega}</td><td>${p.gewonnen}/${p.duels}</td><td>${p.goed}</td></tr>`).join('')}</tbody>
  </table></div>
  <p class="sub">Straf: strafpunten. Mega: mega strafpunten, die tellen apart. Duels: gewonnen van gespeeld. Goed: hoe vaak iemand op de winnaar zette.</p>`;
}

function rulesHTML() {
  return `${sheetTop('Spelregels', 'Arena')}
  <button class="ghostbtn rules-how" type="button" data-act="uitleg"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-2px;margin-right:6px"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>Bekijk de uitleg met plaatjes</button>
  <div class="rules">
    <p>Iedereen speelt op zijn eigen telefoon. Maak een arena en deel de code, of doe mee met de code van een ander. Iedereen begint met ${A.START_MUNTEN} munten.</p>
    <ol>
      <li><b>De arena in.</b> Elke ronde wijst het spel twee spelers aan: de rode en de blauwe hoek. Iedereen komt even vaak aan de beurt.</li>
      <li><b>Inzetten.</b> De rest kiest wie er gaat winnen en zet 1, 2 of 3 munten in. Niemand ziet wat een ander inzet tot het duel begint.</li>
      <li><b>Het duel.</b> De twee spelen een kort minispel op hun eigen telefoon. De rest kijkt mee.</li>
      <li><b>De uitslag.</b> De winnaar krijgt ${munten(A.WIN_MUNTEN)}, de verliezer ${straf(A.VERLIES_STRAF)}. Goed gegokt: je inzet erbij. Fout gegokt: je inzet kwijt, en net zoveel strafpunten.</li>
      <li><b>Blut.</b> Heb je geen munten meer? Dan krijg je een mega strafpunt en ${A.BLUT_MUNTEN} nieuwe munten.</li>
      <li><b>Het einde.</b> Na de laatste ronde wint wie de meeste munten heeft. Wie de minste heeft, krijgt een mega strafpunt.</li>
    </ol>
    <h3>De minispellen</h3>
    <ul>${A.SPELLEN.map((k) => `<li><b>${A.SPEL_NAAM[k]}.</b> ${A.SPEL_UITLEG[k]}</li>`).join('')}</ul>
    <p class="small">Is het gelijk, dan spelen de twee het minispel nog een keer; na ${A.MAX_POGING} keer gelijk beslist het lot. Doet iemand niks, dan verliest hij als de tijd om is. De host kiest vooraf ${A.LENGTES.slice(0, -1).join(', ')} of ${A.LENGTES[A.LENGTES.length - 1]} rondes, en kan voor wie weg is de inzet overslaan of het duel opgeven. Wie later aanschuift, begint met ${A.START_MUNTEN} munten. De munten zijn alleen voor het spel en niks waard. Wat een strafpunt is, spreken jullie samen af.</p>
  </div>`;
}

function openSheet(key, html) { ui.sheet = { key, html }; renderSheet(); }
function closeSheet() { ui.sheet = null; renderSheet(); }

function renderSheet() {
  const ov = $('#overlay'), sh = $('#sheet');
  if (!ui.sheet) { if (!ov.hidden) { ov.hidden = true; sh.innerHTML = ''; } ui.sheetHtml = null; return; }
  const wasHidden = ov.hidden;
  if (!wasHidden && ui.sheetHtml === ui.sheet.html) return;
  sh.innerHTML = ui.sheet.html;
  sh.classList.toggle('anim', wasHidden);
  ov.hidden = false;
  ui.sheetHtml = ui.sheet.html;
  if (wasHidden) { const first = sh.querySelector('button, a'); if (first) first.focus({ preventScroll: true }); }
}

function toast(msg, cls = '') {
  const box = $('#toasts'), el = document.createElement('div');
  // dezelfde melding nog in beeld (bijvoorbeeld na een paar keer tikken)? Dan alleen de nieuwe
  for (const old of box.querySelectorAll('div:not(.net)')) if (old.textContent === msg) old.remove();
  el.textContent = msg; if (cls) el.className = cls;
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 2800);
}

function netPill() {
  const box = $('#toasts');
  let el = box.querySelector('.net');
  const bad = S && Net.status !== 'open';
  if (bad && !el) { el = document.createElement('div'); el.className = 'net'; el.textContent = 'Verbinding kwijt, opnieuw verbinden…'; box.prepend(el); }
  if (!bad && el) el.remove();
}

function celebrate() {
  if (reduce) return;
  const box = $('#confetti'), cols = ['#f7c548', '#d690c9', '#ff6b8b', '#2fbf71', '#ff7a00', '#f3efdb'];
  box.innerHTML = Array.from({ length: 70 }, () => `<i style="left:${(Math.random() * 100).toFixed(1)}%;background:${cols[Math.floor(Math.random() * cols.length)]};--t:${(2.4 + Math.random() * 2).toFixed(2)}s;--dl:${(Math.random() * .6).toFixed(2)}s;--x:${Math.round((Math.random() - .5) * 160)}px;--r:${Math.round(360 + Math.random() * 720)}deg"></i>`).join('');
  setTimeout(() => { box.innerHTML = ''; }, 5200);
}

/* ================= TEKENEN ================= */
function view() {
  if (!S) return 'home';
  if (S.phase === 'lobby') return 'lobby';
  return S.phase;
}

function render() {
  const v = view();
  // een nieuwe stap: het dock springt even op
  const step = S ? `${v}:${S.ronde}:${S.duel ? S.duel.poging : 0}:${!!(S.bets && S.bets[S.you])}` : v;
  ui.dockPop = step !== ui.lastStep;
  ui.lastStep = step;
  document.documentElement.dataset.view = v;
  const scr = $('#screen');
  const nameIn = $('#nameIn'), codeIn = $('#codeIn');
  if (nameIn) ui.name = nameIn.value;
  if (codeIn) ui.code = codeIn.value;
  const html = { home: vHome, lobby: vLobby, inzet: vInzet, duel: vDuel, uitslag: vUitslag, klaar: vKlaar }[v]();
  // staat er precies hetzelfde? Dan niks vervangen: zo blijft het tikvlak rustig tijdens een duel
  if (v !== ui.lastView || html !== ui.lastHtml) {
    const keep = v === ui.lastView ? scr.scrollTop : 0;
    scr.classList.toggle('is-game', v !== 'home');
    scr.innerHTML = `<div class="view v-${v}${v !== 'home' ? ' game' : ''}">${html}</div>`;
    placeSeats();
    scr.scrollTop = keep;
    ui.lastHtml = html;
  }
  ui.lastView = v;
  duelPaint();
  const own = $('#owe');
  if (S && S.phase !== 'lobby') {
    const p = S.players[S.you];
    own.hidden = false;
    own.classList.toggle('zero', !p.straf && !p.mega);
    own.innerHTML = `${STRAF}${p.straf}${p.mega ? ` +${p.mega}M` : ''}`;
    own.setAttribute('aria-label', `Jij hebt ${straf(p.straf)}${p.mega ? ` en ${p.mega} mega` : ''}`);
  } else own.hidden = true;
  if (ui.sheet && ui.sheet.key === 'menu') ui.sheet.html = menuHTML();
  if (ui.sheet && ui.sheet.key === 'score' && S && S.phase !== 'lobby') ui.sheet.html = scoreHTML();
  renderSheet();
  netPill();
}

/* ================= BEDIENING ================= */
function myName() {
  const input = $('#nameIn');
  const name = A.cleanNames([input ? input.value : ui.name])[0] || '';
  if (!name) { ui.error = 'Vul eerst je naam in.'; render(); const n = $('#nameIn'); if (n) n.focus(); return null; }
  me.name = name; ui.name = name; store.set(KEY.me, me);
  return name;
}

function joinWith(code) {
  const name = myName();
  if (!name) return;
  code = String(code || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (code.length !== 4) { ui.error = 'Vul de code van 4 letters in.'; render(); return; }
  ui.joining = true; ui.error = ''; ui.code = code;
  Snd.ac();
  Net.go({ t: 'join', code, name, token: me.token });
  render();
}

const actions = {
  create() {
    const name = myName();
    if (!name) return;
    ui.joining = true; ui.error = '';
    Snd.ac();
    Net.go({ t: 'create', name, token: me.token });
    render();
  },
  start() { Snd.ac(); Net.send({ t: 'start' }); },
  rondes(el) { Net.send({ t: 'settings', rondes: +el.dataset.n }); },
  share() {
    const url = `${location.origin}/arena/${S.code}`, text = `Doe mee met Arena, code ${S.code}`;
    closeSheet();
    if (navigator.share) navigator.share({ title: 'Arena', text, url }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Link gekopieerd'), () => toast(url));
    else toast(url);
  },
  kickask(el) {
    const i = +el.dataset.seat;
    openSheet('kick', `${sheetTop(`${nameOf(i)} van tafel halen?`)}
      <p>${nameOf(i)} kan daarna opnieuw meedoen met de code.</p>
      <button class="cta" type="button" data-act="kick" data-seat="${i}"><span>Ja, van tafel halen</span>${ARR}</button>
      <button class="ghostbtn" type="button" data-act="close">Nee</button>`);
  },
  kick(el) { Net.send({ t: 'kick', seat: +el.dataset.seat }); closeSheet(); },
  // inzetten: eerst rood of blauw, dan hoeveel, dan vastzetten
  pickop(el) { Snd.ac(); Snd.chip(); ui.bet.op = +el.dataset.op; render(); },
  stake(el) { Snd.chip(); ui.bet.n = +el.dataset.n; render(); },
  bet() {
    const max = Math.min(A.MAX_INZET, S.players[S.you].munten);
    Snd.ac(); buzz(30);
    Net.send({ t: 'bet', op: ui.bet.op, n: Math.min(ui.bet.n, max) });
  },
  skipbet(el) { Net.send({ t: 'skipbet', for: +el.dataset.for }); },
  opgeven(el) { Net.send({ t: 'opgeven', for: +el.dataset.for }); },
  kies(el) { Snd.ac(); Snd.chip(); buzz(30); Net.send({ t: 'kies', k: el.dataset.k }); },
  next() { Snd.ac(); Net.send({ t: 'next' }); },
  mine() {
    const p = S.players[S.you];
    toast(p.straf || p.mega ? `Jij hebt ${straf(p.straf)}${p.mega ? ` en ${p.mega} mega ${p.mega === 1 ? 'strafpunt' : 'strafpunten'}` : ''}` : 'Jij hebt nog geen strafpunten');
  },
  menu() { openSheet('menu', menuHTML()); },
  uitleg() { closeSheet(); window.Uitleg?.open('arena'); },
  rules() { openSheet('rules', rulesHTML()); },
  score() { openSheet('score', scoreHTML()); },
  mute() { Snd.muted = !Snd.muted; store.set(KEY.mute, Snd.muted); if (!Snd.muted) Snd.chip(); openSheet('menu', menuHTML()); },
  againask() {
    openSheet('again', `${sheetTop('Terug naar de lobby?')}
      <p>De stand begint dan opnieuw. In de lobby kunnen nieuwe spelers aanschuiven en kun je spelers van tafel halen.</p>
      <button class="cta" type="button" data-act="again"><span>Ja, terug naar de lobby</span>${ARR}</button>
      <button class="ghostbtn" type="button" data-act="close">Nee, verder spelen</button>`);
  },
  again() { Net.send({ t: 'again' }); closeSheet(); },
  leaveask() {
    openSheet('leave', `${sheetTop('De arena verlaten?')}
      <p>${S && S.phase !== 'lobby' ? 'Met de code kom je terug op je eigen plek, met je eigen munten.' : 'Met de code kun je later weer aanschuiven.'}</p>
      <button class="cta" type="button" data-act="leave"><span>Ja, verlaten</span>${ARR}</button>
      <button class="ghostbtn" type="button" data-act="close">Nee, blijven</button>`);
  },
  leave() { Net.send({ t: 'leave' }); leaveLocal(); },
  close: closeSheet,
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled && actions[el.dataset.act]) { actions[el.dataset.act](el); return; }
  if (e.target === $('#overlay')) closeSheet();
});
// het tikvlak reageert meteen bij het aanraken (niet pas bij het loslaten): dat scheelt tijd, en zo telt elke vinger
document.addEventListener('pointerdown', (e) => {
  if (e.target.closest('[data-pad]')) { e.preventDefault(); padTap(); return; }
  const a = e.target.closest('[data-ans]');
  if (a && !a.disabled) { e.preventDefault(); ansTap(+a.dataset.ans); }
});
document.addEventListener('submit', (e) => { if (e.target.id === 'joinForm') { e.preventDefault(); joinWith($('#codeIn').value); } });
document.addEventListener('input', (e) => {
  if (e.target.id === 'codeIn') { const v = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); if (v !== e.target.value) e.target.value = v; }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#overlay').hidden) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'nameIn') { e.preventDefault(); const c = $('#codeIn'); if (c && c.value.length === 4) joinWith(c.value); else if (c) c.focus(); }
  // met het toetsenbord: spatie of enter op het tikvlak
  if ((e.key === ' ' || e.key === 'Enter') && !e.repeat && e.target.closest && e.target.closest('[data-pad]')) { e.preventDefault(); padTap(); }
});
addEventListener('resize', placeSeats);

/* ================= START ================= */
// stond je net nog in een arena (en open je niet een andere link)? Dan meteen terug op je plek.
const lastTable = store.get(KEY.table, null);
if (lastTable && typeof lastTable.code === 'string' && (!urlCode || urlCode === lastTable.code)) {
  ui.joining = true;
  Net.go({ t: 'join', code: lastTable.code, name: me.name, token: me.token });
}
render();
if (urlCode && !ui.joining) { const n = $('#nameIn'); if (n && !n.value) n.focus(); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeSeats);
</script>
</body>
</html>
