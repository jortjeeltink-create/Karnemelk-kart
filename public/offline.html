<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geen verbinding · De Spelkeet</title>
<meta name="theme-color" content="#150b18">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(120% 90% at 50% 0%,#3a1c45 0%,#211026 55%,#120914 100%);color:#f3efdb;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
main{width:min(100%,380px)}
img{width:96px;height:96px;border-radius:24px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
h1{margin:18px 0 8px;font-size:26px;line-height:1.15}
p{margin:0 0 18px;color:#d8cfdb}
button{width:100%;min-height:52px;border:0;border-radius:16px;background:#e5483b;color:#fff;font:800 17px/1 system-ui,sans-serif;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);cursor:pointer}
button:focus-visible{outline:3px solid #f2c230;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/img/speelhal-192.png" alt="">
  <h1>Geen verbinding</h1>
  <p>De Spelkeet heeft internet nodig: je speelt live met je vrienden aan tafel. Kijk of je wifi of mobiele data aan staat en probeer het opnieuw.</p>
  <button type="button" onclick="location.reload()">Opnieuw proberen</button>
</main>
</body>
</html>
