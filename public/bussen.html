  <div class="titles">${t.map((x, i) => `<div class="tcard cream${i === 0 ? ' first' : ''}"><span><span class="chip">${x.title}</span></span><b>${esc(andList(x.names))}</b><small>${x.text}</small></div>`).join('')}</div>
  <div class="scorecard cream"><table>

  </table></div>
  ${isHost() ? `<button class="cta" type="button" data-act="again"><span>Nog een potje</span>${ARR}</button>` : `<p class="note">Wachten tot ${nameOf(S.host)} een nieuw potje start.</p>`}

/* ================= VELLEN ================= */
const sheetTop = (title, kick = '', close = true) => `<div class="sheet-top"><div>${kick ? `<p class="kick">${kick}</p>` : ''}<h2 class="sheet-title" id="sheetTitle">${title}</h2></div>${close ? '<button class="xbtn" type="button" data-act="close" aria-label="Sluiten">✕</button>' : ''}</div>`;

function sipsHTML() {
  const m = S.me, end = S.phase === 'klaar';
  if (m.pending > 0) {
    const from = m.from.map((f) => `${f.p === -1 ? 'jezelf' : f.p === S.you ? 'jezelf' : esc(S.players[f.p].name)}${m.from.length > 1 ? ` (${f.n})` : ''}`);
    return `${sheetTop('Slokken!', end ? 'Einde van het spel' : 'Voor jou', false)}

}

function bakHTML() {
  const m = S.me, disco = m.bakFrom.some((f) => f.disco);

function menuHTML() {

function rulesHTML() {
  return `${sheetTop('Spelregels', 'Bussen')}
  <button class="ghostbtn rules-how" type="button" data-act="uitleg"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-2px;margin-right:6px"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>Bekijk de uitleg met plaatjes</button>
  <div class="rules">
    <p>Iedereen speelt op zijn eigen telefoon. Maak een tafel en deel de code, of doe mee met de code van een ander.</p>
    <h3>1. De vragenronde</h3>
    <p>Iedereen krijgt om de beurt vier kaarten, steeds met een vraag. Fout geraden? Dan drink je. Goed? Dan hoef je niks.</p>
    <ol>
      <li>Rood of zwart? <b>1 slok</b></li>

    <h3>2. De piramide</h3>
    <p>Er liggen ${B.PYRAMID_SIZE} kaarten, van onder naar boven: ${andList(B.PYRAMID.map((r) => r.lay.length === 1 ? 'één' : String(r.lay.length)))}. De host draait ze één voor één om en iedereen ziet tegelijk welke kaart open ligt. Heb je dezelfde waarde in je hand? Tik dan zelf je kaart aan om hem weg te leggen, voordat de volgende kaart om gaat. Daarna deel je uit: tik aan tafel op wie er drinkt. Elke rij is een aantal slokken waard, van onder naar boven ${andList(B.PYRAMID.map((r) => String(r.sips)))}. Ligt de kaart dwars, dan telt hij dubbel: de onderste is dus ${slotText(0)} en de bovenste ${slotText(B.PYRAMID_SIZE - 1)}.</p>

    <p>In de bus liggen ${S ? S.busLength : B.BUS_DEFAULT} kaarten op een rij en de eerste ligt open. Raad steeds of de volgende hoger of lager is. Fout of paal? Drink zoveel slokken als de hoeveelste gok het was en begin opnieuw met nieuwe kaarten. Haal je het eind, dan ben je uit de bus.</p>
    <p class="small">Valt iemand weg, dan kan de host even voor die speler spelen. Wie terugkomt, zit weer op zijn eigen plek. Drink met mate: water of karnemelk telt ook.</p>
  </div>`;
}

function openSheet(key, html) { ui.sheet = { key, html }; renderSheet(); }
function closeSheet() { ui.sheet = null; renderSheet(); }

// welk vel er open moet: wat je zelf opende, anders je slokken (na het laten zien van een uitslag)
function renderSheet() {
  let key = null, html = null, sips = false;
  if (ui.sheet) { key = ui.sheet.key; html = ui.sheet.html; }
  else if (S && S.me && !ui.show && !ui.banner && S.me.bak > 0) {
    key = `bak:${S.me.bak}`;
    html = bakHTML(); sips = true;
  } else if (S && S.me && !ui.show && (S.me.pending > 0 || S.me.settle)) {
    key = `sips:${S.me.pending}:${S.me.settle}:${S.me.saved}:${S.phase === 'klaar'}`;
    html = sipsHTML(); sips = true;
  }
  const ov = $('#overlay'), sh = $('#sheet');
  if (!html) { if (!ov.hidden) { ov.hidden = true; sh.innerHTML = ''; } ui.sheetKey = null; return; }
  if (ui.sheetKey === key && !ov.hidden) return;
  const wasHidden = ov.hidden;
  sh.innerHTML = html;
  sh.classList.toggle('anim', wasHidden);
  sh.dataset.sips = sips ? '1' : '';
  ov.hidden = false;
  ui.sheetKey = key;
  if (wasHidden) { const first = sh.querySelector('button, a'); if (first) first.focus({ preventScroll: true }); if (sips) { buzz([40, 40, 40]); Snd.chip(); } }
}

function toast(msg, cls = '') {
  const box = $('#toasts'), el = document.createElement('div');
  // dezelfde melding nog in beeld (bijvoorbeeld na een paar keer tikken)? Dan alleen de nieuwe
  for (const old of box.querySelectorAll('div:not(.net)')) if (old.textContent === msg) old.remove();
  el.textContent = msg; if (cls) el.className = cls;
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 2800);
}

function netPill() {
  const box = $('#toasts');
  let el = box.querySelector('.net');
  const bad = S && Net.status !== 'open';
  if (bad && !el) { el = document.createElement('div'); el.className = 'net'; el.textContent = 'Verbinding kwijt, opnieuw verbinden…'; box.prepend(el); }
  if (!bad && el) el.remove();
}

function celebrate() {
  if (reduce) return;
  const box = $('#confetti'), cols = ['#f7c548', '#d690c9', '#4f8dff', '#2fbf71', '#ff7a00', '#f3efdb'];
  box.innerHTML = Array.from({ length: 70 }, () => `<i style="left:${(Math.random() * 100).toFixed(1)}%;background:${cols[Math.floor(Math.random() * cols.length)]};--t:${(2.4 + Math.random() * 2).toFixed(2)}s;--dl:${(Math.random() * .6).toFixed(2)}s;--x:${Math.round((Math.random() - .5) * 160)}px;--r:${Math.round(360 + Math.random() * 720)}deg"></i>`).join('');
  setTimeout(() => { box.innerHTML = ''; }, 5200);
}

/* ================= TEKENEN ================= */
const GAME_VIEWS = new Set(['lobby', 'vragen', 'piramide', 'kiezen', 'bus']);
const EV_VIEW = { vraag: 'vragen', piramide: 'piramide', kies: 'kiezen', bus: 'bus' };
const BANNERS = {
  vragen: () => ({ title: 'Vragenronde', sub: 'Fase 1 van 3' }),
  piramide: () => ({ title: 'De piramide', sub: 'Fase 2 van 3' }),
  kiezen: () => ({ title: 'Gelijkspel!', sub: 'Kies een kaart' }),
  bus: () => ({ title: S.rider === S.you ? 'Jij moet de bus in' : `${nameOf(S.rider)} moet de bus in`, sub: 'Fase 3 van 3' }),
};

function view() {
  if (!S) return 'home';
  if (S.phase === 'lobby') return 'lobby';
  if (ui.show) return EV_VIEW[ui.show.ev.type];
  return S.phase;
}

function render() {
  const v = view();
  // een nieuwe fase: even een groot bord over de tafel
  if (v !== ui.lastView && BANNERS[v] && ui.lastView && ui.lastView !== 'home' && !(v === 'vragen' && ui.lastView !== 'lobby')) {
    ui.banner = BANNERS[v]();
    clearTimeout(ui.bannerTimer);
    ui.bannerTimer = setTimeout(() => { ui.banner = null; render(); }, 2000);
    if (v === 'bus') Snd.horn();
  }
  document.documentElement.dataset.view = v;
  const scr = $('#screen');
  const nameIn = $('#nameIn'), codeIn = $('#codeIn');
  if (nameIn) ui.name = nameIn.value;
  if (codeIn) ui.code = codeIn.value;
  const keep = v === ui.lastView ? scr.scrollTop : 0;
  const html = { home: vHome, lobby: vLobby, vragen: vVragen, piramide: vPiramide, kiezen: vKiezen, bus: vBus, klaar: vKlaar }[v]();
  scr.classList.toggle('is-game', GAME_VIEWS.has(v));
  scr.innerHTML = `<div class="view v-${v}${GAME_VIEWS.has(v) ? ' game' : ''}">${html}</div>`;
  placeSeats();
  scr.scrollTop = keep;
  ui.lastView = v;
  if (ui.show) ui.show.fresh = false;
  ui.gave = -1; ui.redeal = false;
  const owe = $('#owe');
  if (S && S.me) {
    const n = S.players[S.you].owe;
    owe.hidden = false;
    owe.classList.toggle('zero', !n);
    owe.innerHTML = `${GLASS}${n}`;
    owe.setAttribute('aria-label', `Je hebt nog ${B.sipsText(n)} staan`);
  } else owe.hidden = true;
  renderSheet();
  netPill();
}

/* ================= BEDIENING ================= */
function myName() {
  const input = $('#nameIn');
  const name = B.cleanNames([input ? input.value : ui.name])[0] || '';
  if (!name) { ui.error = 'Vul eerst je naam in.'; render(); const n = $('#nameIn'); if (n) n.focus(); return null; }
  me.name = name; ui.name = name; store.set(KEY.me, me);
  return name;
}

function joinWith(code) {
  const name = myName();
  if (!name) return;
  code = String(code || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (code.length !== 4) { ui.error = 'Vul de code van 4 letters in.'; render(); return; }
  ui.joining = true; ui.error = ''; ui.code = code;
  Snd.ac();
  Net.go({ t: 'join', code, name, token: me.token });
  render();
}

const actions = {
  create() {
    const name = myName();
    if (!name) return;
    ui.joining = true; ui.error = '';
    Snd.ac();
    Net.go({ t: 'create', name, token: me.token });
    render();
  },
  buslen(el) { Net.send({ t: 'settings', busLength: +el.dataset.n }); },
  start() { Net.send({ t: 'start' }); },
  again() { Net.send({ t: 'again' }); },
  share() {
    const url = `${location.origin}/bussen/${S.code}`, text = `Doe mee met Bussen aan tafel ${S.code}`;
    closeSheet();
    if (navigator.share) navigator.share({ title: 'Bussen', text, url }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Link gekopieerd'), () => toast(url));
    else toast(url);
  },
  kickask(el) {
    const i = +el.dataset.seat;
    openSheet('kick', `${sheetTop(`${nameOf(i)} van tafel halen?`)}
      <p>${nameOf(i)} kan daarna opnieuw meedoen met de code.</p>
      <button class="cta" type="button" data-act="kick" data-seat="${i}"><span>Ja, van tafel halen</span>${ARR}</button>
      <button class="ghostbtn" type="button" data-act="close">Nee</button>`);
  },
  kick(el) { Net.send({ t: 'kick', seat: +el.dataset.seat }); closeSheet(); },
  answer(el) { Snd.ac(); Net.send({ t: 'answer', o: el.dataset.o }); },
  give(el) {
    const d = myDeal();
    if (!d) return;
    const dr = draftOf(d), sum = Object.values(dr.to).reduce((a, b) => a + b, 0), to = +el.dataset.to;
    if (sum >= d.n) { toast('Alle slokken zijn verdeeld. Tik op Uitdelen.'); return; }
    dr.to[to] = (dr.to[to] || 0) + 1;
    ui.gave = to; Snd.chip();
    render();
  },
  redraft() { if (ui.draft) ui.draft.to = {}; render(); },
  dealgo() { const d = myDeal(); if (d && ui.draft) { Net.send({ t: 'deal', to: ui.draft.to }); } },
  skipdeal() { Net.send({ t: 'skipDeal' }); },
  skipfor(el) { Net.send({ t: 'skipDeal', from: +el.dataset.from }); },
  flip() { Net.send({ t: 'flip', i: S.next }); },
  lay(el) {
    const cur = openSlot(), card = { r: +el.dataset.r, s: +el.dataset.s };
    if (!cur || !cur.card) return;
    if (card.r !== cur.card.r) { Snd.bad(); buzz(40); toast(`Die past niet: er ligt een ${rankWord(cur.card)} open`); return; }
    Net.send({ t: 'lay', card });
  },
  endpyr() { Net.send({ t: 'endpyr' }); },
  pick(el) { Net.send({ t: 'pick', i: +el.dataset.i, for: +el.dataset.for }); },
  guess(el) { Net.send({ t: 'guess', o: el.dataset.o }); },
  retry() { Net.send({ t: 'retry' }); },
  sipsnow() { Net.send({ t: 'sips', act: 'now' }); Snd.good(); },
  bakdone() { Net.send({ t: 'bak' }); Snd.good(); },
  sipssave() { Net.send({ t: 'sips', act: 'save' }); Snd.chip(); },
  owe() {
    const p = S.players[S.you];
    toast(p.owe ? `Je hebt nog ${B.sipsText(p.owe)} staan, waarvan ${p.saved} gespaard` : 'Je hebt geen slokken meer staan');
  },
  menu() { openSheet('menu', menuHTML()); },
  uitleg() { closeSheet(); window.Uitleg?.open('bussen'); },
  rules() { openSheet('rules', rulesHTML()); },
  mute() { Snd.muted = !Snd.muted; store.set(KEY.mute, Snd.muted); if (!Snd.muted) Snd.chip(); openSheet('menu', menuHTML()); },
  leaveask() {
    openSheet('leave', `${sheetTop('Tafel verlaten?')}
      <p>${S && S.phase !== 'lobby' && S.phase !== 'klaar' ? 'Je plek blijft bewaard: met de code kom je terug op je eigen plek. Tot die tijd kan de host voor je spelen.' : 'Met de code kun je later weer aanschuiven.'}</p>
      <button class="cta" type="button" data-act="leave"><span>Ja, verlaten</span>${ARR}</button>
      <button class="ghostbtn" type="button" data-act="close">Nee, blijven</button>`);
  },
  leave() { Net.send({ t: 'leave' }); leaveLocal(); },
  close: closeSheet,
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled && actions[el.dataset.act]) { actions[el.dataset.act](el); return; }
  if (e.target === $('#overlay') && !$('#sheet').dataset.sips) closeSheet();
});
document.addEventListener('submit', (e) => { if (e.target.id === 'joinForm') { e.preventDefault(); joinWith($('#codeIn').value); } });
document.addEventListener('input', (e) => {
  if (e.target.id === 'codeIn') { const v = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); if (v !== e.target.value) e.target.value = v; }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#overlay').hidden && !$('#sheet').dataset.sips) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'nameIn') { e.preventDefault(); const c = $('#codeIn'); if (c && c.value.length === 4) joinWith(c.value); else if (c) c.focus(); }
});
addEventListener('resize', placeSeats);

/* ================= START ================= */
// zat je net nog aan een tafel (en open je niet een andere link)? Dan meteen terug op je plek.
const lastTable = store.get(KEY.table, null);
if (lastTable && typeof lastTable.code === 'string' && (!urlCode || urlCode === lastTable.code)) {
  ui.joining = true;
  Net.go({ t: 'join', code: lastTable.code, name: me.name, token: me.token });
}
render();
if (urlCode && !ui.joining) { const n = $('#nameIn'); if (n && !n.value) n.focus(); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeSeats);
</script>
</body>
</html>
