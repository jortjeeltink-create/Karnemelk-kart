<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bakplaten</title>
<meta name="description" content="Bakplaten: het simpelste kaartspel op één telefoon. Trek om de beurt een kaart; een plaatje of een aas is een mega strafpunt.">
<meta name="theme-color" content="#1a0f0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bakplaten">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/bakplaten.webmanifest">
<link rel="icon" href="/img/bakplaten.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/bakplaten-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap">
<style>
:root{
  /* Een warme oven: donkerbruin, koper en oranje gloed, en de stapel kaarten ligt op een stalen bakplaat.
     Eén grote knop om een kaart te trekken, en groot in beeld wat je trok. */
  --bg:#1a0f0a;
  --bg-2:#24150d;
  --card:#2a1a11;
  --card-2:#352217;
  --line:rgba(255,255,255,.1);
  --txt:#fbf1e6;
  --mute:#c2a891;
  --oven:#ff8a3d;
  --hot:#ff5a2a;
  --gold:#ffc94d;
  --red:#d2343f;
  --ink:#24130c;
  --paper:#fffaf2;
  --head:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg) radial-gradient(90% 60% at 50% 100%,rgba(255,110,40,.28),transparent 70%) fixed no-repeat;color:var(--txt);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--head);font-weight:900;margin:0;line-height:1.05;letter-spacing:-.01em}
p{margin:0}

.app{position:relative;z-index:1;min-height:100svh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:8px;min-height:52px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px 0 8px;border-radius:999px;color:var(--mute);text-decoration:none;font-weight:600;font-size:15px}
.back:hover{color:var(--txt)}
.top .title{font-family:var(--head);font-weight:900;font-size:19px;margin-right:auto}
.top .spacer{margin-right:auto}
.iconbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--txt)}
.iconbtn:hover{background:var(--card-2)}

.screen{flex:1;display:flex;flex-direction:column;gap:14px;padding-top:6px}
.screen.anim{animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card{padding:18px;border-radius:20px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.card h2{font-size:21px;margin-bottom:10px}
.label{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.muted{color:var(--mute);font-size:14px}
.grow{flex:1}
.center{text-align:center}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;padding:0 20px;border-radius:18px;font-family:var(--head);font-weight:800;font-size:21px;text-decoration:none;text-align:center}
.btn.go{background:linear-gradient(180deg,#ffa25c,#f06a1f);color:#2a0f00;box-shadow:0 12px 30px rgba(255,120,40,.35),inset 0 -4px 0 rgba(0,0,0,.15)}
.btn.go:active{transform:translateY(1px)}
.btn.go:disabled{opacity:.5}
.btn.stick{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2}
.btn.ghost{background:var(--card);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line);font-size:17px;min-height:52px}
.btn.ghost:hover{background:var(--card-2)}
.textlink{display:block;margin:0 auto;min-height:44px;padding:0 14px;color:var(--mute);font-weight:600;font-size:15px}
.textlink:hover{color:var(--txt)}

/* start */
.hero{display:grid;justify-items:center;text-align:center;gap:10px;padding:8px 0 2px}
.hero h1{font-size:clamp(50px,15vw,74px);line-height:.92}
.hero h1 span{color:var(--oven)}
.hero p{color:var(--mute);max-width:32ch}
.minis{display:flex;justify-content:center;gap:0;margin-bottom:4px}
.minis .pc{--w:58px;margin:0 -6px}
.minis .pc:nth-child(1){transform:rotate(-12deg) translateY(6px)}
.minis .pc:nth-child(3){transform:rotate(12deg) translateY(6px)}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;font-size:15px;line-height:1.45}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--oven);color:#2a0f00;font-family:var(--head);font-weight:900;font-size:15px}
.steps b{color:#fff}
.howlink{display:inline-flex;align-items:center;gap:8px;margin-top:12px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--card-2);font-weight:700;font-size:14px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0;padding-top:0}
.opt b{display:block;font-family:var(--head);font-weight:800;font-size:17px}
.opt small{display:block;color:var(--mute);font-size:13.5px;line-height:1.4}
.sw{position:relative;flex:none;width:56px;height:32px;border-radius:999px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.sw[aria-checked="true"]{background:var(--oven)}
.sw[aria-checked="true"]::after{transform:translateX(24px)}

/* een speelkaart */
.pc{--w:120px;position:relative;width:var(--w);height:calc(var(--w) * 1.4);border-radius:calc(var(--w) * .1);background:linear-gradient(160deg,var(--paper),#f1e6d4);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 10px 24px rgba(0,0,0,.4);flex:none}
.pc.red{color:var(--red)}
.pc .ix{position:absolute;left:7%;top:4.5%;display:grid;justify-items:center;font:900 calc(var(--w) * .17)/.95 var(--head)}
.pc .ix i{font-style:normal;font-size:.75em}
.pc .ix.b{left:auto;top:auto;right:7%;bottom:4.5%;transform:rotate(180deg)}
.pc .mid{position:absolute;inset:0;display:grid;place-items:center;font:900 calc(var(--w) * .52)/1 var(--head)}
.pc .mid.court{inset:15% 25%;border:2px solid currentColor;border-radius:calc(var(--w) * .07);font-size:calc(var(--w) * .34);align-content:center;gap:2px;justify-items:center}
.pc .mid.court i{font-style:normal;font-size:.7em}
.pc.back{background:repeating-linear-gradient(45deg,#8a3d18 0 6px,#a8501f 6px 12px);box-shadow:inset 0 0 0 calc(var(--w) * .05) #fffaf2,0 8px 18px rgba(0,0,0,.45)}

/* de bakplaat met de stapel */
.tray{position:relative;display:grid;place-items:center;padding:22px 16px 26px;border-radius:26px;background:linear-gradient(180deg,#5d6066,#3a3c41 60%,#2b2c30);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -6px 14px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.5)}
.tray::before{content:"";position:absolute;inset:10px;border-radius:18px;background:radial-gradient(rgba(0,0,0,.35) 1.5px,transparent 2px) 0 0/16px 16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.drawn{position:relative;display:flex;align-items:center;justify-content:center;gap:16px;min-height:calc(min(40vw,160px) * 1.4)}
.stack{position:relative;width:calc(min(26vw,104px));height:calc(min(26vw,104px) * 1.4)}
.stack .pc{position:absolute;inset:0;--w:min(26vw,104px)}
.stack .pc:nth-child(1){transform:translate(5px,5px)}
.stack .pc:nth-child(2){transform:translate(2.5px,2.5px)}
.stack b{position:absolute;left:50%;bottom:-12px;z-index:2;transform:translateX(-50%);padding:2px 10px;border-radius:999px;background:#140a05;color:var(--txt);font:800 12px/1.4 var(--head);white-space:nowrap}
.stack.leeg .pc{opacity:.15}
.open{--w:min(40vw,160px);animation:flip .45s cubic-bezier(.3,.7,.2,1) both}
@keyframes flip{0%{transform:rotateY(90deg) translateY(-14px)}100%{transform:none}}
.open.hot{box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 0 0 4px var(--gold),0 0 40px rgba(255,180,60,.7)}
.slot{width:min(40vw,160px);height:calc(min(40vw,160px) * 1.4);border-radius:16px;border:2px dashed rgba(255,255,255,.28);display:grid;place-items:center;color:rgba(255,255,255,.55);font:700 14px/1.3 var(--head);text-align:center;padding:10px}

.uitslag{text-align:center;min-height:80px}
.uitslag h2{font-size:clamp(34px,10vw,46px);line-height:1;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.uitslag h2.mega{background:linear-gradient(180deg,var(--gold),var(--oven) 50%,var(--hot));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 20px rgba(255,100,40,.45))}
.uitslag h2.niks{color:#9fe0b2}
.uitslag p{margin-top:6px;color:var(--mute);font-size:15px}
@keyframes pop{from{transform:scale(.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.screen.anim,.open,.uitslag h2{animation:none}}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tally div{padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.tally b{display:block;font:900 26px/1 var(--head)}
.tally span{font-size:12.5px;color:var(--mute)}
.history{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:34px}
.history .pc{--w:26px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.history .pc .ix{display:none}
.history .pc .mid{font-size:13px}
.history .pc .mid.court{inset:0;border:0;font-size:13px}
.history .pc.hit{box-shadow:0 0 0 2px var(--gold)}

.menu{position:fixed;inset:0;z-index:21;display:flex;align-items:flex-start;justify-content:flex-end;padding:calc(62px + env(safe-area-inset-top,0px)) 16px 16px;background:rgba(10,5,2,.5)}
.menu nav{width:min(100%,300px);display:grid;padding:8px;border-radius:18px;background:var(--card-2);box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 0 1px var(--line)}
.menu nav a,.menu nav button{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:12px;text-decoration:none;font-weight:600;text-align:left}
.menu nav a:hover,.menu nav button:hover{background:rgba(255,255,255,.06)}
.fine{margin-top:auto;padding-top:14px;text-align:center;color:#8c7462;font-size:12.5px;line-height:1.45}
.fine a{color:var(--mute)}
</style>
<script src="/js/poort.js" defer></script>
<script src="/js/uitleg.js" defer></script>
<script src="/js/review.js" defer></script>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="back" href="/?tab=een" aria-label="Terug naar De Spelkeet"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span id="backTxt">De Spelkeet</span></a>
    <span class="title" id="topTitle" hidden>Bakplaten</span>
    <span class="spacer" id="spacer"></span>
    <button class="iconbtn" id="soundBtn" type="button" aria-label="Geluid uit"></button>
    <button class="iconbtn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </header>
  <main id="screen" class="screen"></main>
  <p class="fine" id="fine">Wat een mega strafpunt is, spreken jullie samen af. Niks is verplicht, het gaat om de lol. <a href="/melden">Iets melden</a></p>
</div>

<div class="menu" id="menu" hidden>
  <nav aria-label="Menu">
    <button type="button" data-act="uitleg">❓ Hoe werkt het?</button>
    <button type="button" data-act="instellingen" id="menuSet">⚙️ Instellingen</button>
    <a href="/review?spel=bakplaten">⭐ Wat vind je ervan?</a>
    <a href="/melden">🚩 Iets melden</a>
    <a href="/?tab=een">🏠 Terug naar De Spelkeet</a>
  </nav>
</div>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= DE KAARTEN ================= */
// 52 kaarten, zonder jokers. s: 0 harten, 1 ruiten, 2 klaveren, 3 schoppen; r: 2 tot en met 14 (boer 11 ... aas 14)
const SUITS = [{ sym: '♥', red: true, naam: 'harten' }, { sym: '♦', red: true, naam: 'ruiten' }, { sym: '♣', red: false, naam: 'klaveren' }, { sym: '♠', red: false, naam: 'schoppen' }];
const RANK = { 11: 'B', 12: 'V', 13: 'H', 14: 'A' };
const RANKNAAM = { 11: 'boer', 12: 'vrouw', 13: 'heer', 14: 'aas' };
const label = (c) => RANK[c.r] || String(c.r);
const naam = (c) => `${SUITS[c.s].naam} ${RANKNAAM[c.r] || c.r}`;
function nieuwDeck() {
  const d = [];
  for (let s = 0; s < 4; s++) for (let r = 2; r <= 14; r++) d.push({ r, s });
  for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; }
  return d;
}
function kaartHTML(c, cls = '') {
  const red = SUITS[c.s].red, sym = SUITS[c.s].sym, rk = label(c), court = c.r >= 11 && c.r <= 13;
  return `<div class="pc${red ? ' red' : ''} ${cls}" role="img" aria-label="${naam(c)}"><span class="ix">${rk}<i>${sym}</i></span><span class="mid${court ? ' court' : ''}">${court ? `${rk}<i>${sym}</i>` : sym}</span><span class="ix b">${rk}<i>${sym}</i></span></div>`;
}
const rug = () => '<div class="pc back" aria-hidden="true"></div>';

/* ================= INSTELLINGEN EN HET POTJE ================= */
const KEY = 'spelkeet-bakplaten';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
const saved = load();
const S = { azen: saved.azen !== false, rood: !!saved.rood, geluid: saved.geluid !== false };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* geen opslag */ } };
// is deze kaart raak? Een plaatje (boer, vrouw, heer), en de aas als die meetelt
const raak = (c) => (c.r >= 11 && c.r <= 13) || (S.azen && c.r === 14);
let G = null;
function nieuwPotje() {
  G = { deck: nieuwDeck(), getrokken: [], mega: 0, laatste: null };
  try { fetch('/api/potje', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ spel: 'bakplaten' }), keepalive: true }).catch(() => {}); } catch (e) { /* niet erg */ }
}

/* ================= GELUID EN TRILLEN ================= */
let ac = null;
function audio() {
  if (!S.geluid) return null;
  try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; }
  return ac;
}
function piep(f, d, { type = 'sine', vol = .2, at = 0 } = {}) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .05);
}
function ruis(d, vol = .3) {
  const a = audio(); if (!a) return;
  const len = Math.ceil(a.sampleRate * d), buf = a.createBuffer(1, len, a.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 3000; g.gain.value = vol;
  src.connect(f).connect(g).connect(a.destination); src.start();
}
const Snd = {
  trek() { ruis(.12, .35); },
  // een plaatje: de ovenwekker gaat af
  mega() { for (let k = 0; k < 3; k++) piep(1568, .12, { type: 'triangle', vol: .2, at: .25 + k * .17 }); },
  niks() { piep(520, .1, { type: 'sine', vol: .12, at: .25 }); },
};
const tril = (p) => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* niet erg */ } };

/* ================= SCHERMEN ================= */
const SCHERM = {
  start() {
    return `<section class="hero"><div class="minis">${kaartHTML({ r: 11, s: 0 })}${kaartHTML({ r: 14, s: 3 })}${kaartHTML({ r: 13, s: 1 })}</div><h1>Bak<span>platen</span></h1><p>Het simpelste kaartspel dat er is. Trek een kaart en hoop dat het geen plaatje is.</p></section>
    <section class="card">
      <h2>Zo werkt het</h2>
      <ol class="steps">
        <li><span>Leg de telefoon midden op tafel. Om de beurt tik je op de stapel en <b>trek je een kaart</b>.</span></li>
        <li><span>Is het een <b>plaatje</b> (boer, vrouw of heer) of een <b>aas</b>? Dan krijg je een <b>mega strafpunt</b>.</span></li>
        <li><span>Een gewone kaart? Dan gebeurt er niks en is de volgende aan de beurt. Jullie spelen tot de stapel op is, of tot jullie klaar zijn.</span></li>
      </ol>
      <button class="howlink" type="button" data-act="uitleg">Uitleg met plaatjes ›</button>
    </section>
    <section class="card">
      <div class="opt"><span><b>Azen tellen mee</b><small>Uit: alleen boer, vrouw en heer zijn raak. Iets rustiger.</small></span><button class="sw" type="button" role="switch" data-sw="azen" aria-checked="${S.azen}" aria-label="Azen tellen mee"></button></div>
      <div class="opt"><span><b>Rood is uitdelen</b><small>Een rood plaatje geef je aan iemand anders, een zwart plaatje is voor jezelf. Iets heftiger.</small></span><button class="sw" type="button" role="switch" data-sw="rood" aria-checked="${S.rood}" aria-label="Rood is uitdelen"></button></div>
    </section>
    <button class="btn go" type="button" data-act="begin">Schud en begin</button>`;
  },
  spel() {
    const c = G.laatste, over = G.deck.length;
    let uitslag = '<p class="muted center">Tik op de stapel of op de knop om een kaart te trekken.</p>';
    if (c) {
      if (raak(c)) {
        const uitdelen = S.rood && SUITS[c.s].red;
        const wat = uitdelen ? `Een rode ${RANKNAAM[c.r]}: geef een mega strafpunt aan iemand anders.`
          : S.rood ? `Een zwarte ${RANKNAAM[c.r]}: die is voor jou.`
          : `Een ${RANKNAAM[c.r]}${c.r === 14 ? '' : ', een plaatje'}: dat is een mega strafpunt voor jou.`;
        uitslag = `<h2 class="mega">${uitdelen ? 'Deel uit!' : 'Mega strafpunt!'}</h2><p>${wat}</p>`;
      } else uitslag = `<h2 class="niks">Niks aan de hand</h2><p>Een ${label(c) === String(c.r) ? c.r : RANKNAAM[c.r]}. De volgende is aan de beurt.</p>`;
    }
    const geschiedenis = G.getrokken.slice(-9).map((k) => kaartHTML(k, raak(k) ? 'hit' : '')).join('');
    return `<section class="tray">
      <div class="drawn">
        <button class="stack${over ? '' : ' leeg'}" type="button" data-act="trek" aria-label="Trek een kaart" ${over ? '' : 'disabled'}>${rug()}${rug()}${rug()}<b>${over} over</b></button>
        ${c ? kaartHTML(c, `open${raak(c) ? ' hot' : ''}`) : '<div class="slot">Hier komt jouw kaart</div>'}
      </div>
    </section>
    <section class="uitslag" aria-live="polite">${uitslag}</section>
    <div class="tally"><div><b>${G.mega}</b><span>mega strafpunten gevallen</span></div><div><b>${G.getrokken.length}</b><span>van de 52 kaarten getrokken</span></div></div>
    <div class="history" aria-label="De laatste kaarten">${geschiedenis}</div>
    <div class="grow"></div>
    ${over ? '<button class="btn go stick" type="button" data-act="trek">Trek een kaart</button>' : '<button class="btn go stick" type="button" data-act="klaar">De stapel is op</button>'}`;
  },
  klaar() {
    return `<section class="hero"><div class="minis">${rug()}${rug()}${rug()}</div><h1>De stapel<br><span>is op</span></h1></section>
    <div class="tally"><div><b>${G.mega}</b><span>mega strafpunten gevallen</span></div><div><b>${G.getrokken.length}</b><span>kaarten getrokken</span></div></div>
    <div class="grow"></div>
    <button class="btn go" type="button" data-act="begin">Opnieuw schudden</button>
    <button class="textlink" type="button" data-act="instellingen">Instellingen</button>`;
  },
};

let nu = '';
function toon(naam) {
  const ander = naam !== nu;
  nu = naam;
  const el = $('#screen');
  el.className = `screen${ander ? ' anim' : ''}`;
  el.innerHTML = SCHERM[naam]();
  if (ander) { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; scrollTo(0, 0); }
  $('#topTitle').hidden = naam === 'start';
  $('#spacer').hidden = naam !== 'start';
  $('#backTxt').hidden = naam !== 'start';
  $('#menuSet').hidden = naam === 'start';
  // na een stapel: hoe vond je het? (zie review.js)
  if (window.SpelkeetReview) window.SpelkeetReview.stand('bakplaten', naam === 'start' ? 'lobby' : 'spel', naam === 'klaar' ? 2 : 0);
}
function trek() {
  if (!G || !G.deck.length) return;
  audio();
  const c = G.deck.pop();
  G.getrokken.push(c);
  G.laatste = c;
  if (raak(c)) { G.mega++; Snd.trek(); Snd.mega(); tril([120, 60, 120]); } else { Snd.trek(); Snd.niks(); }
  toon('spel');
}
function geluidKnop() {
  $('#soundBtn').innerHTML = S.geluid
    ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>'
    : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>';
  $('#soundBtn').setAttribute('aria-label', S.geluid ? 'Geluid uit' : 'Geluid aan');
}
const sluitMenu = () => { $('#menu').hidden = true; $('#menuBtn').setAttribute('aria-expanded', 'false'); };

/* ================= KNOPPEN ================= */
let laatsteTik = 0;
document.addEventListener('click', (e) => {
  const t = e.target.closest('button,[data-act]'); if (!t) { if (!$('#menu').hidden && !e.target.closest('#menu nav')) sluitMenu(); return; }
  if (t.id === 'menuBtn') { const m = $('#menu'); m.hidden = !m.hidden; t.setAttribute('aria-expanded', String(!m.hidden)); return; }
  if (t.id === 'soundBtn') { S.geluid = !S.geluid; save(); geluidKnop(); if (S.geluid) Snd.niks(); return; }
  if (!$('#menu').hidden) sluitMenu();
  if (t.dataset.sw) { S[t.dataset.sw] = !S[t.dataset.sw]; save(); return toon('start'); }
  switch (t.dataset.act) {
    case 'uitleg': if (window.Uitleg) window.Uitleg.open('bakplaten'); break;
    case 'begin': audio(); nieuwPotje(); toon('spel'); break;
    case 'trek': {
      // een dubbele tik trekt niet per ongeluk twee kaarten
      const nu2 = performance.now();
      if (nu2 - laatsteTik < 450) return;
      laatsteTik = nu2;
      trek(); break;
    }
    case 'klaar': toon('klaar'); break;
    case 'instellingen': toon('start'); break;
  }
});
addEventListener('keydown', (e) => { if (e.key === 'Escape') sluitMenu(); });

geluidKnop();
toon('start');
})();
</script>
</body>
</html>
