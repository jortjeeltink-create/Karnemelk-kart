<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wolvennacht</title>
<meta name="description" content="Wolvennacht: het weerwolvenspel online. iedereen krijgt geheim een rol op zijn telefoon en de server is de spelleider. 's Nachts kiezen de wolven een slachtoffer, overdag stemt het dorp.">
<meta name="theme-color" content="#150b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wolvennacht">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/weerwolven.webmanifest">
<link rel="icon" href="/img/weerwolven.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/weerwolven-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800;900&family=Grenze+Gotisch:wght@600;700;800&display=swap">
<style>
:root{
  /* Wolvennacht heeft een eigen sfeer: een open plek in het bos bij het dorp Nevelveen. 's Nachts brandt er een kampvuur onder
     de maan met de bomen eromheen, overdag is het het dorpsplein. Koppen in een gotische letter; kaarten en vellen van
     perkament met bruine inkt. De spelers zitten in een kring rond het vuur (jij altijd onderaan). */
  --night:#070a16;
  --parch:#efe3c4;
  --parch-2:#e2d2ab;
  --parch-3:#d3bf91;
  --ink:#2b1d12;
  --ink-2:#6b4f33;
  --cream:#efe3c4;
  --blood:#c4242b;
  --ember:#ff8a2b;
  --moon:#cfd9ff;
  --gold:#f2c14e;
  --good:#5fd38a;
  --bad:#ff5a5f;
  --ink-soft:#b8b09d;
  --glass:rgba(255,255,255,.07);
  --glass-line:rgba(239,227,196,.22);
  --glow:#5d74d6;
  --trees:#04060d;
  /* de kleur van elke rol */
  --r-wolf:#d8343a;
  --r-ziener:#8a6cff;
  --r-heks:#2fae68;
  --r-jager:#e8801f;
  --r-cupido:#ea5f92;
  --r-burger:#b08a52;
  --display:"Grenze Gotisch","Times New Roman",serif;
  --body:"Alegreya Sans","Helvetica Neue",Arial,sans-serif;
  --s1:12px; --s2:14.5px; --s3:16.5px;
  color-scheme:dark;
}
html[data-phase="dag"]{--glow:#d9a441;--trees:#16200f}
html[data-view="klaar"]{--glow:#d9a441;--trees:#16200f}
html[data-view="lobby"]{--glow:#b8572a}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{background:var(--night)}
body{margin:0;background:radial-gradient(130% 80% at 50% 0%,#1b2550 0%,#0b1026 42%,#05070f 100%) fixed;color:var(--parch);font-family:var(--body);font-size:var(--s2);line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
html[data-phase="dag"] body,html[data-view="klaar"] body{background:radial-gradient(130% 80% at 50% 0%,#5b4a30 0%,#2a1f14 45%,#0e0a06 100%) fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:800;letter-spacing:.005em}
p{margin:0}
.glow{position:fixed;left:50%;top:-34vh;width:150vw;max-width:1100px;height:70vh;transform:translateX(-50%);background:radial-gradient(closest-side,var(--glow),transparent);opacity:.28;pointer-events:none;z-index:0;transition:background .8s}
.stars{position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.7) 1px,transparent 1.6px),radial-gradient(rgba(207,217,255,.6) 1px,transparent 1.6px);background-size:61px 67px,97px 89px;background-position:0 0,31px 43px;opacity:.22;pointer-events:none;z-index:0;transition:opacity .8s}
html[data-phase="dag"] .stars,html[data-view="klaar"] .stars{opacity:0}

/* ---------- vaste UI ---------- */
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px 6px}
.bar-r{display:flex;gap:8px}
.glass{background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 24px rgba(0,0,0,.35)}
.round{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;color:var(--parch)}
.round:hover{background:rgba(255,255,255,.12)}
.owe{display:inline-flex;align-items:center;gap:5px;height:42px;padding:0 13px;border-radius:999px;font-weight:800;font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums}
.owe svg{width:16px;height:16px}
.owe.zero{color:var(--ink-soft)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:.01em;color:var(--parch);white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.brand svg{width:26px;height:26px;color:var(--blood);flex:none;filter:drop-shadow(0 0 6px rgba(196,36,43,.5))}

.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.screen.is-game{padding-bottom:0}
.view{display:flex;flex-direction:column;gap:14px;min-height:100%}
.view.game{display:grid;grid-template-rows:minmax(300px,1fr) auto;height:100%;min-height:0;gap:0}

.kick{font-size:var(--s1);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
/* perkament */
.cream{background:radial-gradient(130% 100% at 0% 0%,#fbf3dc 0%,#efe3c4 55%,#e0cc9f 100%);color:var(--ink);border-radius:18px;box-shadow:inset 0 0 0 1px rgba(43,29,18,.25),inset 0 0 40px rgba(120,80,30,.18),0 24px 70px rgba(0,0,0,.55)}
.chip{display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;background:var(--ink);color:var(--parch);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1.3}
.chip.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(43,29,18,.4)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;border-radius:999px;padding:9px 10px 9px 22px;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;color:var(--parch);text-decoration:none;text-align:left;background:linear-gradient(90deg,#2b1d12 0%,#6b2a17 50%,#c4512a 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 30px rgba(43,29,18,.35);transition:filter .2s,transform .2s}
.cta:hover{filter:brightness(1.12)}
.cta:active{transform:translateY(1px)}
.cta .arr{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);flex:none}
.cta:disabled{background:var(--parch-2);color:var(--ink-2);box-shadow:inset 0 0 0 1.5px rgba(43,29,18,.2);filter:none;transform:none}
.cta:disabled .arr{background:rgba(43,29,18,.08)}
.dock .cta,.dock .cta.hot{background:linear-gradient(90deg,#3a0d0c 0%,#8e1d1b 48%,#d5482b 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 30px rgba(0,0,0,.45)}
.dock .cta.moon{background:linear-gradient(90deg,#10173a 0%,#2a3c86 48%,#7d95ff 100%)}
.dock .cta:disabled{background:rgba(255,255,255,.07);color:var(--ink-soft);box-shadow:inset 0 0 0 1px rgba(239,227,196,.16)}
.ghostbtn{display:block;width:100%;border-radius:999px;padding:13px 20px;font-size:var(--s2);font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(43,29,18,.35);text-decoration:none;text-align:center}
.ghostbtn:hover{background:rgba(43,29,18,.06)}
.dock .ghostbtn{padding:11px 18px;color:var(--parch);box-shadow:inset 0 0 0 1px rgba(239,227,196,.3)}
.dock .ghostbtn:hover{background:rgba(255,255,255,.07)}
.linkbtn{justify-self:start;padding:4px 0;font-size:var(--s1);font-weight:700;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}

/* ---------- de open plek in het bos ---------- */
.table{position:relative;min-height:0;container-type:size;margin:4px -6px 8px}
/* de bomen achter de kring, als een rand van dennen */
.forest{position:absolute;left:-4%;right:-4%;top:2%;height:33%;background:var(--trees);-webkit-mask:var(--treeline) repeat-x left bottom/auto 100%;mask:var(--treeline) repeat-x left bottom/auto 100%;pointer-events:none;transition:background .8s}
.forest.back{top:-6%;height:30%;opacity:.55;-webkit-mask-position:60px bottom;mask-position:60px bottom}
/* de maan of de zon boven de bomen */
.orb{position:absolute;right:7%;top:.5%;width:min(13cqw,10cqh,60px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 36%,#fff 0%,#dfe6ff 45%,#aebdf5 100%);box-shadow:0 0 30px 8px rgba(207,217,255,.35),0 0 80px 20px rgba(207,217,255,.15);transition:background .8s,box-shadow .8s}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 62% 64%,rgba(150,165,220,.55) 0 9%,transparent 10%),radial-gradient(circle at 34% 58%,rgba(150,165,220,.45) 0 6%,transparent 7%),radial-gradient(circle at 56% 30%,rgba(150,165,220,.4) 0 5%,transparent 6%)}
.table.day .orb{background:radial-gradient(circle at 40% 38%,#fff7d6 0%,#ffd76a 45%,#f2a93b 100%);box-shadow:0 0 34px 10px rgba(255,200,90,.45),0 0 90px 30px rgba(255,180,60,.18)}
.table.day .orb::after{display:none}
/* de grond: 's nachts donker gras met het licht van het vuur, overdag het dorpsplein */
.ground{position:absolute;inset:calc(5% + 4px) calc(5% + 4px) calc(9% + 4px);border-radius:50%/34%;background:radial-gradient(ellipse 50% 40% at 50% 48%,rgba(255,140,50,.32) 0%,rgba(255,120,40,.1) 40%,transparent 70%),radial-gradient(ellipse 80% 70% at 50% 45%,#1d3528 0%,#112219 52%,#08120d 100%);box-shadow:0 0 26px 12px rgba(4,6,13,.85),inset 0 0 40px rgba(0,0,0,.55);transition:background .8s}
.ground::before{content:"";position:absolute;inset:9% 11%;border-radius:50%/34%;border:2px dashed rgba(239,227,196,.08)}
.table.day .ground{background:radial-gradient(ellipse 26% 20% at 50% 48%,#8a6a45 0%,#77593a 70%,transparent 72%),radial-gradient(ellipse 80% 70% at 50% 45%,#6f9a3e 0%,#4d7a2b 55%,#2e4b1b 100%);box-shadow:0 0 26px 12px rgba(14,10,6,.8),inset 0 0 40px rgba(0,0,0,.35)}
.table.day .ground::before{border-color:rgba(255,255,255,.12)}
.center{position:absolute;left:50%;top:48%;z-index:2;transform:translate(-50%,-50%);width:58cqw;display:grid;justify-items:center;gap:1.2cqh;text-align:center;pointer-events:none}
.ph-t{font-family:var(--display);font-weight:800;font-size:min(13cqw,10cqh,62px);line-height:.88;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 26px rgba(255,138,43,.45)}
.table.day .ph-t{text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 26px rgba(255,220,120,.4)}
.ph-t.code{font-family:var(--body);font-weight:900;font-size:min(16cqw,13cqh,80px);letter-spacing:.14em;margin-right:-.14em;color:var(--gold);text-shadow:0 4px 0 rgba(60,30,0,.6),0 0 30px rgba(242,193,78,.35)}
.ph-sub{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(239,227,196,.82);text-shadow:0 1px 3px rgba(0,0,0,.6)}
/* het kampvuur; overdag is het uit en rookt het nog na */
.fire{position:relative;display:block;width:min(24cqw,17cqh,110px);aspect-ratio:1}
.fire::before{content:"";position:absolute;inset:-55%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,138,43,.42),rgba(255,120,40,.12) 45%,transparent 72%);animation:fireglow 2.6s ease-in-out infinite}
@keyframes fireglow{50%{transform:scale(1.08);opacity:.8}}
.fire.small{width:min(15cqw,11cqh,66px)}
.fire svg{position:relative;display:block;width:100%;height:100%;overflow:visible}
.fire .fl{transform-box:fill-box;transform-origin:50% 100%}
.fire .f1{animation:flick 1.1s ease-in-out infinite alternate}
.fire .f2{animation:flick .8s ease-in-out infinite alternate-reverse}
.fire .f3{animation:flick .55s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) skewX(0)}50%{transform:scale(.93,1.07) skewX(-4deg)}100%{transform:scale(1.05,.94) skewX(4deg)}}
.fire .spark{animation:spark 1.8s ease-out infinite;opacity:0}
@keyframes spark{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fire .smoke{display:none;transform-box:fill-box;transform-origin:50% 50%}
.fire.out::before{display:none}
.fire.out .fl,.fire.out .spark{display:none}
.fire.out .smoke{display:block;animation:smoke 3.2s linear infinite}
@keyframes smoke{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:.55}100%{transform:translateY(-36px) scale(1.5);opacity:0}}
.ph-ico{width:min(17cqw,14cqh,80px);height:min(17cqw,14cqh,80px);display:block}
.ph-ico.shot{color:var(--r-jager);filter:drop-shadow(0 0 16px rgba(232,128,31,.6))}
.ph-ico.win{color:var(--gold);filter:drop-shadow(0 0 16px rgba(242,193,78,.6))}
.deckline{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.deckline span{display:inline-flex;align-items:center;gap:3px;padding:2px 8px 2px 4px;border-radius:999px;background:rgba(0,0,0,.45);font-size:11px;font-weight:700;color:var(--parch)}
.deckline svg{width:13px;height:13px;color:var(--rc)}
.banner{position:absolute;inset:0;z-index:6;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;pointer-events:none;background:radial-gradient(closest-side,rgba(5,7,15,.85),rgba(5,7,15,0));animation:banner 2.2s ease both}
.banner-t{font-family:var(--display);font-weight:800;font-size:min(14cqw,68px);line-height:.85;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.4),0 0 30px rgba(196,36,43,.6);max-width:84cqw}
@keyframes banner{0%{opacity:0;transform:scale(.85)}14%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
/* tijdens een melding verdwijnt het midden even, anders staat de tekst dubbel */
.table:has(.banner) .center{opacity:0}

/* stoelen: de spelers in een kring rond het vuur */
.seat{--ava:clamp(34px,12cqmin,52px);position:absolute;left:50%;top:50%;z-index:3;width:var(--ava);height:var(--ava);margin:calc(var(--ava) / -2) 0 0 calc(var(--ava) / -2);display:block;color:var(--parch);transition:opacity .3s,filter .3s}
.ava{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.5),rgba(255,255,255,0) 46%),var(--pc);box-shadow:0 0 0 3px #1a120b,0 0 0 4.5px rgba(239,227,196,.28),0 10px 20px rgba(0,0,0,.6);font-family:var(--display);font-weight:800;font-size:calc(var(--ava) * .56);line-height:1;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.4);transition:transform .15s,box-shadow .2s}
.seat.empty .ava{background:rgba(0,0,0,.35);box-shadow:0 0 0 2px rgba(239,227,196,.18);color:rgba(239,227,196,.55);border:1.5px dashed rgba(239,227,196,.35)}
.seat.off .ava{filter:grayscale(1) brightness(.7)}
.seat.now .ava{box-shadow:0 0 0 3px #1a120b,0 0 0 5px var(--gold),0 0 26px rgba(242,193,78,.6),0 10px 20px rgba(0,0,0,.55)}
.seat.now::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(var(--gold),rgba(242,193,78,0) 40%,rgba(242,193,78,0) 60%,var(--gold));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.plate{position:absolute;left:50%;top:calc(100% - 7px);z-index:1;transform:translateX(-50%);min-width:calc(var(--ava) * 1.4);max-width:calc(var(--ava) * 2.4);padding:2px 8px 3px;border-radius:8px;background:linear-gradient(180deg,#2c2117,#130d08);border:1px solid rgba(239,227,196,.22);box-shadow:0 6px 14px rgba(0,0,0,.6);display:grid;justify-items:center;line-height:1.2;white-space:nowrap}
.plate b{max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:800;color:#fff}
.plate span{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.plate span.zero{color:rgba(239,227,196,.45)}
.plate span.off{color:var(--ink-soft);font-weight:500}
.plate span.role{color:var(--rc);filter:brightness(1.25)}
.plate svg{width:11px;height:11px}
.seat.now .plate{border-color:var(--gold)}
.seat.me .plate{background:linear-gradient(180deg,#3d2616,#190f08);border-color:rgba(255,138,43,.55)}
button.seat{cursor:pointer}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
button.seat:active .ava{transform:scale(.94)}
/* dood: grijs, met een grafsteen */
.seat.dead .ava{background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.25),rgba(255,255,255,0) 46%),#39332f;color:rgba(255,255,255,.35);box-shadow:0 0 0 3px #1a120b,0 0 0 4.5px rgba(239,227,196,.1)}
.seat.dead .ava::after{content:"";position:absolute;inset:22%;background:currentColor;-webkit-mask:var(--tomb) center/contain no-repeat;mask:var(--tomb) center/contain no-repeat;color:rgba(239,227,196,.75)}
.seat.dead .ava i{opacity:0}
.seat.dead .plate{opacity:.88}
.seat.out{opacity:.45}
/* aan te tikken (kiezen, stemmen, schieten) en gekozen */
.seat.can .ava{box-shadow:0 0 0 3px #1a120b,0 0 0 4.5px rgba(239,227,196,.6),0 10px 20px rgba(0,0,0,.55)}
.seat.can::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px dashed rgba(239,227,196,.5);animation:spin 9s linear infinite}
.seat.sel .ava{box-shadow:0 0 0 3px #1a120b,0 0 0 6px var(--blood),0 0 26px rgba(196,36,43,.85),0 10px 20px rgba(0,0,0,.55);transform:scale(1.08)}
.seat.sel::before{border-color:var(--blood);border-style:solid;animation:none}
.seat.victim .ava{box-shadow:0 0 0 3px #1a120b,0 0 0 6px var(--blood),0 0 30px rgba(196,36,43,.9),0 10px 20px rgba(0,0,0,.55)}
.seat.victim::after{content:"";position:absolute;inset:-12px;border-radius:50%;box-shadow:0 0 0 2px var(--blood);animation:pulse 1.2s ease-in-out infinite;pointer-events:none}
/* rechtsboven op het hoofd: de rol (als je die mag zien); linksboven: hoeveel wolven iemand kiezen; linksonder: klaar of gestemd */
.badge{position:absolute;right:-14%;top:-14%;z-index:2;width:50%;height:50%;border-radius:50%;display:grid;place-items:center;background:var(--rc);color:#fff;box-shadow:0 0 0 2px #1a120b,0 3px 6px rgba(0,0,0,.5)}
.badge svg{width:66%;height:66%}
.mark{position:absolute;left:-18%;top:-16%;z-index:2;min-width:48%;height:44%;padding:0 4px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:1px;background:var(--blood);color:#fff;font-size:calc(var(--ava) * .26);font-weight:800;box-shadow:0 0 0 2px #1a120b,0 3px 6px rgba(0,0,0,.5)}
.mark svg{width:calc(var(--ava) * .26);height:calc(var(--ava) * .26)}
.mark.love{background:var(--r-cupido)}
.check{position:absolute;left:-10%;bottom:-6%;z-index:2;width:38%;height:38%;border-radius:50%;display:grid;place-items:center;background:var(--good);color:#06301a;box-shadow:0 0 0 2px #1a120b}
.check svg{width:70%;height:70%}
.tagwrap{position:absolute;left:50%;top:50%;z-index:4;width:0;height:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.tag{flex:none;transform:translateX(var(--tx,0px)) rotate(-5deg);padding:3px 9px 4px;border-radius:7px;font-family:var(--display);font-weight:800;font-size:calc(var(--ava) * .36 + 3px);line-height:1;white-space:nowrap;color:#2a1600;background:linear-gradient(180deg,#ffe892,#f2c14e 50%,#d99a17);box-shadow:0 0 0 2px #2a1600,0 6px 18px rgba(0,0,0,.5);animation:tagin .45s cubic-bezier(.2,.9,.3,1.4) both}
.tag.bad{color:#fff;background:linear-gradient(180deg,#e9575c,#c4242b 55%,#8e1419);box-shadow:0 0 0 2px #3a0a0e,0 6px 18px rgba(0,0,0,.5),0 0 24px rgba(196,36,43,.55)}
@keyframes tagin{from{transform:translateX(var(--tx,0px)) scale(.4) rotate(-14deg);opacity:0}}
.dealer{position:absolute;z-index:2;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,#e2d2ab);color:var(--ink);font-size:11px;font-weight:800;box-shadow:0 0 0 2px rgba(0,0,0,.35),0 3px 6px rgba(0,0,0,.5)}

/* ---------- actiebalk ---------- */
.dock{position:relative;z-index:5;margin:0 -16px;padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;background:linear-gradient(180deg,#141a33,#090c1b 70%);border-top:1px solid rgba(207,217,255,.18);box-shadow:0 -14px 40px rgba(0,0,0,.5);display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
html[data-phase="dag"] .dock,html[data-phase="jager"] .dock,html[data-view="klaar"] .dock,html[data-view="lobby"] .dock{background:linear-gradient(180deg,#2b2016,#110b07 70%);border-top-color:rgba(239,227,196,.18)}
.dock h2{font-size:36px;line-height:.9;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.sub{font-size:var(--s2);color:var(--ink-soft);line-height:1.45}
.sub b{color:#fff}
.fine{font-size:12px;color:rgba(239,227,196,.55);line-height:1.4}
.fine.warn{color:var(--gold)}
.waitline{font-size:var(--s2);color:var(--ink-soft)}
.waitline::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.ask-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sharebtn{display:inline-flex;align-items:center;gap:7px;flex:none;padding:8px 14px;border-radius:999px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--glass-line);font-size:var(--s1);font-weight:800;color:var(--parch)}
.sharebtn svg{width:14px;height:14px}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(239,227,196,.22);font-size:var(--s1);font-weight:800;letter-spacing:.03em;color:var(--parch);white-space:nowrap}
.pill svg{width:15px;height:15px;color:var(--rc,currentColor)}
.pill.role{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px var(--rc)}
.pill.role{background:color-mix(in srgb,var(--rc) 24%,transparent)}
.pop{animation:pop .35s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{transform:translateY(10px);opacity:.3}}
.res-h{display:grid;gap:4px}
.verdict{font-family:var(--display);font-weight:800;font-size:46px;line-height:.86;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.res-h.good .verdict{color:var(--good)}
.res-h.bad .verdict{color:#ff6a6e}
.res-h.moon .verdict{color:var(--moon)}
.res-h.gold .verdict{color:var(--gold)}
.action{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(239,227,196,.12);font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05;color:#fff}
.action svg{width:20px;height:20px;flex:none;color:var(--gold)}
.action small{display:block;margin-top:3px;font-family:var(--body);font-size:12px;font-weight:500;color:var(--ink-soft)}
/* de rolkaart: een kaart van perkament met de rol erop; dicht zie je de achterkant met de maan */
.rolecard{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;width:100%;padding:12px 14px;border-radius:14px;text-align:left;color:var(--ink);background:radial-gradient(120% 150% at 0% 0%,#fbf3dc 0%,#efe3c4 55%,#d9c393 100%);box-shadow:inset 0 0 0 2px #fbf3dc,inset 0 0 0 4px var(--rc),inset 0 0 30px rgba(120,80,30,.2),0 12px 28px rgba(0,0,0,.5);overflow:hidden}
.rolecard .ri{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--rc);color:#fff;box-shadow:0 0 0 3px #fbf3dc,0 0 0 4.5px var(--rc),0 6px 14px rgba(0,0,0,.3)}
.rolecard .ri svg{width:36px;height:36px}
.rolecard b{display:block;font-family:var(--display);font-weight:800;font-size:34px;line-height:.9;color:var(--ink)}
.rolecard small{display:block;margin-top:4px;font-size:13px;line-height:1.35;color:var(--ink-2)}
.rolecard.flip{animation:flipin .5s cubic-bezier(.2,.8,.2,1)}
@keyframes flipin{from{transform:perspective(600px) rotateY(80deg);opacity:.2}}
.rolecard.hide>*{visibility:hidden}
.rolecard.hide{background:radial-gradient(circle at 50% 42%,rgba(207,217,255,.35) 0 9%,transparent 10%),repeating-linear-gradient(45deg,rgba(207,217,255,.07) 0 2px,transparent 2px 9px),linear-gradient(135deg,#1d2650,#0c1129);box-shadow:inset 0 0 0 2px #2d3a73,inset 0 0 0 4px rgba(207,217,255,.35),0 12px 28px rgba(0,0,0,.5)}
.rolecard.hide::after{content:attr(data-hint);position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;color:var(--moon);text-shadow:0 2px 6px rgba(0,0,0,.8)}
.rolecard.small{padding:8px 12px;gap:10px}
.rolecard.small .ri{width:38px;height:38px}
.rolecard.small .ri svg{width:24px;height:24px}
.rolecard.small b{font-size:25px}
.lines{display:grid;gap:2px;font-size:13px;color:var(--ink-soft)}
.lines div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 2px;border-bottom:1px dashed rgba(239,227,196,.12)}
.lines div:last-child{border-bottom:0}
.lines b{color:#fff;font-weight:800}
.lines i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:6px}
.lines .rl{display:inline-flex;align-items:center;gap:4px;color:var(--rc);font-weight:800;filter:brightness(1.25)}
.lines .rl svg{width:14px;height:14px}
.lines .won{color:var(--good)}
.lines .dead{opacity:.6}
.choice{display:flex;align-items:center;gap:10px}
.choice .cta{flex:1}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(239,227,196,.18);font-weight:800;color:#fff;text-align:left}
.tgl small{display:block;font-weight:500;font-size:12px;color:var(--ink-soft)}
.tgl .sw{flex:none;width:42px;height:24px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.tgl .sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl.on{box-shadow:inset 0 0 0 1.5px var(--rc,var(--good));background:rgba(255,255,255,.1)}
.tgl.on{background:color-mix(in srgb,var(--rc,var(--good)) 16%,transparent)}
.tgl.on .sw{background:var(--rc,var(--good))}
.tgl.on .sw::after{transform:translateX(18px)}
.tgl:disabled{opacity:.5}

/* ---------- start ---------- */
.table.lobby.home{flex:none;height:min(340px,46svh);min-height:260px;margin-bottom:-4px}
.startcard{padding:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.startcard>p{font-size:var(--s3);line-height:1.5}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;font-weight:800;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:17px;height:17px;color:var(--rc)}
.fld{display:grid;gap:6px;font-size:var(--s1);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.inp{width:100%;min-width:0;height:50px;padding:0 18px;border:0;border-radius:999px;background:#fffaf0;color:var(--ink);font-size:17px;box-shadow:inset 0 0 0 1.5px rgba(43,29,18,.25)}
.inp::placeholder{color:#a08e76}
.inp:focus{outline:none;box-shadow:inset 0 0 0 2px #c4512a}
.inp.code{flex:1;text-transform:uppercase;letter-spacing:.3em;font-weight:800}
.addrow{display:flex;gap:8px}
.addbtn{flex:none;height:50px;padding:0 18px;border-radius:999px;background:var(--ink);color:var(--parch);font-weight:800}
.addbtn:disabled{opacity:.4}
.or{display:flex;align-items:center;gap:12px;font-size:var(--s1);color:var(--ink-2)}
.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(43,29,18,.2)}
.errline{padding:10px 14px;border-radius:14px;background:#f6d6c8;color:#8e1419;font-size:var(--s2);font-weight:800}
.note{font-size:var(--s1);color:var(--ink-soft);text-align:center}

/* ---------- vellen ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:grid;align-items:end;justify-items:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(5,7,15,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{width:min(520px,100%);max-height:calc(100dvh - 40px);overflow:auto;overscroll-behavior:contain;padding:22px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.sheet.anim{animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-title{font-weight:800;font-size:46px;line-height:.9;color:var(--ink)}
.xbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(43,29,18,.1);flex:none;font-size:18px;color:var(--ink)}
.xbtn:hover{background:rgba(43,29,18,.18)}
.sheet .kick{color:var(--ink-2)}
.sheet>p{font-size:var(--s3);line-height:1.5}
.mlist{display:grid}
.mlist>*{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:10px 0;border-bottom:1px dashed rgba(43,29,18,.25);font-family:var(--display);font-weight:800;font-size:31px;line-height:1.1;text-align:left;text-decoration:none;color:var(--ink)}
.mlist>button:hover,.mlist>a:hover{color:#8e1d1b}
.mlist span{font-family:var(--body);font-size:var(--s1);font-weight:700;color:var(--ink-2)}
.rules{display:grid;gap:10px;font-size:var(--s2);line-height:1.5}
.rules ol,.rules ul{margin:0;padding-left:20px;display:grid;gap:6px}
.rules .small{font-size:var(--s1);color:var(--ink-2)}
.rules .rr{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--rc);filter:brightness(.85)}
.rules .rr svg{width:16px;height:16px}
.sheet .tgl{background:#fffaf0;box-shadow:inset 0 0 0 1px rgba(43,29,18,.22);color:var(--ink)}
.sheet .tgl small{color:var(--ink-2)}
.sheet .tgl .sw{background:rgba(43,29,18,.18)}
.sheet .tgl.on{box-shadow:inset 0 0 0 2px var(--rc)}
.sheet .tgl.on .sw{background:var(--rc)}
.sheet .tgl .nm{display:flex;align-items:center;gap:9px}
.sheet .tgl .nm svg{width:28px;height:28px;padding:5px;border-radius:50%;background:var(--rc);color:#fff;flex:none}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:10px 0;border-radius:12px;background:#fffaf0;box-shadow:inset 0 0 0 1px rgba(43,29,18,.22);font-weight:800;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--blood);color:#fff;box-shadow:none}
.seg button:disabled{opacity:.4}
.story{display:grid;gap:8px;font-size:var(--s2)}
.story div{padding:8px 0;border-bottom:1px dashed rgba(43,29,18,.25)}
.story b{font-family:var(--display);font-size:22px;font-weight:800}
.scorecard{padding:0}
.scorecard table{width:100%;border-collapse:collapse;font-size:13px}
.scorecard th{padding:9px 4px 7px;text-align:right;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.scorecard td{padding:8px 4px;text-align:right;border-top:1px solid rgba(43,29,18,.14);font-variant-numeric:tabular-nums;font-weight:800}
.scorecard th:first-child,.scorecard td:first-child{text-align:left}
.scorecard td:first-child{font-family:var(--display);font-size:23px;font-weight:800}
.scorecard td:first-child i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pc);margin-right:7px;vertical-align:2px}

.toasts{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));z-index:60;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;width:max-content;max-width:calc(100vw - 24px);pointer-events:none}
.toasts div{padding:9px 15px;border-radius:999px;background:var(--parch);color:var(--ink);font-size:13px;font-weight:800;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toast 2.8s ease both}
.toasts div.net{background:#2b2016;color:var(--gold);box-shadow:inset 0 0 0 1px rgba(242,193,78,.5),0 10px 30px rgba(0,0,0,.45);animation:none}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0}}
.confetti{position:fixed;inset:0;z-index:40;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-24px;width:8px;height:14px;border-radius:2px;animation:fall var(--t) cubic-bezier(.2,.6,.4,1) var(--dl) forwards}
@keyframes fall{to{transform:translate(var(--x),112vh) rotate(var(--r))}}

@media (max-width:379px){.brand{font-size:26px}}
@media (max-width:339px){.brand span{display:none}}
@media (max-height:720px){
  .dock{padding-top:12px;gap:8px}
  .dock h2{font-size:30px}
  .verdict{font-size:40px}
  .fine{display:none}
  .rolecard{padding:9px 12px}
  .rolecard .ri{width:46px;height:46px}
  .rolecard .ri svg{width:28px;height:28px}
  .rolecard b{font-size:28px}
  .view.game{grid-template-rows:minmax(280px,1fr) auto}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="stars" aria-hidden="true"></div>

<div class="app">
  <header class="bar">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.2 2.2l4.6 4.7c1.3-.5 2.7-.7 4.2-.7s2.9.2 4.2.7l4.6-4.7.5 8.4c.9 1.4 1.4 3 1.4 4.7 0 1.4-.8 2.6-2 3.2l-3.5 1.8-1.9 2H8.7l-1.9-2-3.5-1.8c-1.2-.6-2-1.8-2-3.2 0-1.7.5-3.3 1.4-4.7z"/><path fill="#150b18" d="M7 12.2l3.6 1.3-.5 1.3zM17 12.2l-3.6 1.3.5 1.3zM10.4 18.3h3.2L12 20z"/></svg><span>Wolvennacht</span></div>
    <div class="bar-r">
      <button class="owe glass" id="owe" type="button" data-act="mine" hidden></button>
      <button class="round glass" type="button" data-act="menu" aria-label="Menu" aria-haspopup="dialog">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>
  <main class="screen" id="screen"></main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet cream" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script type="module">
import * as W from '/shared/weerwolven.js';
import * as B from '/shared/bussen.js';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
// vaste kleur per stoel aan tafel
const PC = ['#4f8dff', '#d690c9', '#ff7a00', '#2fbf71', '#f7c548', '#ff4a24', '#a28fe3', '#36c5d6', '#e86aa0', '#9ccf3c', '#c9803a', '#7f97ff'];
const ARR = '<span class="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';
const GLASS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l-1.6 16.2a2 2 0 0 1-2 1.8H9.6a2 2 0 0 1-2-1.8z"/><path d="M6.6 9h10.8"/></svg>';
const SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const svg = (inner) => `<svg viewBox="0 0 24 24" aria-hidden="true">${inner}</svg>`;
const DIM = 'rgba(0,0,0,.42)';
// de rollen: naam, kleur, plaatje en uitleg
const ICON = {
  wolf: svg(`<path fill="currentColor" d="M3.2 2.2l4.6 4.7c1.3-.5 2.7-.7 4.2-.7s2.9.2 4.2.7l4.6-4.7.5 8.4c.9 1.4 1.4 3 1.4 4.7 0 1.4-.8 2.6-2 3.2l-3.5 1.8-1.9 2H8.7l-1.9-2-3.5-1.8c-1.2-.6-2-1.8-2-3.2 0-1.7.5-3.3 1.4-4.7z"/><path fill="${DIM}" d="M7 12.2l3.6 1.3-.5 1.3zM17 12.2l-3.6 1.3.5 1.3zM10.4 18.3h3.2L12 20z"/>`),
  ziener: svg(`<path fill="currentColor" d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="4.4" fill="${DIM}"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/>`),
  heks: svg(`<path fill="currentColor" d="M8.5 2h7v2.2h-1.2v4l5.5 9.3A3 3 0 0 1 17.2 22H6.8a3 3 0 0 1-2.6-4.5l5.5-9.3v-4H8.5z"/><path fill="${DIM}" d="M6.6 14.6h10.8l1.6 2.8a1.6 1.6 0 0 1-1.4 2.4H5.4a1.6 1.6 0 0 1-1.4-2.4z"/><circle cx="10.5" cy="11.6" r="1" fill="${DIM}"/><circle cx="13.4" cy="9.6" r=".8" fill="${DIM}"/>`),
  jager: svg(`<circle cx="12" cy="12" r="7.4" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>`),
  cupido: svg(`<path fill="currentColor" d="M12 21.2s-7.6-4.6-9.4-9.4C1.3 8.4 3.5 4.6 7.2 4.6c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.7 0 5.9 3.8 4.6 7.2-1.8 4.8-9.4 9.4-9.4 9.4z"/><path d="M3 21l17.5-17.5M15.6 3.2h5.2v5.2" fill="none" stroke="${DIM}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`),
  burger: svg(`<path fill="currentColor" d="M12 2.4l10.2 8.9h-2.8V21.6H4.6V11.3H1.8z"/><path fill="${DIM}" d="M10 21.6v-6h4v6z"/>`),

  const v = store.get(KEY.me, {}) || {};
  let token = typeof v.token === 'string' && /^[A-Za-z0-9_-]{16,64}$/.test(v.token) ? v.token : null;
  if (!token) {
    const abc = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_', a = new Uint8Array(24);
    crypto.getRandomValues(a);
    token = [...a].map((x) => abc[x & 63]).join('');
  }
  const name = typeof v.name === 'string' && v.name ? v.name : ['bussen-ik', 'boer-ik', 'mexen-ik', 'dealer-ik', 'paard-ik', 'rotonde-ik', 'mijn-ik', 'wolf-ik', 'bord-ik'].filter((k) => k !== KEY.me).map((k) => (store.get(k, {}) || {}).name).find((n) => typeof n === 'string' && n);
  const o = { token, name: typeof name === 'string' ? name.slice(0, W.NAME_MAX) : '' };
  store.set(KEY.me, o);
  return o;
})();

const Snd = {
  ctx: null, out: null, muted: !!store.get(KEY.mute, false),
  ac() {
    if (this.muted) return null;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.out = this.ctx.createDynamicsCompressor();
      this.out.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(f, d, { type = 'sine', vol = .15, at = 0, slide = 0, lp = 0 } = {}) {
    const c = this.ac(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    let node = o;
    if (lp) { const f2 = c.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = lp; o.connect(f2); node = f2; }
    node.connect(g); g.connect(this.out); o.start(t); o.stop(t + d + .05);
  },
  noise(d, { vol = .2, at = 0, freq = 2600 } = {}) {
    const c = this.ac(); if (!c) return;
    const t = c.currentTime + at, len = Math.ceil(c.sampleRate * d), buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = .9; g.gain.value = vol;
    src.connect(bp); bp.connect(g); g.connect(this.out); src.start(t);
  },
  chip() { this.tone(2400, .04, { type: 'triangle', vol: .08 }); this.tone(1800, .05, { type: 'triangle', vol: .06, at: .03 }); },

  bad() { this.tone(233, .34, { type: 'sawtooth', vol: .08, slide: .6, lp: 1400 }); this.tone(175, .38, { type: 'square', vol: .05, slide: .6, at: .03, lp: 1000 }); },
  win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, .24, { type: 'triangle', vol: .11, at: i * .1 })); },
};

  try {
    if (on && !wake && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wake = await navigator.wakeLock.request('screen');
      wake.addEventListener('release', () => { wake = null; });

  // msg wordt (opnieuw) gestuurd bij elke verbinding: zo kom je na wegvallen vanzelf terug aan tafel
  go(msg) { this.want = msg; if (!this.send(msg)) this.open(); },
  open() {
    if (this.ws && this.ws.readyState <= 1) return;
    clearTimeout(this.timer);
    this.setStatus('connecting');
    let ws;
    try { ws = new WebSocket(this.url); } catch (e) { this.later(); return; }
    this.ws = ws;
    ws.onopen = () => { this.retry = 0; this.setStatus('open'); if (this.want) this.send(this.want); };
    ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } onMessage(m); };
    ws.onclose = () => { if (this.ws !== ws) return; this.ws = null; this.setStatus('closed'); if (this.want) this.later(); };

  later() { clearTimeout(this.timer); this.timer = setTimeout(() => this.open(), Math.min(5000, 400 * 2 ** this.retry++)); },
  send(o) { if (this.ws && this.ws.readyState === 1) { this.ws.send(JSON.stringify(o)); return true; } return false; },
  stop() { this.want = null; clearTimeout(this.timer); if (this.ws) { const ws = this.ws; this.ws = null; ws.close(); } this.setStatus('idle'); },

function onMessage(m) {
  if (m.t === 'state') return onState(m);
  if (m.t === 'joinFailed') {
    Net.stop(); store.del(KEY.table);
    S = null; ui.joining = false; ui.error = m.msg;
    return render();
  }
  if (m.t === 'left') return leaveLocal(m.reason);
  if (m.t === 'err') toast(m.msg);
}

function onState(m) {
  // is de server bijgewerkt terwijl deze pagina openstond? Dan opnieuw laden, anders draait hier oude code.
  // Na het laden kom je met je sleutel vanzelf weer op je eigen plek.
  if (m.build) {
    if (ui.build && ui.build !== m.build) { Net.stop(); location.reload(); return; }
    ui.build = m.build;
  }
  const first = !S || S.code !== m.code;
  S = m;
  ui.joining = false; ui.error = '';
  store.set(KEY.table, { code: m.code });
  Net.want = { t: 'join', code: m.code, name: me.name, token: me.token };
  if (location.pathname !== `/wolvennacht/${m.code}`) history.replaceState(null, '', `/wolvennacht/${m.code}`);
  const step = `${m.round}:${m.phase}:${m.day}`;
  if (step !== ui.step) { ui.step = step; ui.sel = -1; ui.pair = []; ui.save = false; if (m.phase !== 'rollen') ui.reveal = false; }
  const seq = m.seq || 0;
  if (first || m.phase === 'lobby' || seq < ui.seen) ui.seen = seq;   // geen oude gebeurtenissen opnieuw afspelen
  else for (const ev of m.log || []) if (ev.seq > ui.seen) present(ev);
  ui.seen = seq;
  // moet jij nu iets doen? Even trillen
  const todo = !!mode() && !ui.show;
  if (todo && !ui.wasTodo && !first) { buzz(60); Snd.turn(); }
  ui.wasTodo = todo;
  keepAwake(true);
  render();
}

function leaveLocal(reason) {
  Net.stop();
  store.del(KEY.table);
  S = null; ui.banner = null; ui.sheet = null; ui.show = null; ui.code = '';
  history.replaceState(null, '', '/wolvennacht');
  keepAwake(false);
  render();
  if (reason) toast(reason);
}

function banner(title, sub = '', ms = 2200) {
  ui.banner = { title, sub };
  clearTimeout(ui.bannerTimer);
  ui.bannerTimer = setTimeout(() => { ui.banner = null; render(); }, ms);
}

function show(ev) {
  clearTimeout(ui.showTimer);
  ui.show = ev;
  ui.showTimer = setTimeout(() => { ui.show = null; render(); }, SHOW_MS);
}

const iDied = (ev) => (ev.deaths || []).some((d) => d.p === S.you);
// een gebeurtenis van de server laten zien en horen
function present(ev) {
  switch (ev.type) {
    case 'rollen':
      banner('Nieuw potje', 'Bekijk je rol');
      ui.reveal = false;
      Snd.deal();
      break;
    case 'nacht':
      banner(`Nacht ${ev.night}`, 'Het dorp slaapt');
      Snd.howl();
      break;
    case 'ochtend':
      show(ev);
      banner('Ochtend', ev.deaths.length ? `${ev.deaths.length === 1 ? 'Er is iemand' : 'Er zijn spelers'} dood` : 'Iedereen leeft nog');
      Snd.bell();
      if (iDied(ev)) { buzz([120, 60, 120]); setTimeout(() => Snd.bad(), 600); }
      break;
    case 'stemming':
      show(ev);
      banner(ev.lynched >= 0 ? `${S.players[ev.lynched].name} hangt` : 'Niemand hangt', ev.lynched >= 0 ? 'Het dorp heeft gekozen' : ev.tie ? 'De stemmen staken' : 'Niemand kreeg een stem');
      if (ev.lynched >= 0) Snd.bad();
      if (iDied(ev) || (ev.wrong || []).includes(S.you)) buzz([90, 50, 90]);
      break;
    case 'jager':
      show(ev);
      if (ev.target >= 0) { banner('Pang!', `De jager schiet ${S.players[ev.target].name} neer`); Snd.shot(); }
      if (iDied(ev)) buzz([120, 60, 120]);
      break;
    case 'weg':
      toast(`${S.players[ev.p].name} verliet het dorp: ${ROLE[ev.deaths[0].role].a}`);
      break;
    case 'klaar': {
      const [t] = WIN[ev.winner];
      banner(t, ev.winners.includes(S.you) ? 'Jij hoort bij de winnaars' : 'Verliezers drinken', 2600);

  }
}

/* ================= BOUWSTENEN ================= */
const nameOf = (i) => esc(S.players[i].name);
const who = (i) => i === S.you ? 'Jij' : nameOf(i);
const initial = (name) => [...name.trim()][0]?.toUpperCase() || '?';

const roleName = (r) => ROLE[r].name;
const rc = (r) => `--rc:var(--r-${r})`;
const andList = (xs) => (xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} en ${xs[xs.length - 1]}`);
// wat jij weet: je eigen rol, de andere wolven, wat de ziener zag, je geliefde
const mine = () => (S && S.me) || null;
const inGame = () => !!(mine() && mine().role);
const ghost = () => inGame() && !mine().alive && S.phase !== 'klaar';
// rollen en wat je weet laten zien? 's Nachts, als geest, na afloop of als je even kijkt (niet overdag op tafel)
const showSecrets = () => S.phase === 'nacht' || S.phase === 'rollen' && ui.reveal || S.phase === 'klaar' || ghost() || ui.peek;
// de rol van speler i zoals jij die mag zien, of null
function roleSeen(i) {
  const p = S.players[i];
  if (p.role) return p.role;   // dood, of iedereen ziet alles
  const m = mine();
  if (!m || !showSecrets()) return null;
  if (i === S.you) return m.role;
  const k = (m.known || []).find((x) => x.p === i);
  return k ? k.role : null;
}
const isWolfMate = (i) => (mine()?.known || []).some((k) => k.p === i && k.role === 'wolf');
const deckText = (deck) => andList(ROLE_ORDER.filter((r) => deck[r]).map((r) => (r === 'wolf' || r === 'burger' ? `${deck[r]} ${deck[r] === 1 ? ROLE[r].name.toLowerCase() : ROLE[r].many}` : ROLE[r].name.toLowerCase())));
const deckLine = (deck) => `<div class="deckline">${ROLE_ORDER.filter((r) => deck[r]).map((r) => `<span style="${rc(r)}">${ICON[r]}${deck[r] > 1 ? `${deck[r]}×` : ''}${ROLE[r].name}</span>`).join('')}</div>`;
const rolePill = (r) => `<span class="pill role" style="${rc(r)}">${ICON[r]}${roleName(r)}</span>`;
function roleCard(r, { hide = false, small = false, flip = false, hint = 'Tik om je rol te zien', act = '' } = {}) {
  const tag = act ? 'button' : 'div';
  return `<${tag} class="rolecard${hide ? ' hide' : ''}${small ? ' small' : ''}${flip && !hide ? ' flip' : ''}" style="${rc(r)}" data-hint="${esc(hint)}"${act ? ` type="button" data-act="${act}"` : ''}>
    <span class="ri">${ICON[r]}</span><span><b>${roleName(r)}</b><small>${small ? ROLE[r].goal : `${ROLE[r].text} ${ROLE[r].goal}`}</small></span></${tag}>`;
}

// Wat jij nu moet doen, of null. Tijdens een uitslag even niks.
function mode() {
  const m = mine();
  if (!S || !m || ui.show) return null;
  if (S.phase === 'rollen') return m.alive && !m.ready ? 'ready' : null;
  if (S.phase === 'nacht') return m.alive && !m.done ? m.task : null;
  if (S.phase === 'dag') return m.alive ? 'vote' : null;
  if (S.phase === 'jager') return S.hunter === S.you || (isHost() && !S.players[S.hunter].connected) ? 'shoot' : null;
  return null;
}
// mag jij speler i nu aantikken?
function canTarget(i, md = mode()) {
  const p = S.players[i];
  if (!p || !p.alive || ui.sent === S.seq) return false;
  switch (md) {
    case 'wolf': return i !== S.you && !isWolfMate(i);
    case 'zien': case 'verdenk': case 'vote': return i !== S.you;
    case 'cupido': return true;
    case 'heks': return mine().potions.poison && mine().victim != null && i !== S.you && i !== mine().victim;
    case 'shoot': return true;
    default: return false;
  }
}

// Stoelen op gelijke afstand langs de rand van de tafel: jij onderaan, daarna met de klok mee.
const seatCache = new Map();
function seatPositions(n, aspect) {
  const key = `${n}:${aspect.toFixed(2)}`;
  if (seatCache.has(key)) return seatCache.get(key);
  // de kring in procenten van de tafel (rond .ground): zijkanten op 6% en 94%, boven- en onderkant als halve ellips
  const rx = 44, ry = 25.5, top = 30.5, bot = 64.5, pts = [];
  const cap = (cy, a0, a1) => { for (let k = 0; k <= 48; k++) { const a = a0 + (a1 - a0) * k / 48; pts.push([50 + rx * Math.cos(a), cy + ry * Math.sin(a)]); } };
  cap(bot, Math.PI / 2, Math.PI);
  cap(top, Math.PI, Math.PI * 2);
  cap(bot, 0, Math.PI / 2);
  // afstanden in echte verhoudingen, zodat de stoelen ook op een smalle tafel gelijk verdeeld zijn
  const len = [0];
  for (let i = 1; i < pts.length; i++) len.push(len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], (pts[i][1] - pts[i - 1][1]) / aspect));
  const total = len[len.length - 1], out = [];
  for (let s = 0; s < n; s++) {
    const want = total * s / n;
    let i = 1;
    while (i < len.length - 1 && len[i] < want) i++;
    const t = (want - len[i - 1]) / ((len[i] - len[i - 1]) || 1);
    out.push([pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]);
  }
  seatCache.set(key, out);
  return out;
}

// Zet de stoelen op hun plek. Valt een naambordje of label buiten het scherm, dan schuift het naar binnen.
function placeSeats() {
  const scr = $('#screen').getBoundingClientRect(), minX = scr.left + 4, maxX = scr.right - 4;
  const inward = (cx, half) => cx - half < minX ? minX - (cx - half) : cx + half > maxX ? maxX - (cx + half) : 0;
  for (const t of document.querySelectorAll('.table')) {
    const r = t.getBoundingClientRect();
    if (!r.width || !r.height) continue;
    const seats = t.querySelectorAll('.seat');
    const pos = seatPositions(seats.length, r.width / r.height);
    seats.forEach((el, i) => {
      const [x, y] = pos[i];
      const cx = r.left + x / 100 * r.width;
      const shift = inward(cx, el.querySelector('.plate').offsetWidth / 2);
      el.style.left = shift ? `calc(${x}% + ${shift}px)` : `${x}%`;
      el.style.top = `${y}%`;
      const tag = el.querySelector('.tag');
      if (tag) tag.style.setProperty('--tx', `${inward(cx + shift, tag.offsetWidth / 2 + 4)}px`);
    });
    const d = t.querySelector('.dealer');
    if (d && pos.length) {
      const [x, y] = pos[+d.dataset.seat] || pos[0];
      d.style.left = `${x + (50 - x) * .2 + (x < 50 ? 9 : -9)}%`; d.style.top = `${y + (50 - y) * .22}%`;
    }
  }
}

// De tafel: rand, vilt, iets in het midden en de spelers eromheen (order: wie op welke stoel, jij eerst).
// seat(i) -> { now, kick, tap, sel, can, dead, out, victim, role, mark: [soort, html], check, tag: [soort, tekst] }
function tableHTML({ order: seatsOrder, people, center = '', seat = () => ({}), dealer = -1, cls = '' }) {
  const seats = seatsOrder.map((i) => {
    const p = people[i], o = seat(i) || {};
    const btn = o.kick ? ` type="button" data-act="kickask" data-seat="${i}" aria-label="${esc(p.name)} van tafel halen"`
      : o.tap ? ` type="button" data-act="tap" data-seat="${i}" aria-label="${esc(p.name)} kiezen"` : '';
    const el = btn ? 'button' : 'div';
    const line = p.empty ? '' : o.dead && o.role ? `<span class="role" style="${rc(o.role)}">${roleName(o.role)}</span>`
      : p.connected === false ? '<span class="off">weg</span>'
        : o.out ? '<span class="off">kijkt mee</span>'
          : p.sips != null ? `<span class="${p.sips ? '' : 'zero'}" title="Slokken gedronken">${GLASS}${p.sips}</span>` : '';
    const isMe = S && i === S.you && !p.empty;
    const k = `seat${o.now ? ' now' : ''}${p.empty ? ' empty' : ''}${isMe ? ' me' : ''}${p.connected === false ? ' off' : ''}${o.dead ? ' dead' : ''}${o.out ? ' out' : ''}${o.can ? ' can' : ''}${o.sel ? ' sel' : ''}${o.victim ? ' victim' : ''}`;
    return `<${el} class="${k}" style="--pc:${PC[i % PC.length]}"${btn}>
      <span class="ava"><i>${p.empty ? '+' : esc(initial(p.name))}</i></span>
      ${o.role ? `<span class="badge" style="${rc(o.role)}" title="${roleName(o.role)}">${ICON[o.role]}</span>` : ''}
      ${o.mark ? `<span class="mark ${o.mark[0]}">${o.mark[1]}</span>` : ''}
      ${o.check ? `<span class="check">${CHECK}</span>` : ''}
      <span class="plate"><b>${p.empty ? 'Vrij' : esc(p.name)}</b>${line}</span>
      ${o.tag ? `<span class="tagwrap"><span class="tag ${o.tag[0]}">${o.tag[1]}</span></span>` : ''}
    </${el}>`;
  }).join('');
  const d = seatsOrder.indexOf(dealer);
  const ban = ui.banner ? `<div class="banner"><p class="ph-sub">${esc(ui.banner.sub)}</p><p class="banner-t">${esc(ui.banner.title)}</p></div>` : '';
  return `<div class="table ${cls}"><div class="forest back"></div><div class="ground"></div><div class="forest"></div><span class="orb" aria-hidden="true"></span>${d >= 0 ? `<span class="dealer" data-seat="${d}" title="Host" aria-hidden="true">H</span>` : ''}${center}${seats}${ban}</div>`;
}

const forceLink = (label) => (isHost() ? `<button class="linkbtn" type="button" data-act="forceask" data-label="${esc(label)}">${label}</button>` : '');

// de rollen die meedoen als de host nu start
