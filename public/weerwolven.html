<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weerwolven</title>
<meta name="description" content="Weerwolven van Wakkerdam online: iedereen krijgt geheim een rol op zijn telefoon en de server is de spelleider. 's Nachts kiezen de wolven een slachtoffer, overdag stemt het dorp.">
<meta name="theme-color" content="#150b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weerwolven">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/weerwolven.webmanifest">
<link rel="icon" href="/img/weerwolven.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/weerwolven-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;700&family=Sofia+Sans+Extra+Condensed:wght@500;700;800;900&display=swap">
<style>
:root{
  /* Dezelfde tafel als de andere spellen: bovenin een glazen balk, in het midden de tafel met de spelers rondom (jij
     altijd onderaan), onderin een donkere actiebalk. 's Nachts is het vilt donkerblauw, overdag groen. */
  --night:#150b18;
  --night-3:#0b060d;
  --cream:#f3efdb;
  --cream-2:#e4dec2;
  --cream-3:#d6cfae;
  --plum:#2b1531;
  --plum-2:#6a4570;
  --pink:#d690c9;
  --pink-2:#b866a8;
  --blood:#e5383b;
  --moon:#cfd9ff;
  --gold:#f7c548;
  --paper:#fffdf4;
  --paper-2:#efe7cc;
  --ink:#24132a;
  --good:#3ee07f;
  --bad:#ff5a64;
  --ink-soft:#c9b9cf;
  --glass:rgba(255,255,255,.08);
  --glass-line:rgba(255,255,255,.24);
  --glow:var(--blood);
  /* de kleur van elke rol */
  --r-wolf:#e5383b;
  --r-ziener:#8a6cff;
  --r-heks:#2fbf71;
  --r-jager:#f78a1d;
  --r-cupido:#ff6b9a;
  --r-burger:#c9a46a;
  --display:"Sofia Sans Extra Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --mono:"Martian Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --s1:11px; --s2:13px; --s3:15px;
  color-scheme:dark;
}
html[data-view="lobby"],html[data-view="home"]{--glow:var(--pink)}
html[data-phase="nacht"],html[data-phase="rollen"]{--glow:#3d5bd6}
html[data-phase="dag"]{--glow:var(--gold)}
html[data-view="klaar"]{--glow:var(--gold)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{background:var(--night)}
body{margin:0;background:radial-gradient(120% 90% at 50% 30%,#2a1534 0%,var(--night) 55%,var(--night-3) 100%) fixed;color:var(--cream);font-family:var(--mono);font-size:var(--s2);line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:800;letter-spacing:-.005em}
p{margin:0}
.glow{position:fixed;left:50%;top:-34vh;width:150vw;max-width:1100px;height:70vh;transform:translateX(-50%);background:radial-gradient(closest-side,var(--glow),transparent);opacity:.3;pointer-events:none;z-index:0;transition:background .6s}
.stars{position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.55) 1px,transparent 1.6px),radial-gradient(rgba(255,217,138,.5) 1px,transparent 1.6px);background-size:61px 67px,97px 89px;background-position:0 0,31px 43px;opacity:.16;pointer-events:none;z-index:0}

/* ---------- vaste UI ---------- */
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px 6px}
.bar-r{display:flex;gap:8px}
.glass{background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -6px 14px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.35)}
.round{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;color:var(--cream)}
.round:hover{background:rgba(255,255,255,.14)}
.owe{display:inline-flex;align-items:center;gap:5px;height:42px;padding:0 13px;border-radius:999px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.owe svg{width:16px;height:16px}
.owe.zero{color:var(--ink-soft)}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:900;font-size:24px;line-height:1;letter-spacing:.06em;color:var(--cream);white-space:nowrap}
.brand svg{width:24px;height:24px;color:var(--blood);flex:none}

.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.screen.is-game{padding-bottom:0}
.view{display:flex;flex-direction:column;gap:14px;min-height:100%}
.view.game{display:grid;grid-template-rows:minmax(300px,1fr) auto;height:100%;min-height:0;gap:0}

.kick{font-size:var(--s1);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.cream{background:var(--cream);color:var(--plum);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.chip{display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;background:var(--plum);color:var(--cream);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.3}
.chip.line{background:transparent;color:var(--plum);box-shadow:inset 0 0 0 1px rgba(43,21,49,.35)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;border-radius:999px;padding:9px 10px 9px 22px;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;color:var(--cream);text-decoration:none;text-align:left;background:linear-gradient(90deg,#2a1330 0%,#57295d 46%,#c47fba 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 30px rgba(43,21,49,.35);transition:filter .2s,transform .2s}
.cta:hover{filter:brightness(1.12)}
.cta:active{transform:translateY(1px)}
.cta .arr{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);flex:none}
.cta:disabled{background:var(--cream-2);color:var(--plum-2);box-shadow:inset 0 0 0 1.5px rgba(43,21,49,.2);filter:none;transform:none}
.cta:disabled .arr{background:rgba(43,21,49,.08)}
.dock .cta{background:linear-gradient(90deg,#3a1b42 0%,#6b3472 46%,#d690c9 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 30px rgba(0,0,0,.4)}
.dock .cta.hot{background:linear-gradient(90deg,#4a0f12 0%,#9b1f24 46%,#e5383b 100%)}
.dock .cta.moon{background:linear-gradient(90deg,#141b3d 0%,#2c3f86 46%,#7f97ff 100%)}
.dock .cta:disabled{background:rgba(255,255,255,.08);color:var(--ink-soft);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.ghostbtn{display:block;width:100%;border-radius:999px;padding:14px 20px;font-size:var(--s2);font-weight:700;color:var(--plum);box-shadow:inset 0 0 0 1px rgba(43,21,49,.3);text-decoration:none;text-align:center}
.ghostbtn:hover{background:var(--cream-2)}
.dock .ghostbtn{padding:11px 18px;color:var(--cream);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.dock .ghostbtn:hover{background:rgba(255,255,255,.08)}
.linkbtn{justify-self:start;padding:4px 0;font-size:var(--s1);font-weight:700;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}

/* ---------- de tafel ---------- */
.table{position:relative;min-height:0;container-type:size;margin:4px -6px 8px}
.rail{position:absolute;inset:5% 6% 10%;border-radius:50%/30%;background:linear-gradient(180deg,#45323a 0%,#1d1418 50%,#110b0e 100%);box-shadow:0 26px 60px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.16),inset 0 -4px 10px rgba(0,0,0,.5)}
.felt{position:absolute;inset:calc(5% + 11px) calc(6% + 11px) calc(10% + 11px);border-radius:50%/30%;overflow:hidden;background:radial-gradient(ellipse 75% 60% at 50% 42%,#35a862 0%,#21823f 46%,#125a2e 100%);box-shadow:inset 0 0 0 2px rgba(247,197,72,.3),inset 0 10px 40px rgba(0,0,0,.35),inset 0 -20px 50px rgba(0,0,0,.3);transition:background .8s}
.felt::before{content:"";position:absolute;inset:8% 10%;border-radius:50%/30%;border:1.5px solid rgba(255,255,255,.09)}
/* 's nachts: maanlicht op een donkerblauw vilt */
.table.night .felt{background:radial-gradient(ellipse 75% 60% at 50% 38%,#33498a 0%,#1b2a5c 48%,#0b1433 100%);box-shadow:inset 0 0 0 2px rgba(207,217,255,.22),inset 0 10px 40px rgba(0,0,0,.45),inset 0 -20px 50px rgba(0,0,0,.4)}
.center{position:absolute;left:50%;top:47.5%;z-index:2;transform:translate(-50%,-50%);width:60cqw;display:grid;justify-items:center;gap:1.4cqh;text-align:center;pointer-events:none}
.felt-logo{font-family:var(--display);font-weight:900;font-size:min(20cqw,110px);line-height:.8;letter-spacing:.02em;text-transform:uppercase;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25),0 0 30px rgba(255,255,255,.2)}
.felt-logo.small{font-size:min(12cqw,64px);line-height:.86}
.felt-logo.code{letter-spacing:.14em;margin-right:-.14em;color:var(--gold);text-shadow:0 4px 0 rgba(90,52,0,.5),0 0 30px rgba(247,197,72,.35)}
.felt-sub{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,239,219,.75)}
.ph-ico{width:min(17cqw,15cqh,84px);height:min(17cqw,15cqh,84px);display:block}
.ph-ico.moon{color:var(--moon);filter:drop-shadow(0 0 18px rgba(207,217,255,.55))}
.ph-ico.sun{color:var(--gold);filter:drop-shadow(0 0 18px rgba(247,197,72,.6))}
.ph-ico.shot{color:var(--r-jager);filter:drop-shadow(0 0 16px rgba(247,138,29,.6))}
.ph-ico.win{color:var(--gold)}
.deckline{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.deckline span{display:inline-flex;align-items:center;gap:3px;padding:2px 7px 2px 4px;border-radius:999px;background:rgba(0,0,0,.3);font-size:10px;font-weight:700;color:rgba(243,239,219,.9)}
.deckline svg{width:13px;height:13px;color:var(--rc)}
.banner{position:absolute;inset:0;z-index:6;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;pointer-events:none;background:radial-gradient(closest-side,rgba(11,6,13,.82),rgba(11,6,13,0));animation:banner 2.2s ease both}
.banner-t{font-family:var(--display);font-weight:900;font-size:min(14cqw,70px);line-height:.85;text-transform:uppercase;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(229,56,59,.55);max-width:84cqw}
@keyframes banner{0%{opacity:0;transform:scale(.85)}14%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
/* tijdens een melding verdwijnt het midden van de tafel even, anders staat de tekst dubbel */
.table:has(.banner) .center{opacity:0}

/* stoelen */
.seat{--ava:clamp(34px,12cqmin,52px);position:absolute;left:50%;top:50%;z-index:3;width:var(--ava);height:var(--ava);margin:calc(var(--ava) / -2) 0 0 calc(var(--ava) / -2);display:block;color:var(--cream);transition:opacity .3s,filter .3s}
.ava{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.55),rgba(255,255,255,0) 46%),var(--pc);box-shadow:0 0 0 3px #140d17,0 0 0 4.5px rgba(255,255,255,.22),0 10px 20px rgba(0,0,0,.55);font-family:var(--display);font-weight:900;font-size:calc(var(--ava) * .52);line-height:1;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.35);transition:transform .15s,box-shadow .2s}
.seat.empty .ava{background:rgba(0,0,0,.35);box-shadow:0 0 0 2px rgba(255,255,255,.18);color:rgba(255,255,255,.55);border:1.5px dashed rgba(255,255,255,.35)}
.seat.off .ava{filter:grayscale(1) brightness(.7)}
.seat.now .ava{box-shadow:0 0 0 3px #140d17,0 0 0 5px var(--gold),0 0 26px rgba(247,197,72,.6),0 10px 20px rgba(0,0,0,.55)}
.seat.now::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(var(--gold),rgba(247,197,72,0) 40%,rgba(247,197,72,0) 60%,var(--gold));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.plate{position:absolute;left:50%;top:calc(100% - 7px);z-index:1;transform:translateX(-50%);min-width:calc(var(--ava) * 1.4);max-width:calc(var(--ava) * 2.4);padding:3px 8px 4px;border-radius:9px;background:linear-gradient(180deg,#241b27,#0d090f);border:1px solid rgba(255,255,255,.16);box-shadow:0 6px 14px rgba(0,0,0,.55);display:grid;justify-items:center;line-height:1.2;white-space:nowrap}
.plate b{max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;font-weight:700;color:#fff}
.plate span{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.plate span.zero{color:rgba(243,239,219,.45)}
.plate span.off{color:var(--ink-soft);font-weight:500}
.plate span.role{color:var(--rc)}
.plate svg{width:11px;height:11px}
.seat.now .plate{border-color:var(--gold)}
.seat.me .plate{background:linear-gradient(180deg,#3a2240,#160c19);border-color:rgba(214,144,201,.6)}
button.seat{cursor:pointer}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
button.seat:active .ava{transform:scale(.94)}
/* dood: grijs, met een grafsteen */
.seat.dead .ava{background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.3),rgba(255,255,255,0) 46%),#3a3340;color:rgba(255,255,255,.35);box-shadow:0 0 0 3px #140d17,0 0 0 4.5px rgba(255,255,255,.1)}
.seat.dead .ava::after{content:"";position:absolute;inset:22%;background:currentColor;-webkit-mask:var(--tomb) center/contain no-repeat;mask:var(--tomb) center/contain no-repeat;color:rgba(255,255,255,.75)}
.seat.dead .ava i{opacity:0}
.seat.dead .plate{opacity:.85}
.seat.out{opacity:.45}
/* aan te tikken (kiezen, stemmen, schieten) en gekozen */
.seat.can .ava{box-shadow:0 0 0 3px #140d17,0 0 0 4.5px rgba(255,255,255,.55),0 10px 20px rgba(0,0,0,.55)}
.seat.can::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px dashed rgba(255,255,255,.45);animation:spin 9s linear infinite}
.seat.sel .ava{box-shadow:0 0 0 3px #140d17,0 0 0 6px var(--blood),0 0 26px rgba(229,56,59,.8),0 10px 20px rgba(0,0,0,.55);transform:scale(1.08)}
.seat.sel::before{border-color:var(--blood);border-style:solid;animation:none}
.seat.victim .ava{box-shadow:0 0 0 3px #140d17,0 0 0 6px var(--blood),0 0 30px rgba(229,56,59,.9),0 10px 20px rgba(0,0,0,.55)}
.seat.victim::after{content:"";position:absolute;inset:-12px;border-radius:50%;box-shadow:0 0 0 2px var(--blood);animation:pulse 1.2s ease-in-out infinite;pointer-events:none}
/* rechtsboven op het hoofd: de rol (als je die mag zien); linksboven: hoeveel wolven iemand kiezen; linksonder: klaar of gestemd */
.badge{position:absolute;right:-14%;top:-14%;z-index:2;width:50%;height:50%;border-radius:50%;display:grid;place-items:center;background:var(--rc);color:#fff;box-shadow:0 0 0 2px #140d17,0 3px 6px rgba(0,0,0,.5)}
.badge svg{width:66%;height:66%}
.mark{position:absolute;left:-18%;top:-16%;z-index:2;min-width:48%;height:44%;padding:0 4px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:1px;background:var(--blood);color:#fff;font-size:calc(var(--ava) * .24);font-weight:700;box-shadow:0 0 0 2px #140d17,0 3px 6px rgba(0,0,0,.5)}
.mark svg{width:calc(var(--ava) * .26);height:calc(var(--ava) * .26)}
.mark.love{background:var(--r-cupido)}
.check{position:absolute;left:-10%;bottom:-6%;z-index:2;width:38%;height:38%;border-radius:50%;display:grid;place-items:center;background:var(--good);color:#06301a;box-shadow:0 0 0 2px #140d17}
.check svg{width:70%;height:70%}
.tagwrap{position:absolute;left:50%;top:50%;z-index:4;width:0;height:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.tag{flex:none;transform:translateX(var(--tx,0px)) rotate(-5deg);padding:4px 9px 5px;border-radius:8px;font-family:var(--display);font-weight:900;font-size:calc(var(--ava) * .34 + 3px);line-height:1;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;color:#2a1600;background:linear-gradient(180deg,#ffe892,#f7c548 50%,#d99a17);box-shadow:0 0 0 2px #2a1600,0 6px 18px rgba(0,0,0,.5),0 0 24px rgba(247,197,72,.55);animation:tagin .45s cubic-bezier(.2,.9,.3,1.4) both}
.tag.bad{color:#fff;background:linear-gradient(180deg,#ff7b82,#d2343f 55%,#a11d27);box-shadow:0 0 0 2px #3a0a0e,0 6px 18px rgba(0,0,0,.5),0 0 24px rgba(210,52,63,.55)}
@keyframes tagin{from{transform:translateX(var(--tx,0px)) scale(.4) rotate(-14deg);opacity:0}}
.dealer{position:absolute;z-index:2;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,#e4dec2);color:var(--plum);font-size:10px;font-weight:700;box-shadow:0 0 0 2px rgba(0,0,0,.35),0 3px 6px rgba(0,0,0,.5)}

/* ---------- actiebalk ---------- */
.dock{position:relative;z-index:5;margin:0 -16px;padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;background:linear-gradient(180deg,#26152c,#120a15 70%);border-top:1px solid rgba(255,255,255,.14);box-shadow:0 -14px 40px rgba(0,0,0,.45);display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
html[data-phase="nacht"] .dock,html[data-phase="rollen"] .dock{background:linear-gradient(180deg,#161c3a,#0a0d1f 70%);border-top-color:rgba(207,217,255,.18)}
.dock h2{font-size:32px;line-height:.92;color:#fff}
.sub{font-size:var(--s2);color:var(--ink-soft);line-height:1.5}
.sub b{color:#fff}
.fine{font-size:10.5px;color:rgba(243,239,219,.55);line-height:1.45}
.fine.warn{color:var(--gold)}
.waitline{font-size:var(--s2);color:var(--ink-soft)}
.waitline::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.ask-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sharebtn{display:inline-flex;align-items:center;gap:7px;flex:none;padding:8px 14px;border-radius:999px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--glass-line);font-size:var(--s1);font-weight:700;color:var(--cream)}
.sharebtn svg{width:14px;height:14px}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);font-size:var(--s1);font-weight:700;letter-spacing:.04em;color:var(--cream);white-space:nowrap}
.pill svg{width:15px;height:15px;color:var(--rc,currentColor)}
.pill.role{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px var(--rc)}
.pill.role{background:color-mix(in srgb,var(--rc) 22%,transparent);box-shadow:inset 0 0 0 1px var(--rc)}
.pop{animation:pop .35s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{transform:translateY(10px);opacity:.3}}
.res-h{display:grid;gap:4px}
.verdict{font-family:var(--display);font-weight:900;font-size:44px;line-height:.86;text-transform:uppercase}
.res-h.good .verdict{color:var(--good)}
.res-h.bad .verdict{color:var(--bad)}

.tgl .sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl.on{box-shadow:inset 0 0 0 1.5px var(--rc,var(--good));background:rgba(255,255,255,.1)}

.tgl.on .sw::after{transform:translateX(18px)}

.toasts{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));z-index:60;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;width:max-content;max-width:calc(100vw - 24px);pointer-events:none}

@keyframes toast{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0}}
.confetti{position:fixed;inset:0;z-index:40;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-24px;width:8px;height:14px;border-radius:2px;animation:fall var(--t) cubic-bezier(.2,.6,.4,1) var(--dl) forwards}
@keyframes fall{to{transform:translate(var(--x),112vh) rotate(var(--r))}}

@media (max-width:379px){.brand{font-size:20px}}

}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

const Snd = {
  ctx: null, out: null, muted: !!store.get(KEY.mute, false),

  tone(f, d, { type = 'sine', vol = .15, at = 0, slide = 0, lp = 0 } = {}) {

  go(msg) { this.want = msg; if (!this.send(msg)) this.open(); },
  open() {
    if (this.ws && this.ws.readyState <= 1) return;

    let ws;
    try { ws = new WebSocket(this.url); } catch (e) { this.later(); return; }
    this.ws = ws;

    ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } onMessage(m); };

function onMessage(m) {
  if (m.t === 'state') return onState(m);
  if (m.t === 'joinFailed') {
    Net.stop(); store.del(KEY.table);
    S = null; ui.joining = false; ui.error = m.msg;
    return render();
  }
  if (m.t === 'left') return leaveLocal(m.reason);
  if (m.t === 'err') toast(m.msg);
}

function onState(m) {
  // is de server bijgewerkt terwijl deze pagina openstond? Dan opnieuw laden, anders draait hier oude code.
  // Na het laden kom je met je sleutel vanzelf weer op je eigen plek.
  if (m.build) {
    if (ui.build && ui.build !== m.build) { Net.stop(); location.reload(); return; }
    ui.build = m.build;
  }
  const first = !S || S.code !== m.code;
  S = m;
  ui.joining = false; ui.error = '';
  store.set(KEY.table, { code: m.code });
  Net.want = { t: 'join', code: m.code, name: me.name, token: me.token };
  if (location.pathname !== `/weerwolven/${m.code}`) history.replaceState(null, '', `/weerwolven/${m.code}`);
  const step = `${m.round}:${m.phase}:${m.day}`;
  if (step !== ui.step) { ui.step = step; ui.sel = -1; ui.pair = []; ui.save = false; if (m.phase !== 'rollen') ui.reveal = false; }
  const seq = m.seq || 0;
  if (first || m.phase === 'lobby' || seq < ui.seen) ui.seen = seq;   // geen oude gebeurtenissen opnieuw afspelen
  else for (const ev of m.log || []) if (ev.seq > ui.seen) present(ev);
  ui.seen = seq;
  // moet jij nu iets doen? Even trillen
  const todo = !!mode() && !ui.show;
  if (todo && !ui.wasTodo && !first) { buzz(60); Snd.turn(); }
  ui.wasTodo = todo;
  keepAwake(true);
  render();
}

function leaveLocal(reason) {
  Net.stop();
  store.del(KEY.table);
  S = null; ui.banner = null; ui.sheet = null; ui.show = null; ui.code = '';
  history.replaceState(null, '', '/weerwolven');

// Stoelen op gelijke afstand langs de rand van de tafel: jij onderaan, daarna met de klok mee.
const seatCache = new Map();
function seatPositions(n, aspect) {
  const key = `${n}:${aspect.toFixed(2)}`;
  if (seatCache.has(key)) return seatCache.get(key);
  // de rand in procenten van de tafel (zie .rail): zijkanten op 6% en 94%, boven- en onderkant als halve ellips
  const rx = 44, ry = 25.5, top = 30.5, bot = 64.5, pts = [];
  const cap = (cy, a0, a1) => { for (let k = 0; k <= 48; k++) { const a = a0 + (a1 - a0) * k / 48; pts.push([50 + rx * Math.cos(a), cy + ry * Math.sin(a)]); } };
  cap(bot, Math.PI / 2, Math.PI);
  cap(top, Math.PI, Math.PI * 2);
  cap(bot, 0, Math.PI / 2);
  // afstanden in echte verhoudingen, zodat de stoelen ook op een smalle tafel gelijk verdeeld zijn
  const len = [0];
  for (let i = 1; i < pts.length; i++) len.push(len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], (pts[i][1] - pts[i - 1][1]) / aspect));
  const total = len[len.length - 1], out = [];
  for (let s = 0; s < n; s++) {
    const want = total * s / n;
    let i = 1;
    while (i < len.length - 1 && len[i] < want) i++;
    const t = (want - len[i - 1]) / ((len[i] - len[i - 1]) || 1);
    out.push([pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]);
  }
  seatCache.set(key, out);
  return out;
}

// Zet de stoelen op hun plek. Valt een naambordje of label buiten het scherm, dan schuift het naar binnen.
function placeSeats() {
  const scr = $('#screen').getBoundingClientRect(), minX = scr.left + 4, maxX = scr.right - 4;
  const inward = (cx, half) => cx - half < minX ? minX - (cx - half) : cx + half > maxX ? maxX - (cx + half) : 0;
  for (const t of document.querySelectorAll('.table')) {
    const r = t.getBoundingClientRect();
    if (!r.width || !r.height) continue;
    const seats = t.querySelectorAll('.seat');
    const pos = seatPositions(seats.length, r.width / r.height);
    seats.forEach((el, i) => {
      const [x, y] = pos[i];
      const cx = r.left + x / 100 * r.width;
      const shift = inward(cx, el.querySelector('.plate').offsetWidth / 2);
      el.style.left = shift ? `calc(${x}% + ${shift}px)` : `${x}%`;
      el.style.top = `${y}%`;
      const tag = el.querySelector('.tag');
      if (tag) tag.style.setProperty('--tx', `${inward(cx + shift, tag.offsetWidth / 2 + 4)}px`);
    });
    const d = t.querySelector('.dealer');
    if (d && pos.length) {
      const [x, y] = pos[+d.dataset.seat] || pos[0];
      d.style.left = `${x + (50 - x) * .2 + (x < 50 ? 9 : -9)}%`; d.style.top = `${y + (50 - y) * .22}%`;
    }
  }
}

  const empty = Array.from({ length: 5 }, () => ({ name: 'Vrije plek', empty: true }));
  const center = `<div class="center"><span class="ph-ico moon">${MOON}</span><div class="felt-logo small">Wakkerdam</div><p class="felt-sub">De nacht valt</p></div>`;
  const table = tableHTML({ order: [0, 1, 2, 3, 4], people: empty, cls: 'lobby home night', center });
  const busy = ui.joining ? 'disabled' : '';
  return `
  ${table}
  <div class="startcard cream">
    <div class="chips"><span class="chip">${W.MIN_PLAYERS} tot ${W.MAX_PLAYERS} spelers</span><span class="chip line">Ieder op eigen telefoon</span><span class="chip line">Geen spelleider nodig</span></div>
    <p>Iedereen krijgt geheim een rol op zijn telefoon. 's Nachts kiezen de weerwolven een slachtoffer, overdag stemt het dorp wie er wordt opgehangen. Wie doodgaat drinkt, en de verliezers ook.</p>
    ${legend()}
    <label class="fld">Jouw naam<input class="inp" id="nameIn" maxlength="${W.NAME_MAX}" placeholder="Bijvoorbeeld Jort" autocomplete="nickname" enterkeyhint="next" value="${esc(ui.name)}"></label>
    <form class="addrow" id="joinForm" autocomplete="off">
      <input class="inp code" id="codeIn" maxlength="4" placeholder="CODE" aria-label="Code van de tafel" autocapitalize="characters" spellcheck="false" enterkeyhint="go" value="${esc(ui.code)}">
      <button class="addbtn" type="submit" ${busy}>Meedoen</button>
    </form>
    <div class="or">of</div>
    <button class="cta" type="button" data-act="create" ${busy}><span>${ui.joining ? 'Verbinden…' : 'Nieuwe tafel'}</span>${ARR}</button>
    ${ui.error ? `<p class="errline">${esc(ui.error)}</p>` : ''}
    <button class="ghostbtn" type="button" data-act="rules">Spelregels</button>
  </div>
  <p class="note">Drink met mate. Water of karnemelk telt ook.</p>`;
}

// de rollen die meedoen als de host nu start
const plannedDeck = () => W.deckOf(W.roleList(Math.max(W.MIN_PLAYERS, liveCount()), S.settings));

function vLobby() {
  const n = S.players.length, host = isHost(), short = W.MIN_PLAYERS - liveCount();
  const table = tableHTML({
    order: order(), people: S.players, cls: 'lobby', dealer: S.host,
    center: `<div class="center"><p class="felt-sub">Code van de tafel</p><div class="felt-logo code">${S.code}</div><p class="felt-sub">${n} van ${W.MAX_PLAYERS} plekken</p></div>`,
    seat: (i) => ({ kick: host && i !== S.you, now: i === S.host }),
  });
  const dock = `<div class="ask-h"><h2>${host ? 'Jij bent de host' : 'Je zit aan tafel'}</h2><button class="sharebtn" type="button" data-act="share">${SHARE}Uitnodigen</button></div>
    <p class="sub">Vrienden doen mee met code <b>${S.code}</b> of met de link. ${short > 0 ? '' : `Met ${liveCount()} spelers: <b>${deckText(plannedDeck())}</b>.`}</p>
    ${host
      ? `<button class="cta hot" type="button" data-act="start" ${short > 0 ? 'disabled' : ''}><span>${short > 0 ? `Wacht op ${short} ${short === 1 ? 'speler' : 'spelers'}` : 'Deel de rollen uit'}</span>${ARR}</button>
        <button class="ghostbtn" type="button" data-act="roles">Rollen kiezen</button>
        ${n > 1 ? '<p class="fine">Tik op een speler om die van tafel te halen.</p>' : ''}`
      : `<p class="waitline">Wachten tot ${nameOf(S.host)} de rollen uitdeelt</p>`}
    <button class="linkbtn" type="button" data-act="leaveask">Verlaat tafel</button>`;
  return `${table}<div class="dock">${dock}</div>`;
}

// het midden van de tafel: maan, zon, jager of de winnaar
function centerHTML() {
  const alive = aliveSeats().length;
  switch (S.phase) {
    case 'rollen': return `<div class="center"><span class="ph-ico moon">${MOON}</span><div class="felt-logo small">De nacht valt</div>${deckLine(S.deck)}</div>`;
    case 'nacht': return `<div class="center"><span class="ph-ico moon">${MOON}</span><div class="felt-logo small">Nacht ${S.day}</div><p class="felt-sub">Het dorp slaapt</p></div>`;
    case 'dag': {
      const voted = S.players.filter((p) => p.voted).length;
      return `<div class="center"><span class="ph-ico sun">${SUN}</span><div class="felt-logo small">Dag ${S.day}</div><p class="felt-sub">${voted} van ${alive} gestemd</p></div>`;
    }
    case 'jager': return `<div class="center"><span class="ph-ico shot">${ICON.jager}</span><div class="felt-logo small">De jager</div><p class="felt-sub">schiet nog iemand neer</p></div>`;
    case 'klaar': return `<div class="center"><span class="ph-ico win">${CROWN}</span><div class="felt-logo small">${WIN[S.winner][0]}</div></div>`;
    default: return '';
  }
}

// wat er op elke stoel te zien is
function seatInfo(i) {
  const p = S.players[i], m = mine(), md = mode(), o = {};
  if (!p.inGame) { o.out = true; return o; }
  o.dead = !p.alive;
  o.role = roleSeen(i);
  if (S.phase === 'jager') o.now = i === S.hunter;
  if (S.phase === 'rollen' && p.ready) o.check = true;
  if (S.phase === 'dag' && p.voted) o.check = true;
  // kiezen: aan te tikken, en wat je aantikte
  if (md && md !== 'ready' && canTarget(i, md)) { o.tap = true; o.can = true; }
  if (md === 'cupido' ? ui.pair.includes(i) : ui.sel === i && md) o.sel = true;
  if (m && S.phase === 'dag' && m.vote === i && !o.sel && ui.sel < 0) o.sel = true;
  // 's nachts: wie de wolven kiezen (voor de wolven en de geesten), wie de heks kan redden
  if (S.phase === 'nacht' && m) {
    const pack = m.pack || [];
    const n = pack.filter((x) => x.pick === i).length;
    if (n && showSecrets()) o.mark = ['', `${ICON.wolf}${n > 1 ? n : ''}`];
    const victim = m.task === 'heks' ? m.victim : m.night ? m.night.victim : null;
    if (victim === i) o.victim = true;
  }
  // je geliefde
  if (m && m.lover && showSecrets() && (i === m.lover.p || i === S.you)) o.mark = ['love', HEART];
  if (m && m.lovers && showSecrets() && m.lovers.includes(i) && !o.mark) o.mark = ['love', HEART];
  if (ghost() && S.lovers && S.lovers.includes(i) && !o.mark) o.mark = ['love', HEART];
  // de laatste uitslag: wie er dood ging
  const ev = ui.show;
  if (ev && (ev.deaths || []).some((d) => d.p === i)) o.tag = ['bad', `Drinkt ${W.DEAD_SIPS}`];
  else if (ev && ev.type === 'stemming' && (ev.wrong || []).includes(i)) o.tag = ['bad', `Drinkt ${W.WRONG_VOTE_SIPS}`];
  return o;
}

function vSpel() {
  const night = S.phase === 'nacht' || S.phase === 'rollen';
  const table = tableHTML({ order: order(), people: S.players, center: centerHTML(), seat: seatInfo, cls: night ? 'night' : '' });
  let dock;
  if (S.phase === 'klaar') dock = doneDock();
  else if (ui.show) dock = resultDock(ui.show);
  else if (!inGame()) dock = watchDock();
  else if (S.phase === 'rollen') dock = rolesDock();
  else if (S.phase === 'nacht') dock = mine().alive ? nightDock() : ghostDock();
  else if (S.phase === 'dag') dock = mine().alive ? dayDock() : ghostDock();
  else dock = hunterDock();
  return `${table}<div class="dock${ui.dockPop ? ' pop' : ''}">${dock}</div>`;
}

// een knop om te bevestigen wat je aantikte (of grijs als je nog niks koos)
function confirmBtn(act, sel, label, empty = 'Tik op een speler aan tafel', cls = 'hot') {
  const busy = ui.sent === S.seq;
  if (sel < 0) return `<button class="cta ${cls}" type="button" disabled><span>${empty}</span>${ARR}</button>`;
  return `<button class="cta ${cls}" type="button" data-act="${act}" ${busy ? 'disabled' : ''}><span>${label(nameOf(sel))}</span>${ARR}</button>`;
}

function watchDock() {
  return `<div class="ask-h"><h2>Je kijkt mee</h2></div>
    <p class="sub">Dit potje was al begonnen toen je aanschoof. Bij het volgende potje krijg jij ook een rol.</p>
    <p class="waitline">Het dorp speelt</p>`;
}

function rolesDock() {
  const m = mine(), mates = (m.known || []).filter((k) => k.role === 'wolf').map((k) => nameOf(k.p));
  const card = roleCard(m.role, { hide: !ui.reveal, act: 'reveal' });
  const pack = m.role === 'wolf' && ui.reveal ? `<p class="sub">${mates.length ? `De andere ${mates.length === 1 ? 'wolf is' : 'wolven zijn'} <b>${andList(mates)}</b>.` : 'Jij bent de enige wolf.'}</p>` : '';
  if (!m.ready) {
    return `<div class="ask-h"><h2>Jouw rol</h2></div>${card}${pack}
      <button class="cta moon" type="button" data-act="ready" ${ui.reveal ? '' : 'disabled'}><span>${ui.reveal ? 'Gezien, de nacht mag vallen' : 'Bekijk eerst je rol'}</span>${ARR}</button>
      <p class="fine">Hou je scherm voor jezelf. Tik op de kaart om je rol te zien of weer te verbergen.</p>`;
  }
  const left = S.players.filter((p) => p.alive && !p.ready).length;
  return `<div class="ask-h"><h2>Even wachten</h2></div>${card}${pack}
    <p class="waitline">Nog ${left} ${left === 1 ? 'speler bekijkt' : 'spelers bekijken'} hun rol</p>${forceLink('Niet langer wachten')}`;
}

// 's nachts: wat jij weet (de ziener: wat hij zag)
function knownLines() {
  const k = (mine().known || []).filter((x) => x.night);
  if (!k.length) return '';
  return `<div class="lines">${k.map((x) => `<div><span><i style="--pc:${PC[x.p % PC.length]}"></i>${nameOf(x.p)}</span><span class="rl" style="${rc(x.role)}">${ICON[x.role]}${roleName(x.role)}</span></div>`).join('')}</div>`;
}

function nightDock() {
  const m = mine(), head = `<div class="ask-h"><h2>Nacht ${S.day}</h2>${rolePill(m.role)}</div>`;
  const wait = `<p class="waitline">Het dorp slaapt nog</p>${forceLink('Niet langer wachten')}`;
  const hint = '<p class="fine">Iedereen tikt \'s nachts iets aan, zodat niemand ziet wie er een rol heeft.</p>';
  switch (m.task) {
    case 'wolf': {
      const others = (m.pack || []).filter((x) => x.p !== S.you);
      const lines = others.length ? `<div class="lines">${others.map((x) => `<div><span><i style="--pc:${PC[x.p % PC.length]}"></i>${nameOf(x.p)}</span><b>${x.pick >= 0 ? `kiest ${nameOf(x.pick)}` : 'kiest nog'}</b></div>`).join('')}</div>` : '';
      if (m.done) return `${head}<p class="sub">Jullie zijn het eens: <b>${nameOf(m.pick)}</b> wordt opgegeten.</p>${wait}`;
      const sel = ui.sel >= 0 ? ui.sel : m.pick;
      const waiting = m.pick >= 0 && sel === m.pick;
      return `${head}<p class="sub">${others.length ? 'Kies samen met de andere wolven wie er vannacht wordt opgegeten. Jullie moeten allemaal dezelfde kiezen.' : 'Kies wie er vannacht wordt opgegeten.'}</p>${lines}
        ${waiting ? `<p class="sub">Jij kiest <b>${nameOf(m.pick)}</b>. Wachten tot de andere wolven hetzelfde kiezen.</p>${forceLink('Niet langer wachten')}` : confirmBtn('wolf', sel, (n) => `Eet ${n} op`)}`;
    }
    case 'zien': {
      if (m.done) {
        const k = (m.known || []).find((x) => x.night === S.day);
        return `${head}${k ? `<p class="sub"><b>${nameOf(k.p)}</b> is ${ROLE[k.role].a}.</p>${roleCard(k.role, { small: true })}` : ''}${wait}`;
      }
      return `${head}<p class="sub">Wiens rol wil je zien? Tik op een speler aan tafel.</p>${knownLines()}${confirmBtn('look', ui.sel, (n) => `Bekijk ${n}`)}`;
    }
    case 'cupido': {
      if (m.done) return `${head}<p class="sub">${m.lovers ? `<b>${nameOf(m.lovers[0])}</b> en <b>${nameOf(m.lovers[1])}</b> zijn nu verliefd.` : 'Klaar.'} Morgen horen ze het.</p>${wait}`;
      const [a, b] = ui.pair;
      const ready = ui.pair.length === 2;
      return `${head}<p class="sub">Kies twee spelers die verliefd worden (jij mag er een van zijn). Sterft de een, dan sterft de ander van verdriet.</p>
        ${ready ? `<button class="cta hot" type="button" data-act="cupid" ${ui.sent === S.seq ? 'disabled' : ''}><span>Maak ${nameOf(a)} en ${nameOf(b)} verliefd</span>${ARR}</button>`
          : `<button class="cta hot" type="button" disabled><span>${ui.pair.length ? `${nameOf(a)} en…?` : 'Tik op twee spelers'}</span>${ARR}</button>`}`;
    }
    case 'heks': {
      if (m.done) return `${head}<p class="sub">Je drankjes staan weer in de kast.</p>${wait}`;
      if (m.victim == null) return `${head}<p class="sub">De wolven kiezen nog wie ze opeten. Daarna mag jij.</p><p class="waitline">Even wachten</p>${potionsLine()}${forceLink('Niet langer wachten')}`;
      const save = m.potions.heal && m.victim >= 0
        ? `<button class="tgl${ui.save ? ' on' : ''}" type="button" data-act="save" style="${rc('heks')}"><span>Redden met je drankje<small>${nameOf(m.victim)} gaat dan niet dood</small></span><span class="sw"></span></button>` : '';
      const poison = m.potions.poison
        ? `<p class="sub">${ui.sel >= 0 ? `Je vergiftigt <b>${nameOf(ui.sel)}</b>. <button class="linkbtn" type="button" data-act="unsel">Toch niet</button>` : 'Wil je iemand vergiftigen? Tik op die speler aan tafel.'}</p>` : '';
      const did = [ui.save ? `red ${nameOf(m.victim)}` : '', ui.sel >= 0 ? `vergiftig ${nameOf(ui.sel)}` : ''].filter(Boolean);
      return `${head}<p class="sub">${m.victim >= 0 ? `De wolven kozen <b>${nameOf(m.victim)}</b>.` : 'De wolven kozen niemand.'}</p>${save}${poison}
        <button class="cta hot" type="button" data-act="witch" ${ui.sent === S.seq ? 'disabled' : ''}><span>${did.length ? `Klaar: ${did.join(' en ')}` : 'Niks doen'}</span>${ARR}</button>${potionsLine()}`;
    }
    default: {
      const intro = m.role === 'burger' ? 'Je slaapt, maar je mag alvast iemand verdenken.' : 'Je hebt vannacht niks te doen.';
      if (m.done) return `${head}<p class="sub">Je verdenkt <b>${nameOf(m.pick)}</b>.</p>${wait}`;
      return `${head}<p class="sub">${intro} Wie verdenk jij? Tik op een speler aan tafel.</p>${confirmBtn('suspect', ui.sel, (n) => `Verdenk ${n}`, undefined, 'moon')}${hint}`;
    }
  }
}

const potionsLine = () => `<p class="fine">Drankje om te redden: ${mine().potions.heal ? 'nog over' : 'op'} · gif: ${mine().potions.poison ? 'nog over' : 'op'}</p>`;

// wie dood is kijkt als geest mee
function ghostDock() {
  const m = mine();
  let info = '';
  if (S.phase === 'nacht') {
    const picks = (m.pack || []).map((x) => `<div><span><i style="--pc:${PC[x.p % PC.length]}"></i>${nameOf(x.p)}</span><b>${x.pick >= 0 ? `kiest ${nameOf(x.pick)}` : 'kiest nog'}</b></div>`).join('');
    info = picks ? `<div class="lines">${picks}</div>` : '';
    if (m.night && (m.night.save || m.night.poison >= 0)) info += `<p class="sub">De heks ${[m.night.save ? 'redt het slachtoffer' : '', m.night.poison >= 0 ? `vergiftigt ${nameOf(m.night.poison)}` : ''].filter(Boolean).join(' en ')}.</p>`;
  } else if (S.phase === 'dag') {
    const voted = S.players.filter((p) => p.voted).length;
    info = `<p class="waitline">${voted} van ${aliveSeats().length} hebben gestemd</p>`;
  }
  return `<div class="ask-h"><h2>Je bent dood</h2>${rolePill(m.role)}</div>
    <p class="sub">Je kijkt als geest mee en ziet alle rollen. Niks verklappen!</p>${info}${forceLink(S.phase === 'dag' ? 'Stemming sluiten' : 'Niet langer wachten')}`;
}

// de doden van de laatste ochtend
function morningLine() {
  const ev = [...(S.log || [])].reverse().find((e) => e.type === 'ochtend' && e.night === S.day);
  if (!ev) return '';
  return `<p class="sub">${ev.deaths.length ? `Vannacht ${ev.deaths.length === 1 ? 'stierf' : 'stierven'} ${andList(ev.deaths.map((d) => `<b>${who(d.p)}</b> (${roleName(d.role)})`))}.` : 'Vannacht is er niemand gestorven.'}</p>`;
}

function dayDock() {
  const m = mine(), voted = S.players.filter((p) => p.voted).length, alive = aliveSeats().length;
  const head = `<div class="ask-h"><h2>Dag ${S.day}</h2><button class="pill" type="button" data-act="peek">${ui.peek ? `${ICON[m.role]}${roleName(m.role)}` : 'Mijn rol'}</button></div>`;
  const peek = ui.peek ? `${roleCard(m.role, { small: true })}${knownLines()}${m.lover ? `<p class="sub">${HEART.replace('<svg', '<svg width="13" height="13" style="color:var(--r-cupido);vertical-align:-2px"')} Je bent verliefd op <b>${nameOf(m.lover.p)}</b> (${roleName(m.lover.role)}).</p>` : ''}` : '';
  const sel = ui.sel;
  const vote = m.vote;
  let body;
  if (vote == null) {
    body = `<p class="sub">Overleg met elkaar en stem wie er wordt opgehangen. Tik op een speler aan tafel.</p>
      <div class="choice">${confirmBtn('vote', sel, (n) => `Stem op ${n}`)}</div>
      <button class="ghostbtn" type="button" data-act="blank" ${ui.sent === S.seq ? 'disabled' : ''}>Op niemand stemmen</button>`;
  } else {
    body = `<p class="sub">Jij stemde ${vote >= 0 ? `op <b>${nameOf(vote)}</b>` : 'op niemand'}. Je kunt nog wisselen tot iedereen gestemd heeft.</p>
      ${sel >= 0 && sel !== vote ? confirmBtn('vote', sel, (n) => `Toch op ${n}`) : ''}
      <p class="waitline">${voted} van ${alive} hebben gestemd</p>`;
  }
  return `${head}${peek}${morningLine()}${body}${forceLink('Stemming sluiten')}`;
}

function hunterDock() {
  const h = S.hunter, md = mode();
  if (md === 'shoot') {
    const forNote = h !== S.you ? `<p class="fine warn">${nameOf(h)} is weg. Jij schiet nu voor de jager.</p>` : '';
    return `${forNote}<div class="ask-h"><h2>Pang!</h2>${rolePill('jager')}</div>
      <p class="sub">${h === S.you ? 'Je bent dood, maar als jager neem je nog iemand mee.' : `${nameOf(h)} was de jager en neemt nog iemand mee.`} Tik op wie je neerschiet.</p>
      ${confirmBtn('shoot', ui.sel, (n) => `Schiet ${n} neer`)}`;
  }
  return `<div class="ask-h"><h2>De jager schiet</h2>${rolePill('jager')}</div>
    <p class="sub"><b>${nameOf(h)}</b> was de jager en neemt nog iemand mee.</p>
    <p class="waitline">Wachten op ${nameOf(h)}</p>${forceLink('Jager overslaan')}`;
}

// wie er dood ging, in één zin per speler
const deathLines = (deaths) => deaths.map((d) => `<div><span><i style="--pc:${PC[d.p % PC.length]}"></i>${who(d.p)}${d.cause === 'liefde' ? ' <small>(van verdriet)</small>' : ''}</span><span class="rl" style="${rc(d.role)}">${ICON[d.role]}${roleName(d.role)}</span></div>`).join('');

// de uitslag van de nacht, de stemming of het schot
function resultDock(ev) {
  const dismiss = '<button class="ghostbtn" type="button" data-act="dismiss">Verder</button>';
  const drink = (list, n) => (list.length ? `<div class="action">${GLASS}<span>${andList(list.map(who))} ${list.length === 1 && list[0] !== S.you ? 'drinkt' : 'drinken'} ${slok(n)}</span></div>` : '');
  const dead = ev.deaths || [];
  if (ev.type === 'ochtend') {
    return `<div class="res-h ${dead.length ? 'bad' : 'moon'}"><span class="verdict">${dead.length ? 'Ochtend' : 'Iedereen leeft'}</span></div>
      <p class="sub">${dead.length ? `Vannacht ${dead.length === 1 ? 'is er iemand' : 'zijn er spelers'} gestorven.` : 'Vannacht is er niemand gestorven.'}</p>
      ${dead.length ? `<div class="lines">${deathLines(dead)}</div>${drink(dead.map((d) => d.p), W.DEAD_SIPS)}` : ''}${dismiss}`;
  }
  if (ev.type === 'stemming') {
    const votes = `<div class="lines">${ev.votes.map(([v, t]) => `<div><span><i style="--pc:${PC[v % PC.length]}"></i>${who(v)}</span><b>${t >= 0 ? nameOf(t) : 'niemand'}</b></div>`).join('')}</div>`;
    const head = ev.lynched >= 0 ? `${S.players[ev.lynched].name} hangt` : 'Niemand hangt';
    const why = ev.lynched >= 0 ? `${who(ev.lynched)} was ${ROLE[dead[0].role].a}.` : ev.tie ? 'De stemmen staken: er wordt niemand opgehangen.' : 'Niemand kreeg een stem.';
    return `<div class="res-h ${ev.lynched >= 0 ? 'bad' : 'moon'}"><span class="verdict">${esc(head)}</span></div>
      <p class="sub">${why}${dead.some((d) => d.cause === 'liefde') ? ' Van verdriet stierf ook zijn geliefde.' : ''}</p>${votes}
      ${dead.length ? drink(dead.map((d) => d.p), W.DEAD_SIPS) : ''}${(ev.wrong || []).length ? `${drink(ev.wrong, W.WRONG_VOTE_SIPS)}<p class="fine">Wie op een onschuldige stemde, drinkt ${slok(W.WRONG_VOTE_SIPS)}.</p>` : ''}${dismiss}`;
  }
  if (ev.type === 'jager') {
    if (ev.target < 0) return `<div class="res-h moon"><span class="verdict">Geen schot</span></div><p class="sub">De jager schoot niemand neer.</p>${dismiss}`;
    return `<div class="res-h bad"><span class="verdict">Pang!</span></div>
      <p class="sub">De jager schoot ${who(ev.target)} neer.</p><div class="lines">${deathLines(dead)}</div>${drink(dead.map((d) => d.p), W.DEAD_SIPS)}${dismiss}`;
  }
  return dismiss;
}

function doneDock() {
  const ev = [...(S.log || [])].reverse().find((e) => e.type === 'klaar');
  const winners = ev ? ev.winners : [], losers = ev ? ev.losers : [];
  const [title, why] = WIN[S.winner];
  const rows = S.players.map((p, i) => ({ p, i })).filter(({ p }) => p.role).sort((a, b) => ROLE_ORDER.indexOf(a.p.role) - ROLE_ORDER.indexOf(b.p.role)).map(({ p, i }) =>
    `<div class="${winners.includes(i) ? 'won' : ''}"><span class="${p.alive ? '' : 'dead'}"><i style="--pc:${PC[i % PC.length]}"></i>${who(i)}${p.alive ? '' : ' ✝'}</span><span class="rl" style="${rc(p.role)}">${ICON[p.role]}${roleName(p.role)}</span></div>`).join('');
  const won = winners.includes(S.you);
  return `<div class="ask-h"><div class="res-h ${won ? 'good' : 'gold'}"><span class="verdict">${title}</span></div></div>
    <p class="sub">${why} ${inGame() ? (won ? 'Jij hoort bij de winnaars!' : `Jij verloor: drink ${slok(W.LOSE_SIPS)}.`) : ''}</p>
    <div class="lines">${rows}</div>
    ${losers.length ? `<p class="fine">De verliezers drinken ${slok(W.LOSE_SIPS)}: ${andList(losers.map(who))}.</p>` : ''}
    ${isHost()
      ? `<button class="cta hot" type="button" data-act="next"><span>Nog een potje</span>${ARR}</button><button class="ghostbtn" type="button" data-act="roles">Rollen kiezen</button>`
      : `<p class="waitline">Wachten tot ${nameOf(S.host)} de rollen opnieuw uitdeelt</p>`}`;
}

/* ================= VELLEN ================= */
function menuHTML() {
  const host = isHost(), game = S && S.phase !== 'lobby';
  return `${sheetTop('Menu')}
  <nav class="mlist">
    <button type="button" data-act="rules">Spelregels <span>›</span></button>
    ${game ? '<button type="button" data-act="story">Wat er gebeurde <span>›</span></button>' : ''}
    ${game ? '<button type="button" data-act="score">Stand <span>›</span></button>' : ''}
    ${S && (!game || S.phase === 'klaar') ? `<button type="button" data-act="roles">Rollen <span>${host ? 'kiezen' : 'bekijken'}</span></button>` : ''}
    <button type="button" data-act="mute">Geluid <span>${Snd.muted ? 'uit' : 'aan'}</span></button>
    ${S ? `<button type="button" data-act="share">Uitnodigen <span>${S.code}</span></button>` : ''}
    ${game && host ? '<button type="button" data-act="againask">Terug naar de lobby <span>›</span></button>' : ''}
    ${S ? '<button type="button" data-act="leaveask">Verlaat tafel <span>›</span></button>' : ''}
    <a href="/">Naar de speelhal <span>›</span></a>
  </nav>`;
}

function rolesHTML() {
  const host = isHost(), s = S.settings, can = host && (S.phase === 'lobby' || S.phase === 'klaar');
  const n = Math.max(W.MIN_PLAYERS, S.phase === 'lobby' ? liveCount() : S.players.filter((p) => p.connected).length);
  const toggles = W.SPECIALS.map((r) => `<button class="tgl${s[r] ? ' on' : ''}" type="button" data-act="role" data-r="${r}" style="${rc(r)}" ${can ? '' : 'disabled'}>
      <span class="nm">${ICON[r]}<span>${roleName(r)}<small>${ROLE[r].text}</small></span></span><span class="sw"></span></button>`).join('');
  return `${sheetTop('Rollen', 'Weerwolven')}
    <p>Met ${n} spelers: <b>${deckText(W.deckOf(W.roleList(n, s)))}</b>.</p>
    <p class="kick">Weerwolven</p>
    <div class="seg">${W.WOLF_CHOICES.map((w) => `<button type="button" data-act="wolves" data-n="${w}" aria-pressed="${s.wolves === w}" ${can && (!w || w <= W.maxWolves(n)) ? '' : 'disabled'}>${w || 'Auto'}</button>`).join('')}</div>
    ${toggles}
    <div class="rules"><p class="small">Automatisch: 1 wolf tot en met 5 spelers, 2 tot en met 8, daarboven 3. Er is altijd minder dan de helft wolf. Zijn er te weinig spelers voor alle rollen, dan vallen de onderste af. De rest is burger.${can ? '' : host ? ' Je kunt de rollen aanpassen als het potje klaar is.' : ' Alleen de host kan de rollen kiezen.'}</p></div>`;
}

// het verhaal van dit potje, uit de laatste gebeurtenissen
function storyHTML() {
  const log = S.log || [];
  const start = log.map((e) => e.type).lastIndexOf('rollen');
  const lines = log.slice(Math.max(0, start)).map((e) => {
    const ds = (e.deaths || []).map((d) => `${who(d.p)} (${roleName(d.role)}${d.cause === 'liefde' ? ', van verdriet' : ''})`);
    switch (e.type) {
      case 'rollen': return `<div><b>Potje ${e.round}</b><br>${deckText(e.deck)}</div>`;
      case 'ochtend': return `<div><b>Nacht ${e.night}</b><br>${ds.length ? `Dood: ${andList(ds)}` : 'Niemand gestorven'}</div>`;
      case 'stemming': return `<div><b>Dag ${e.day}</b><br>${e.votes.map(([v, t]) => `${who(v)} → ${t >= 0 ? nameOf(t) : 'niemand'}`).join(', ')}<br>${ds.length ? `Opgehangen: ${andList(ds)}` : e.tie ? 'Gelijkspel: niemand opgehangen' : 'Niemand opgehangen'}</div>`;
      case 'jager': return `<div><b>De jager</b><br>${e.target >= 0 ? `Schoot ${andList(ds)}` : 'Schoot niemand neer'}</div>`;
      case 'weg': return `<div><b>Vertrokken</b><br>${andList(ds)}</div>`;
      case 'klaar': return `<div><b>${WIN[e.winner][0]}</b></div>`;
      default: return '';
    }
  }).join('');
  return `${sheetTop('Wat er gebeurde', `Potje ${S.round}`)}<div class="story">${lines || '<div>Nog niks.</div>'}</div>`;
}

function scoreHTML() {
  const rows = S.players.map((p, i) => ({ p, i })).sort((a, b) => b.p.sips - a.p.sips);
  return `${sheetTop('Stand')}
  <div class="scorecard"><table>
    <thead><tr><th>Speler</th><th>Slokken</th><th>Gewonnen</th><th>Potjes</th></tr></thead>
    <tbody>${rows.map(({ p, i }) => `<tr style="--pc:${PC[i % PC.length]}"><td><i></i>${esc(p.name)}</td><td>${p.sips}</td><td>${p.wins}</td><td>${p.games}</td></tr>`).join('')}</tbody>
  </table></div>
  <p class="sub">Slokken: hoeveel iemand moest drinken. Gewonnen: hoe vaak iemand bij de winnaars hoorde.</p>`;
}

function rulesHTML() {
  const r = (x) => `<span class="rr" style="${rc(x)}">${ICON[x]}${roleName(x)}</span>`;
  return `${sheetTop('Spelregels', 'Weerwolven')}
  <div class="rules">
    <p>Het dorp Wakkerdam wordt geteisterd door weerwolven. Iedereen speelt op zijn eigen telefoon en de telefoon is de spelleider: die deelt de rollen uit, regelt de nacht en telt de stemmen.</p>
    <ol>
      <li><b>Je rol.</b> Iedereen krijgt geheim een rol. Hou je scherm voor jezelf. Wolven zien wie de andere wolven zijn.</li>
      <li><b>De nacht.</b> Iedereen tikt iets aan, zodat niemand ziet wie er een rol heeft. De wolven kiezen samen een slachtoffer en moeten het eens worden.</li>
      <li><b>De ochtend.</b> Je hoort wie er dood is en wat die was. Wie doodgaat, drinkt ${slok(W.DEAD_SIPS)} en kijkt verder als geest mee (niks verklappen!).</li>
      <li><b>De dag.</b> Overleg, beschuldig en stem op je telefoon wie er wordt opgehangen. Wie de meeste stemmen krijgt, hangt. Staken de stemmen, dan niemand. Wie op een onschuldige stemde, drinkt ${slok(W.WRONG_VOTE_SIPS)}.</li>
      <li><b>Winnen.</b> Het dorp wint als alle wolven dood zijn, de wolven als alleen zij nog leven. De verliezers drinken ${slok(W.LOSE_SIPS)}.</li>
    </ol>
    <ul>
      <li>${r('wolf')} kiest elke nacht samen met de andere wolven wie er wordt opgegeten.</li>
      <li>${r('ziener')} bekijkt elke nacht de rol van één speler.</li>
      <li>${r('heks')} ziet wie de wolven kozen. Ze kan één keer per spel iemand redden en één keer iemand vergiftigen.</li>
      <li>${r('jager')} schiet als hij doodgaat nog iemand neer.</li>
      <li>${r('cupido')} maakt de eerste nacht twee spelers verliefd. Sterft de een, dan sterft de ander van verdriet. Zijn een wolf en een dorpeling verliefd, dan winnen zij samen als zij als laatsten over zijn.</li>
      <li>${r('burger')} heeft geen kracht, maar wel een stem.</li>
    </ul>
    <p class="small">De host kiest in de lobby hoeveel wolven er zijn en welke rollen meedoen. Wie de tafel verlaat tijdens een potje, is dood en iedereen ziet zijn rol. Is er iemand even weg, dan kan de host niet langer wachten. Drink met mate: water of karnemelk telt ook.</p>
  </div>`;
}

function openSheet(key, html) { ui.sheet = { key, html }; renderSheet(); }
function closeSheet() { ui.sheet = null; renderSheet(); }

function renderSheet() {
  const ov = $('#overlay'), sh = $('#sheet');
  if (!ui.sheet) { if (!ov.hidden) { ov.hidden = true; sh.innerHTML = ''; } ui.sheetHtml = null; return; }
  const wasHidden = ov.hidden;
  if (!wasHidden && ui.sheetHtml === ui.sheet.html) return;
  sh.innerHTML = ui.sheet.html;
  sh.classList.toggle('anim', wasHidden);
  ov.hidden = false;
  ui.sheetHtml = ui.sheet.html;
  if (wasHidden) { const first = sh.querySelector('button, a'); if (first) first.focus({ preventScroll: true }); }
}

function toast(msg, cls = '') {
  const box = $('#toasts'), el = document.createElement('div');
  // dezelfde melding nog in beeld (bijvoorbeeld na een paar keer tikken)? Dan alleen de nieuwe
  for (const old of box.querySelectorAll('div:not(.net)')) if (old.textContent === msg) old.remove();
  el.textContent = msg; if (cls) el.className = cls;
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 2800);
}

function netPill() {
  const box = $('#toasts');
  let el = box.querySelector('.net');
  const bad = S && Net.status !== 'open';
  if (bad && !el) { el = document.createElement('div'); el.className = 'net'; el.textContent = 'Verbinding kwijt, opnieuw verbinden…'; box.prepend(el); }
  if (!bad && el) el.remove();
}

function celebrate() {
  if (reduce) return;
  const box = $('#confetti'), cols = ['#f7c548', '#e5383b', '#8a6cff', '#2fbf71', '#f78a1d', '#ff6b9a'];
  box.innerHTML = Array.from({ length: 70 }, () => `<i style="left:${(Math.random() * 100).toFixed(1)}%;background:${cols[Math.floor(Math.random() * cols.length)]};--t:${(2.4 + Math.random() * 2).toFixed(2)}s;--dl:${(Math.random() * .6).toFixed(2)}s;--x:${Math.round((Math.random() - .5) * 160)}px;--r:${Math.round(360 + Math.random() * 720)}deg"></i>`).join('');
  setTimeout(() => { box.innerHTML = ''; }, 5200);
}

/* ================= TEKENEN ================= */
function view() {
  if (!S) return 'home';
  if (S.phase === 'lobby') return 'lobby';
  return S.phase === 'klaar' ? 'klaar' : 'spel';
}

function render() {
  const v = view();
  // een nieuwe stap: het dock springt even op
  const step = S ? `${v}:${S.phase}:${S.day}:${mode()}:${!!ui.show}` : v;
  ui.dockPop = step !== ui.lastStep;
  ui.lastStep = step;
  document.documentElement.dataset.view = v;
  document.documentElement.dataset.phase = S ? S.phase : '';
  const scr = $('#screen');
  const nameIn = $('#nameIn'), codeIn = $('#codeIn');
  if (nameIn) ui.name = nameIn.value;
  if (codeIn) ui.code = codeIn.value;
  const keep = v === ui.lastView ? scr.scrollTop : 0;
  const html = { home: vHome, lobby: vLobby, spel: vSpel, klaar: vSpel }[v]();
  scr.classList.toggle('is-game', v !== 'home');
  scr.innerHTML = `<div class="view v-${v}${v !== 'home' ? ' game' : ''}">${html}</div>`;
  placeSeats();
  scr.scrollTop = keep;
  ui.lastView = v;
  const own = $('#owe');
  if (S && S.phase !== 'lobby') {
    const n = S.players[S.you].sips;
    own.hidden = false;
    own.classList.toggle('zero', !n);
    own.innerHTML = `${GLASS}${n}`;
    own.setAttribute('aria-label', `Jij dronk ${slok(n)}`);
  } else own.hidden = true;
  if (ui.sheet && ui.sheet.key === 'menu') ui.sheet.html = menuHTML();
  if (ui.sheet && ui.sheet.key === 'score' && S) ui.sheet.html = scoreHTML();
  if (ui.sheet && ui.sheet.key === 'roles' && S) ui.sheet.html = rolesHTML();
  if (ui.sheet && ui.sheet.key === 'story' && S) ui.sheet.html = storyHTML();
  renderSheet();
  netPill();
}

/* ================= BEDIENING ================= */
function myName() {
  const input = $('#nameIn');
  const name = W.cleanNames([input ? input.value : ui.name])[0] || '';
  if (!name) { ui.error = 'Vul eerst je naam in.'; render(); const n = $('#nameIn'); if (n) n.focus(); return null; }
  me.name = name; ui.name = name; store.set(KEY.me, me);
  return name;
}

function joinWith(code) {
  const name = myName();
  if (!name) return;
  code = String(code || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (code.length !== 4) { ui.error = 'Vul de code van 4 letters in.'; render(); return; }
  ui.joining = true; ui.error = ''; ui.code = code;
  Snd.ac();
  Net.go({ t: 'join', code, name, token: me.token });
  render();
}

// na een tik even wachten op de server, zodat een dubbele tik niet twee keer telt
function sendOnce(msg) {
  Snd.ac();
  const seq = S.seq;
  ui.sent = seq;
  Net.send(msg);
  setTimeout(() => { if (ui.sent === seq) { ui.sent = -1; render(); } }, 2500);
  render();
}

const actions = {
  create() {
    const name = myName();
    if (!name) return;
    ui.joining = true; ui.error = '';
    Snd.ac();
    Net.go({ t: 'create', name, token: me.token });
    render();
  },
  start() { Snd.ac(); Net.send({ t: 'start' }); },
  share() {
    const url = `${location.origin}/weerwolven/${S.code}`, text = `Doe mee met Weerwolven aan tafel ${S.code}`;
    closeSheet();
    if (navigator.share) navigator.share({ title: 'Weerwolven', text, url }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Link gekopieerd'), () => toast(url));
    else toast(url);
  },
  kickask(el) {
    const i = +el.dataset.seat;
    openSheet('kick', `${sheetTop(`${nameOf(i)} van tafel halen?`)}
      <p>${nameOf(i)} kan daarna opnieuw meedoen met de code.</p>
      <button class="cta" type="button" data-act="kick" data-seat="${i}"><span>Ja, van tafel halen</span>${ARR}</button>
      <button class="ghostbtn" type="button" data-act="close">Nee</button>`);
  },
  kick(el) { Net.send({ t: 'kick', seat: +el.dataset.seat }); closeSheet(); },
  // een speler aantikken: kiezen (of weer niet), bij Cupido twee
  tap(el) {
    const i = +el.dataset.seat, md = mode();
    if (!canTarget(i, md)) return;
    Snd.ac(); Snd.chip();
    if (md === 'cupido') ui.pair = ui.pair.includes(i) ? ui.pair.filter((x) => x !== i) : [...ui.pair.slice(-1), i];
    else ui.sel = ui.sel === i && md === 'heks' ? -1 : i;
    render();
  },
  unsel() { ui.sel = -1; render(); },
  reveal() { ui.reveal = !ui.reveal; Snd.ac(); Snd.chip(); render(); },
  ready() { sendOnce({ t: 'ready' }); },
  wolf() { const t = ui.sel >= 0 ? ui.sel : mine().pick; sendOnce({ t: 'wolf', target: t }); ui.sel = -1; },
  look() { sendOnce({ t: 'look', target: ui.sel }); },
  cupid() { sendOnce({ t: 'cupid', a: ui.pair[0], b: ui.pair[1] }); },
  save() { ui.save = !ui.save; Snd.chip(); render(); },
  witch() { sendOnce({ t: 'witch', save: ui.save, poison: ui.sel }); },
  suspect() { sendOnce({ t: 'suspect', target: ui.sel }); },
  vote() { sendOnce({ t: 'vote', target: ui.sel }); ui.sel = -1; },
  blank() { sendOnce({ t: 'vote', target: -1 }); ui.sel = -1; },
  shoot() { sendOnce({ t: 'shoot', target: ui.sel }); },
  peek() {
    ui.peek = !ui.peek;
    clearTimeout(ui.peekTimer);
    if (ui.peek) ui.peekTimer = setTimeout(() => { ui.peek = false; render(); }, 6000);
    render();
  },
  dismiss() { clearTimeout(ui.showTimer); ui.show = null; render(); },
  forceask(el) {
    openSheet('force', `${sheetTop(`${el.dataset.label}?`)}
      <p>Het spel gaat dan door met wat er gekozen is. Wie nog niks koos, doet deze keer niet mee. 's Nachts beslissen de meeste stemmen van de wolven.</p>
      <button class="cta" type="button" data-act="force"><span>Ja, ga door</span>${ARR}</button>
      <button class="ghostbtn" type="button" data-act="close">Nee, wachten</button>`);
  },
  force() { Net.send({ t: 'force' }); closeSheet(); },
  next() { Snd.ac(); Net.send({ t: 'next' }); },
  roles() { openSheet('roles', rolesHTML()); },
  wolves(el) { Net.send({ t: 'settings', wolves: +el.dataset.n }); },
  role(el) { const r = el.dataset.r; Net.send({ t: 'settings', role: r, on: !S.settings[r] }); },
  mine() {
    const n = S.players[S.you].sips;
    toast(n ? `Jij dronk al ${slok(n)}` : 'Jij hebt nog niks hoeven drinken');
  },
  menu() { openSheet('menu', menuHTML()); },
  rules() { openSheet('rules', rulesHTML()); },
  score() { openSheet('score', scoreHTML()); },
  story() { openSheet('story', storyHTML()); },
  mute() { Snd.muted = !Snd.muted; store.set(KEY.mute, Snd.muted); if (!Snd.muted) Snd.chip(); openSheet('menu', menuHTML()); },
  againask() {
    openSheet('again', `${sheetTop('Terug naar de lobby?')}
      <p>Het potje stopt en de stand begint opnieuw. In de lobby kunnen nieuwe spelers aanschuiven en kun je de rollen kiezen.</p>
      <button class="cta" type="button" data-act="again"><span>Ja, terug naar de lobby</span>${ARR}</button>
      <button class="ghostbtn" type="button" data-act="close">Nee, verder spelen</button>`);
  },
  again() { Net.send({ t: 'again' }); closeSheet(); },
  leaveask() {
    const playing = S && S.phase !== 'lobby' && S.phase !== 'klaar' && mine() && mine().alive;
    openSheet('leave', `${sheetTop('Tafel verlaten?')}
      <p>${playing ? 'Verlaat je de tafel tijdens een potje, dan ben je dood en ziet iedereen je rol.' : 'Met de code kun je later weer aanschuiven.'}</p>
      <button class="cta" type="button" data-act="leave"><span>Ja, verlaten</span>${ARR}</button>
      <button class="ghostbtn" type="button" data-act="close">Nee, blijven</button>`);
  },
  leave() { Net.send({ t: 'leave' }); leaveLocal(); },
  close: closeSheet,
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled && actions[el.dataset.act]) { actions[el.dataset.act](el); return; }
  if (e.target === $('#overlay')) closeSheet();
});
document.addEventListener('submit', (e) => { if (e.target.id === 'joinForm') { e.preventDefault(); joinWith($('#codeIn').value); } });
document.addEventListener('input', (e) => {
  if (e.target.id === 'codeIn') { const v = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); if (v !== e.target.value) e.target.value = v; }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#overlay').hidden) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'nameIn') { e.preventDefault(); const c = $('#codeIn'); if (c && c.value.length === 4) joinWith(c.value); else if (c) c.focus(); }
});
addEventListener('resize', placeSeats);

/* ================= START ================= */
// zat je net nog aan een tafel (en open je niet een andere link)? Dan meteen terug op je plek.
const lastTable = store.get(KEY.table, null);
if (lastTable && typeof lastTable.code === 'string' && (!urlCode || urlCode === lastTable.code)) {
  ui.joining = true;
  Net.go({ t: 'join', code: lastTable.code, name: me.name, token: me.token });
}
render();
if (urlCode && !ui.joining) { const n = $('#nameIn'); if (n && !n.value) n.focus(); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeSeats);
</script>
</body>
</html>
