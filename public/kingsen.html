<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingsen</title>
<meta name="description" content="Kingsen op één telefoon: trek om de beurt een kaart uit de cirkel. Elke kaart is een opdracht, en wie de vierde heer op het glas legt, krijgt een mega strafpunt.">
<meta name="theme-color" content="#120c24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kingsen">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/kingsen.webmanifest">
<link rel="icon" href="/img/kingsen.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/kingsen-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@500;600;700;800&display=swap">
<style>
:root{
  /* Koninklijk: diep paars, goud en een cirkel kaarten rond een glas. Koppen in een klassieke letter, de rest
     strak en groot, zodat iedereen aan tafel het kan lezen. */
  --bg:#120c24;
  --bg-2:#1b1335;
  --card:#211843;
  --card-2:#2c2157;
  --line:rgba(255,255,255,.11);
  --txt:#f6f1ff;
  --mute:#bcb0da;
  --gold:#f3c34b;
  --gold-2:#ffe08a;
  --purple:#8b5cf6;
  --red:#d9343f;
  --ink:#1b1430;
  --paper:#fffaf0;
  --ok:#7ee2a8;
  --head:"Cinzel",Georgia,serif;
  --ui:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg) radial-gradient(120% 70% at 50% -10%,#3a2575 0%,rgba(18,12,36,0) 60%) no-repeat;color:var(--txt);font:16px/1.5 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}
h1,h2,h3{margin:0;line-height:1.05}
p{margin:0}

.app{position:relative;min-height:100svh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:8px;min-height:52px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px 0 8px;border-radius:999px;color:var(--mute);text-decoration:none;font-weight:600;font-size:15px}
.back:hover{color:var(--txt)}
.top .title{font-family:var(--head);font-weight:900;font-size:19px;letter-spacing:.04em;margin-right:auto}
.top .spacer{margin-right:auto}
.iconbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--txt)}
.iconbtn:hover{background:var(--card-2)}

.screen{flex:1;display:flex;flex-direction:column;gap:14px;padding-top:6px}
.screen.anim{animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card{padding:18px;border-radius:20px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.card h2{font-family:var(--head);font-weight:900;font-size:21px;margin-bottom:10px;letter-spacing:.02em}
.label{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.muted{color:var(--mute);font-size:14px}
.grow{flex:1}
.center{text-align:center}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;padding:0 20px;border-radius:18px;font-family:var(--ui);font-weight:800;font-size:20px;text-decoration:none;text-align:center}
.btn.go{background:linear-gradient(180deg,var(--gold-2),var(--gold) 55%,#d9a22c);color:#2a1a00;box-shadow:0 12px 30px rgba(243,195,75,.28),inset 0 -4px 0 rgba(0,0,0,.14)}
.btn.go:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line);font-size:17px;min-height:52px}
.btn.ghost:hover{background:var(--card-2)}
.btn.stick{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:3}
.textlink{display:block;margin:0 auto;min-height:44px;padding:0 14px;color:var(--mute);font-weight:600;font-size:15px}
.textlink:hover{color:var(--txt)}

/* start */
.hero{display:grid;justify-items:center;text-align:center;gap:8px;padding:6px 0 2px}
.hero h1{font-family:var(--head);font-weight:900;font-size:clamp(48px,14vw,68px);letter-spacing:.03em;background:linear-gradient(180deg,var(--gold-2),var(--gold) 60%,#c98d1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 22px rgba(243,195,75,.25))}
.hero p{color:var(--mute);max-width:32ch}
.crown{width:84px;height:auto;filter:drop-shadow(0 8px 20px rgba(243,195,75,.35))}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;font-size:15px;line-height:1.45}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--gold);color:#2a1a00;font-weight:800;font-size:15px}
.steps b{color:#fff}
.howlink{display:inline-flex;align-items:center;gap:8px;margin-top:12px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--card-2);font-weight:700;font-size:14px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px}
.opt b{display:block;font-weight:800;font-size:17px}
.opt small{display:block;color:var(--mute);font-size:13.5px;line-height:1.4}
.sw{position:relative;flex:none;width:56px;height:32px;border-radius:999px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.sw[aria-checked="true"]{background:var(--purple)}
.sw[aria-checked="true"]::after{transform:translateX(24px)}
.cheat{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:0;padding:0;list-style:none;font-size:13.5px}
.cheat li{display:flex;gap:8px;align-items:baseline}
.cheat b{flex:none;min-width:22px;color:var(--gold);font-weight:800}

/* een speelkaart */
.pc{--w:120px;position:relative;width:var(--w);height:calc(var(--w) * 1.4);border-radius:calc(var(--w) * .1);background:linear-gradient(160deg,var(--paper),#efe5d2);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 10px 24px rgba(0,0,0,.45);flex:none}
.pc.red{color:var(--red)}
.pc .ix{position:absolute;left:7%;top:4.5%;display:grid;justify-items:center;font:800 calc(var(--w) * .17)/.95 var(--ui)}
.pc .ix i{font-style:normal;font-size:.75em}
.pc .ix.b{left:auto;top:auto;right:7%;bottom:4.5%;transform:rotate(180deg)}
.pc .mid{position:absolute;inset:0;display:grid;place-items:center;font:800 calc(var(--w) * .52)/1 var(--ui)}
.pc .mid.court{inset:15% 25%;border:2px solid currentColor;border-radius:calc(var(--w) * .07);font-family:var(--head);font-weight:900;font-size:calc(var(--w) * .34);align-content:center;gap:2px;justify-items:center}
.pc .mid.court i{font-style:normal;font-family:var(--ui);font-size:.7em}

/* de cirkel rond het glas */
.status{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px;font-weight:700;color:var(--txt)}
.chip b{color:var(--gold);font-variant-numeric:tabular-nums}
.chip svg{flex:none}
button.chip:hover{background:var(--card-2)}
.dir.ccw svg{transform:scaleX(-1)}
.ringwrap{position:relative;container-type:inline-size;width:min(100%,380px);aspect-ratio:1;margin:0 auto;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.ringwrap::before{content:"";position:absolute;inset:4%;border-radius:50%;background:radial-gradient(closest-side,rgba(139,92,246,.22),rgba(139,92,246,.06) 70%,transparent)}
.rc{position:absolute;width:8.4%;height:11.8%;border-radius:4px;background:repeating-linear-gradient(45deg,#4a2a8a 0 3px,#5d37a8 3px 6px);box-shadow:inset 0 0 0 2px #fffaf0,0 3px 6px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.3,.7,.2,1),opacity .35s}
.rc.weg{opacity:0}
.ringwrap.kapot .rc.dicht{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.glass{position:absolute;left:50%;top:50%;width:26%;transform:translate(-50%,-46%);pointer-events:none}
.kings{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.kings .pc{position:absolute;--w:10cqw;left:calc(var(--w) * -.5);top:calc(-14cqw - var(--w) * .8);box-shadow:0 4px 10px rgba(0,0,0,.5)}
.kings .pc .ix{display:none}
.kings .pc .mid.court{inset:12%;font-size:calc(var(--w) * .42)}
.hint{text-align:center;color:var(--mute);font-size:14px;min-height:21px}
.vorige{text-align:center;font-size:14px;color:var(--mute)}
.vorige b{color:var(--txt)}

/* de getrokken kaart en de opdracht */
.reveal{display:grid;justify-items:center;gap:12px;text-align:center}
.reveal .pc{--w:min(36vw,150px);animation:flip .5s cubic-bezier(.3,.7,.2,1) both}
@keyframes flip{0%{transform:rotateY(90deg) translateY(-18px)}100%{transform:none}}
.screen:not(.anim) .reveal .pc{animation:none}
.reveal h2{font-family:var(--head);font-weight:900;font-size:clamp(28px,8.5vw,38px);letter-spacing:.02em;color:var(--gold-2)}
.reveal .rule{font-size:17px;line-height:1.5;max-width:34ch}
.reveal .rule b{color:#fff}
.extra{width:100%;display:grid;gap:10px;justify-items:center}
.idee{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.idee span{padding:8px 14px;border-radius:14px;background:var(--card-2);box-shadow:inset 0 0 0 1px rgba(243,195,75,.4);font-weight:800}
.mini{min-height:40px;padding:0 14px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-weight:700;font-size:14px}
.mini:hover{background:var(--card-2)}
.regelin{width:100%;display:grid;gap:8px}
.regelin textarea{width:100%;min-height:64px;padding:12px 14px;border:0;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--txt);font:16px/1.4 var(--ui);resize:vertical}
.regelin textarea:focus{outline:2px solid var(--gold)}
.regels{width:100%;display:grid;gap:8px;margin:0;padding:0;list-style:none;text-align:left}
.regels li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:15px}
.regels li span{flex:1;overflow-wrap:anywhere}
.regels .mini{flex:none;min-height:36px;color:#ffb3b8}
.ok{color:var(--ok);font-weight:700}
.tel{font-family:var(--head);font-weight:900;font-size:76px;line-height:1;color:var(--gold-2);min-height:80px;animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
.tel.wijs{font-size:54px;color:#fff}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:30px;height:42px;border-radius:6px;box-shadow:inset 0 0 0 2px rgba(243,195,75,.5)}
.dots i.on{background:linear-gradient(160deg,var(--gold-2),var(--gold));box-shadow:0 4px 12px rgba(243,195,75,.35)}
.draai{width:70px;height:70px;color:var(--gold);animation:spin .8s cubic-bezier(.3,.7,.2,1)}
.draai.ccw{transform:scaleX(-1)}
@keyframes spin{from{rotate:-180deg;opacity:0}}

/* einde */
.boom{display:grid;justify-items:center;text-align:center;gap:10px;padding-top:8px}
.boom h1{font-family:var(--head);font-weight:900;font-size:clamp(34px,10vw,48px);line-height:1.05;color:var(--gold-2)}
.boom .mega{display:inline-block;padding:8px 18px;border-radius:999px;background:linear-gradient(180deg,#ff6b6b,var(--red));color:#fff;font-weight:800;font-size:18px;box-shadow:0 10px 30px rgba(217,52,63,.4);animation:pop .4s .2s cubic-bezier(.2,1.6,.4,1) both}
.boom p{color:var(--mute);max-width:32ch}
.boom .pc{--w:min(32vw,130px)}
.broken{width:150px;height:150px}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tally div{padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.tally b{display:block;font-weight:800;font-size:26px;line-height:1}
.tally span{font-size:12.5px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.screen.anim,.reveal .pc,.tel,.draai,.boom .mega{animation:none}.rc{transition:none}}

.sheet,.menu{position:fixed;inset:0;z-index:21;display:flex;padding:calc(62px + env(safe-area-inset-top,0px)) 16px 16px;background:rgba(8,5,18,.55)}
.menu{align-items:flex-start;justify-content:flex-end}
.menu nav{width:min(100%,300px);display:grid;padding:8px;border-radius:18px;background:var(--card-2);box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 0 1px var(--line)}
.menu nav a,.menu nav button{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:12px;text-decoration:none;font-weight:600;text-align:left}
.menu nav a:hover,.menu nav button:hover{background:rgba(255,255,255,.06)}
.sheet{align-items:flex-end;justify-content:center}
.sheet>div{width:min(100%,480px);max-height:80vh;overflow:auto;display:grid;gap:12px;padding:18px;border-radius:22px;background:var(--bg-2);box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 0 1px var(--line)}
.sheet h2{font-family:var(--head);font-weight:900;font-size:22px}
.fine{margin-top:auto;padding-top:14px;text-align:center;color:#8d80ad;font-size:12.5px;line-height:1.45}
.fine a{color:var(--mute)}
</style>
<script src="/js/poort.js" defer></script>
<script src="/js/uitleg.js" defer></script>
<script src="/js/review.js" defer></script>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="back" href="/?tab=een" aria-label="Terug naar De Spelkeet"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span id="backTxt">De Spelkeet</span></a>
    <span class="title" id="topTitle" hidden>Kingsen</span>
    <span class="spacer" id="spacer"></span>
    <button class="iconbtn" id="soundBtn" type="button" aria-label="Geluid uit"></button>
    <button class="iconbtn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </header>
  <main id="screen" class="screen"></main>
  <p class="fine">Wat een (mega) strafpunt is, spreken jullie samen af. Niks is verplicht, het gaat om de lol. <a href="/melden">Iets melden</a></p>
</div>

<div class="menu" id="menu" hidden>
  <nav aria-label="Menu">
    <button type="button" data-act="uitleg">❓ Hoe werkt het?</button>
    <button type="button" data-act="kaarten">🃏 Alle kaarten</button>
    <button type="button" data-act="instellingen" id="menuSet">⚙️ Nieuw spel of instellingen</button>
    <a href="/review?spel=kingsen">⭐ Wat vind je ervan?</a>
    <a href="/melden">🚩 Iets melden</a>
    <a href="/?tab=een">🏠 Terug naar De Spelkeet</a>
  </nav>
</div>
<div class="sheet" id="sheet" hidden><div role="dialog" aria-modal="true" aria-labelledby="sheetT" id="sheetBox"></div></div>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const kies = (l) => l[Math.floor(Math.random() * l.length)];

/* ================= DE KAARTEN ================= */
// 52 kaarten, zonder jokers. s: 0 harten, 1 ruiten, 2 klaveren, 3 schoppen; r: 2 tot en met 14 (boer 11 ... aas 14)
const SUITS = [{ sym: '♥', red: true, naam: 'harten' }, { sym: '♦', red: true, naam: 'ruiten' }, { sym: '♣', red: false, naam: 'klaveren' }, { sym: '♠', red: false, naam: 'schoppen' }];
const RANK = { 11: 'B', 12: 'V', 13: 'H', 14: 'A' };
const RANKNAAM = { 11: 'boer', 12: 'vrouw', 13: 'heer', 14: 'aas' };
const label = (c) => RANK[c.r] || String(c.r);
const naam = (c) => `${SUITS[c.s].naam} ${RANKNAAM[c.r] || c.r}`;
function nieuwDeck() {
  const d = [];
  for (let s = 0; s < 4; s++) for (let r = 2; r <= 14; r++) d.push({ r, s });
  for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; }
  return d;
}
function kaartHTML(c, cls = '') {
  const red = SUITS[c.s].red, sym = SUITS[c.s].sym, rk = label(c), court = c.r >= 11 && c.r <= 13;
  return `<div class="pc${red ? ' red' : ''} ${cls}" role="img" aria-label="${naam(c)}"><span class="ix">${rk}<i>${sym}</i></span><span class="mid${court ? ' court' : ''}">${court ? `${rk}<i>${sym}</i>` : sym}</span><span class="ix b">${rk}<i>${sym}</i></span></div>`;
}
// Elke soort kaart is een opdracht. Een strafpunt en een mega strafpunt: wat dat is, spreken jullie samen af.
const REGELS = {
  2: { naam: 'Uitdelen', kort: 'Geef iemand een strafpunt', tekst: 'Kies iemand aan tafel. Die krijgt een <b>strafpunt</b> van jou.' },
  3: { naam: 'Voor jou', kort: 'Zelf een strafpunt', tekst: 'Pech: jij krijgt zelf een <b>strafpunt</b>.' },
  4: { naam: 'Categorie', kort: 'Noem om de beurt iets', tekst: 'Kies een categorie. Om de beurt noemt iedereen er iets uit. Wie niks meer weet of iets noemt dat al geweest is, krijgt een <b>strafpunt</b>.' },
  5: { naam: 'Duimen', kort: 'Laatste duim op tafel', tekst: 'Leg op een moment dat jij kiest je duim op tafel. Wie het ziet, doet je na. Wie zijn duim als laatste neerlegt, krijgt een <b>strafpunt</b>.' },
  6: { naam: 'Maatje', kort: 'Kies een maatje', tekst: 'Kies een maatje. Elke keer dat jij een strafpunt krijgt, krijgt je maatje er ook een. Samen uit, samen thuis.' },
  7: { naam: 'Tafel van 7', kort: 'Tellen zonder 7', tekst: 'Tel om de beurt hardop vanaf 1. Getallen uit de tafel van 7 (7, 14, 21 …) en getallen met een 7 erin (17, 27 …) mag je niet zeggen. Wie een fout maakt, krijgt een <b>strafpunt</b>.' },
  8: { naam: 'Regel verzinnen', kort: 'Een nieuwe regel', tekst: 'Verzin een regel die de rest van het spel geldt. Bijvoorbeeld: niemand mag nog iemands naam zeggen. Wie zich er niet aan houdt, krijgt een <b>strafpunt</b>.' },
  9: { naam: 'Regel afschaffen', kort: 'Schaf een regel af', tekst: 'Je mag één regel die met een 8 is verzonnen weer afschaffen.' },
  10: { naam: 'Quizmaster', kort: 'Geef geen antwoord', tekst: 'Jij bent de quizmaster. Wie antwoord geeft op een vraag van jou, krijgt een <b>strafpunt</b>. Er is maar één quizmaster: trekt iemand anders een 10, dan neemt die het over.' },
  11: { naam: 'Wijzen', kort: 'Iedereen wijst', tekst: 'Iedereen steekt een hand in de lucht. Tel af van 5 naar 0 (de telefoon kan het voor je doen) en wijs dan tegelijk iemand aan. Wie het vaakst wordt aangewezen, krijgt een <b>strafpunt</b>.' },
  12: { naam: 'Rise of the queen', kort: 'Hand omhoog', tekst: 'Op een moment dat jij kiest steek je je hand op en roep je <b>"Rise of the queen!"</b> Iedereen doet je na. Wie het als laatste doet, krijgt een <b>strafpunt</b>.' },

/* ================= KNOPPEN ================= */
document.addEventListener('click', (e) => {
  if (e.target.closest('#ring')) { if (!$('#menu').hidden) return sluitMenu(); return tikRing(e); }
  const t = e.target.closest('button,[data-act]');
  if (!t) {
    if (!$('#menu').hidden && !e.target.closest('#menu nav')) sluitMenu();
    if (!$('#sheet').hidden && !e.target.closest('#sheetBox')) sluitSheet();
    return;
  }
  if (t.id === 'menuBtn') { const m = $('#menu'); m.hidden = !m.hidden; t.setAttribute('aria-expanded', String(!m.hidden)); return; }
  if (t.id === 'soundBtn') { S.geluid = !S.geluid; save(); geluidKnop(); if (S.geluid) Snd.klik(); return; }
  if (!$('#menu').hidden) sluitMenu();
  if (t.dataset.sw) { S[t.dataset.sw] = !S[t.dataset.sw]; save(); return toon('start'); }
  if (t.dataset.schaf !== undefined) {
    const k = +t.dataset.schaf; G.regels.splice(k, 1); Snd.klik();
    return toon('kaart');
  }
  switch (t.dataset.act) {
    case 'uitleg': if (window.Uitleg) window.Uitleg.open('kingsen'); break;
    case 'kaarten': kaartenSheet(); break;
    case 'regels': regelsSheet(); break;
    case 'sluit': sluitSheet(); break;
    case 'begin': audio(); nieuwSpel(); toon('ring'); break;
    case 'pak': pakWillekeurig(); break;
    case 'terug': toon('ring'); break;
    case 'verder': clearTimeout(telTimer); toon('ring'); break;
    case 'idee': { G.idee = kies(CATEGORIEEN.filter((x) => x !== G.idee)); const el = $('#idee'); if (el) el.textContent = G.idee; break; }
    case 'bewaar': {
      const v = ($('#regel').value || '').trim().slice(0, 140);
      if (!v) { $('#regel').focus(); break; }
      G.regels.push(v); $('#regel').value = ''; $('#bewaard').hidden = false; Snd.klik(); break;
    }
    case 'tel': aftellen(); break;
    case 'instellingen': clearTimeout(telTimer); toon('start'); break;
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { sluitMenu(); sluitSheet(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'ring') { e.preventDefault(); pakWillekeurig(); }
});

geluidKnop();
toon('start');
})();
</script>
</body>
</html>
