<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paardenrace</title>
<meta name="description" content="Het drankspel Paardenrace online: kies een aas als paard, zet slokken in en trek om de beurt een kaart. Wie op het verkeerde paard zette, drinkt.">
<meta name="theme-color" content="#150b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paardenrace">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/paardenrace.webmanifest">
<link rel="icon" href="/img/paardenrace.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/paardenrace-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;700&family=Sofia+Sans+Extra+Condensed:wght@500;700;800;900&display=swap">
<style>
:root{
  /* Dezelfde tafel als Bussen en Pak de dealer: bovenin een glazen balk, in het midden de groene vilten tafel
     met de spelers rondom (jij altijd onderaan) en de renbaan op het vilt, onderin een donkere actiebalk. */
  --night:#150b18;
  --night-3:#0b060d;
  --cream:#f3efdb;
  --cream-2:#e4dec2;
  --cream-3:#d6cfae;
  --plum:#2b1531;
  --plum-2:#6a4570;
  --pink:#d690c9;
  --pink-2:#b866a8;
  --rose:#ff6b8b;
  --lime:#a6d83c;
  --gold:#f7c548;
  --paper:#fffdf4;
  --paper-2:#efe7cc;
  --ink:#24132a;
  --suit-red:#d2343f;
  --good:#3ee07f;
  --bad:#ff5a64;
  --ink-soft:#c9b9cf;
  --glass:rgba(255,255,255,.08);
  --glass-line:rgba(255,255,255,.24);
  --glow:var(--lime);
  --display:"Sofia Sans Extra Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --mono:"Martian Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --s1:11px; --s2:13px; --s3:15px;
  color-scheme:dark;
}
html[data-view="lobby"],html[data-view="home"]{--glow:var(--pink)}
html[data-view="uitslag"]{--glow:var(--gold)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{background:var(--night)}
body{margin:0;background:radial-gradient(120% 90% at 50% 30%,#2a1534 0%,var(--night) 55%,var(--night-3) 100%) fixed;color:var(--cream);font-family:var(--mono);font-size:var(--s2);line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:800;letter-spacing:-.005em}
p{margin:0}
.glow{position:fixed;left:50%;top:-34vh;width:150vw;max-width:1100px;height:70vh;transform:translateX(-50%);background:radial-gradient(closest-side,var(--glow),transparent);opacity:.3;pointer-events:none;z-index:0;transition:background .6s}
.stars{position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.55) 1px,transparent 1.6px),radial-gradient(rgba(255,217,138,.5) 1px,transparent 1.6px);background-size:61px 67px,97px 89px;background-position:0 0,31px 43px;opacity:.16;pointer-events:none;z-index:0}

/* ---------- vaste UI ---------- */
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px 6px}
.bar-r{display:flex;gap:8px}
.glass{background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -6px 14px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.35)}
.round{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;color:var(--cream)}
.round:hover{background:rgba(255,255,255,.14)}
.owe{display:inline-flex;align-items:center;gap:5px;height:42px;padding:0 13px;border-radius:999px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.owe svg{width:16px;height:16px}
.owe.zero{color:var(--ink-soft)}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:900;font-size:24px;line-height:1;letter-spacing:.06em;color:var(--cream);white-space:nowrap}
.brand svg{width:24px;height:24px;color:var(--lime);flex:none}

.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.screen.is-game{padding-bottom:0}
.view{display:flex;flex-direction:column;gap:14px;min-height:100%}
.view.game{display:grid;grid-template-rows:minmax(300px,1fr) auto;height:100%;min-height:0;gap:0}

.kick{font-size:var(--s1);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.cream{background:var(--cream);color:var(--plum);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.chip{display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;background:var(--plum);color:var(--cream);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.3}
.chip.line{background:transparent;color:var(--plum);box-shadow:inset 0 0 0 1px rgba(43,21,49,.35)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;border-radius:999px;padding:9px 10px 9px 22px;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;color:var(--cream);text-decoration:none;text-align:left;background:linear-gradient(90deg,#2a1330 0%,#57295d 46%,#c47fba 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 30px rgba(43,21,49,.35);transition:filter .2s,transform .2s}
.cta:hover{filter:brightness(1.12)}
.cta:active{transform:translateY(1px)}
.cta .arr{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);flex:none}
.cta:disabled{background:var(--cream-2);color:var(--plum-2);box-shadow:inset 0 0 0 1.5px rgba(43,21,49,.2);filter:none;transform:none}
.cta:disabled .arr{background:rgba(43,21,49,.08)}
.dock .cta{background:linear-gradient(90deg,#3a1b42 0%,#6b3472 46%,#d690c9 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 30px rgba(0,0,0,.4)}
.dock .cta.hot{background:linear-gradient(90deg,#1e3a10 0%,#4b7f1f 46%,#a6d83c 100%)}
.dock .cta:disabled{background:rgba(255,255,255,.08);color:var(--ink-soft);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.ghostbtn{display:block;width:100%;border-radius:999px;padding:14px 20px;font-size:var(--s2);font-weight:700;color:var(--plum);box-shadow:inset 0 0 0 1px rgba(43,21,49,.3);text-decoration:none;text-align:center}
.ghostbtn:hover{background:var(--cream-2)}
.dock .ghostbtn{padding:11px 18px;color:var(--cream);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.dock .ghostbtn:hover{background:rgba(255,255,255,.08)}
.linkbtn{justify-self:start;padding:4px 0;font-size:var(--s1);font-weight:700;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}

/* ---------- kaarten ---------- */
.card{position:relative;flex:none;width:var(--w,64px);height:calc(var(--w,64px) * 1.4);perspective:700px}
.card .cin{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.card.down .cin{transform:rotateY(180deg)}
.card.reveal .cin{animation:reveal .6s cubic-bezier(.3,.7,.2,1) var(--d,0s) both}
@keyframes reveal{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
.card.dealin{animation:dealin .42s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
@keyframes dealin{from{transform:translateY(-26px) rotate(-10deg);opacity:0}}
.face{position:absolute;inset:0;border-radius:calc(var(--w,64px) * .12);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front{background:linear-gradient(160deg,var(--paper),var(--paper-2));color:var(--ink);box-shadow:inset 0 0 0 1px rgba(43,21,49,.18),0 6px 14px rgba(0,0,0,.35)}
.card.red .front{color:var(--suit-red)}
.back{transform:rotateY(180deg);background:radial-gradient(circle at 50% 50%,rgba(214,144,201,.35) 0 16%,transparent 17%),repeating-linear-gradient(45deg,rgba(214,144,201,.2) 0 2px,transparent 2px 8px),repeating-linear-gradient(-45deg,rgba(214,144,201,.2) 0 2px,transparent 2px 8px),linear-gradient(160deg,#41204b,#22102a);box-shadow:inset 0 0 0 calc(var(--w,64px) * .055) var(--cream),inset 0 0 0 calc(var(--w,64px) * .075) rgba(43,21,49,.5),0 6px 14px rgba(0,0,0,.35)}
.back::after{content:"♠";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:calc(var(--w,64px) * .3);color:var(--cream);opacity:.85}
.ix{position:absolute;left:9%;top:5%;display:grid;justify-items:center;font-family:var(--display);font-weight:900;font-size:calc(var(--w,64px) * .3);line-height:.86;letter-spacing:-.04em}
.ix i{font-style:normal;font-size:.72em;letter-spacing:0}
.ix.b{left:auto;top:auto;right:9%;bottom:5%;transform:rotate(180deg)}
.pip{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w,64px) * .5);line-height:1}
.pip.court{inset:17% 19%;border:1.5px solid currentColor;border-radius:calc(var(--w,64px) * .08);font-family:var(--display);font-weight:900;font-size:calc(var(--w,64px) * .44);align-content:center;gap:0;line-height:.85;background:rgba(255,255,255,.4)}
.pip.court i{font-style:normal;font-size:.62em}
.card.mini .face{border-radius:calc(var(--w,64px) * .16)}
.card.mini .ix{inset:0;display:grid;place-content:center;font-size:calc(var(--w,64px) * .5);line-height:.82}
.card.mini .ix i{font-size:.78em}
.card.mini .ix.b,.card.mini .pip{display:none}
.card.mini .front{box-shadow:inset 0 0 0 1px rgba(43,21,49,.2),0 2px 5px rgba(0,0,0,.35)}
.card.mini .back{box-shadow:inset 0 0 0 calc(var(--w,64px) * .07) var(--cream),0 2px 5px rgba(0,0,0,.35)}
.card.mini .back::after{display:none}
.card.slot{border:1.5px dashed rgba(255,255,255,.32);border-radius:calc(var(--w,64px) * .12);background:rgba(0,0,0,.08)}

/* ---------- de tafel ---------- */
.table{position:relative;min-height:0;container-type:size;margin:4px -6px 8px}
.rail{position:absolute;inset:5% 6% 10%;border-radius:50%/30%;background:linear-gradient(180deg,#45323a 0%,#1d1418 50%,#110b0e 100%);box-shadow:0 26px 60px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.16),inset 0 -4px 10px rgba(0,0,0,.5)}
.felt{position:absolute;inset:calc(5% + 11px) calc(6% + 11px) calc(10% + 11px);border-radius:50%/30%;overflow:hidden;background:radial-gradient(ellipse 75% 60% at 50% 42%,#35a862 0%,#21823f 46%,#125a2e 100%);box-shadow:inset 0 0 0 2px rgba(247,197,72,.3),inset 0 10px 40px rgba(0,0,0,.35),inset 0 -20px 50px rgba(0,0,0,.3)}
.felt::before{content:"";position:absolute;inset:8% 10%;border-radius:50%/30%;border:1.5px solid rgba(255,255,255,.09)}
.center{position:absolute;left:50%;top:47.5%;z-index:2;transform:translate(-50%,-50%);width:66cqw;display:grid;justify-items:center;gap:2cqh;text-align:center}
.felt-logo{font-family:var(--display);font-weight:900;font-size:min(20cqw,110px);line-height:.8;letter-spacing:.02em;text-transform:uppercase;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25),0 0 30px rgba(255,255,255,.2)}
.felt-logo.small{font-size:min(12cqw,64px);line-height:.86}
.felt-logo.code{letter-spacing:.14em;margin-right:-.14em;color:var(--gold);text-shadow:0 4px 0 rgba(90,52,0,.5),0 0 30px rgba(247,197,72,.35)}
.felt-sub{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,239,219,.75)}
.banner{position:absolute;inset:0;z-index:6;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;pointer-events:none;background:radial-gradient(closest-side,rgba(11,6,13,.82),rgba(11,6,13,0));animation:banner 2s ease both}
.banner-t{font-family:var(--display);font-weight:900;font-size:min(15cqw,74px);line-height:.85;text-transform:uppercase;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(166,216,60,.5);max-width:80cqw}
@keyframes banner{0%{opacity:0;transform:scale(.85)}14%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.aces{display:flex;gap:3cqw;--w:min(13cqw,10cqh,64px)}
.aces .card:nth-child(odd){transform:translateY(-10%)}

/* ---------- de renbaan ----------
   Links de zeven kaarten (onderaan de eerste), dan per aas een baan. Rij 0 is de start, rij 8 de finish.
   Een vakje staat op kolom --c en rij --r; de paarden schuiven met een animatie van rij naar rij. */
.course{position:absolute;left:50%;top:13%;bottom:calc(10% + 26px);z-index:2;transform:translateX(-50%);width:min(64cqw,74cqh,420px);display:grid;grid-template-rows:minmax(0,1fr) auto;gap:4px;--w:min(6.2cqh,11cqw,54px)}
.lanes{position:relative}
.lane{position:absolute;top:0;bottom:0;left:calc(100% / 5 * var(--c));width:calc(100% / 5)}
.lane::before{content:"";position:absolute;inset:0 3px;border-radius:10px;background:repeating-linear-gradient(180deg,rgba(0,0,0,.2) 0 calc(100% / 9 - 1px),rgba(255,255,255,.07) calc(100% / 9 - 1px) calc(100% / 9));box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.lane.mine::before{box-shadow:inset 0 0 0 1.5px rgba(247,197,72,.75),0 0 16px rgba(247,197,72,.25)}
.lane.won::before{background:rgba(247,197,72,.22);box-shadow:inset 0 0 0 2px var(--gold),0 0 24px rgba(247,197,72,.55)}
.finish{position:absolute;left:calc(100% / 5 + 3px);right:3px;top:calc(100% / 9 - 3px);height:6px;background:repeating-conic-gradient(#fff 0 25%,#141414 0 50%) 0 0/6px 6px;box-shadow:0 1px 4px rgba(0,0,0,.4);z-index:1}
.startline{position:absolute;left:calc(100% / 5 + 3px);right:3px;top:calc(100% / 9 * 8);border-top:2px dashed rgba(255,255,255,.4);z-index:1}
.cell{position:absolute;left:calc(100% / 5 * var(--c));top:calc(100% / 9 * (8 - var(--r)));width:calc(100% / 5);height:calc(100% / 9);display:grid;place-items:center;z-index:2}
.lbl{font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(243,239,219,.7);writing-mode:vertical-rl;transform:rotate(180deg)}
.flag{width:min(70%,22px);height:auto;color:#fff}
.tc .card.fresh::after{content:"";position:absolute;inset:-3px;border-radius:calc(var(--w) * .2);box-shadow:0 0 0 2px var(--bad),0 0 16px rgba(255,90,100,.8);animation:pulse 1.2s ease-in-out 3;pointer-events:none}
.tc .card.old{opacity:.8}
.horse{z-index:3}
.horse .card .front{box-shadow:inset 0 0 0 1px rgba(43,21,49,.2),0 0 0 1.5px rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.45)}
.horse.mine .card .front{box-shadow:inset 0 0 0 1px rgba(43,21,49,.2),0 0 0 2.5px var(--gold),0 4px 14px rgba(247,197,72,.5)}
.horse.win .card{animation:winbob 1s ease-in-out infinite}
.horse.win .card .front{box-shadow:inset 0 0 0 1px rgba(43,21,49,.2),0 0 0 3px var(--gold),0 0 26px rgba(247,197,72,.85)}
@keyframes winbob{50%{transform:translateY(-12%) rotate(4deg)}}
.horse.go{animation:gallop .7s cubic-bezier(.3,.7,.3,1) both}
@keyframes gallop{0%{transform:translateY(calc(var(--dy) * 100%))}35%{transform:translateY(calc(var(--dy) * 62%)) rotate(-7deg)}70%{transform:translateY(calc(var(--dy) * 18%)) rotate(5deg)}100%{transform:none}}
.horse.back{animation:stepback .6s cubic-bezier(.3,.7,.3,1) .5s both}
@keyframes stepback{0%{transform:translateY(calc(var(--dy) * 100%))}30%{transform:translateY(calc(var(--dy) * 100%)) rotate(-10deg)}100%{transform:none}}
.horse.go::after,.horse.back::after{content:"";position:absolute;inset:8% 10%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.4),transparent);animation:dust .8s ease-out both;pointer-events:none;z-index:-1}
.horse.back::after{background:radial-gradient(closest-side,rgba(255,90,100,.55),transparent);animation-delay:.5s}
@keyframes dust{from{transform:scale(.4);opacity:1}to{transform:scale(1.8);opacity:0}}
.bettors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));min-height:10px}
.bettors div{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:2px}
.bettors i{width:9px;height:9px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
.bettors i.wait{background:transparent;box-shadow:inset 0 0 0 2px var(--pc)}

/* stoelen */
.seat{--ava:clamp(34px,12.5cqmin,54px);position:absolute;left:50%;top:50%;z-index:3;width:var(--ava);height:var(--ava);margin:calc(var(--ava) / -2) 0 0 calc(var(--ava) / -2);display:block;color:var(--cream);transition:opacity .3s,filter .3s}
.ava{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.55),rgba(255,255,255,0) 46%),var(--pc);box-shadow:0 0 0 3px #140d17,0 0 0 4.5px rgba(255,255,255,.22),0 10px 20px rgba(0,0,0,.55);font-family:var(--display);font-weight:900;font-size:calc(var(--ava) * .52);line-height:1;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.35);transition:transform .1s}
.seat.empty .ava{background:rgba(0,0,0,.35);box-shadow:0 0 0 2px rgba(255,255,255,.18);color:rgba(255,255,255,.55);border:1.5px dashed rgba(255,255,255,.35)}
.seat.off .ava{filter:grayscale(1) brightness(.7)}
.seat.now .ava{box-shadow:0 0 0 3px #140d17,0 0 0 5px var(--gold),0 0 26px rgba(247,197,72,.6),0 10px 20px rgba(0,0,0,.55)}
.seat.now::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(var(--gold),rgba(247,197,72,0) 40%,rgba(247,197,72,0) 60%,var(--gold));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.plate{position:absolute;left:50%;top:calc(100% - 7px);z-index:1;transform:translateX(-50%);min-width:calc(var(--ava) * 1.4);max-width:calc(var(--ava) * 2.4);padding:3px 8px 4px;border-radius:9px;background:linear-gradient(180deg,#241b27,#0d090f);border:1px solid rgba(255,255,255,.16);box-shadow:0 6px 14px rgba(0,0,0,.55);display:grid;justify-items:center;line-height:1.2;white-space:nowrap}
.plate b{max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;font-weight:700;color:#fff}
.plate span{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.plate span.zero{color:rgba(243,239,219,.45)}
.plate span.off{color:var(--ink-soft);font-weight:500}
.plate svg{width:11px;height:11px}
.seat.now .plate{border-color:var(--gold)}
.seat.me .plate{background:linear-gradient(180deg,#3a2240,#160c19);border-color:rgba(214,144,201,.6)}
.seat.dim{opacity:.38;filter:saturate(.35)}
button.seat{cursor:pointer}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
button.seat:active .ava{transform:scale(.94)}
/* op welk paard iemand zette: een rondje met de vorm rechtsboven op zijn hoofd */
.badge{position:absolute;right:-12%;top:-12%;z-index:2;width:48%;height:48%;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-size:calc(var(--ava) * .32);line-height:1;box-shadow:0 0 0 2px #140d17,0 3px 6px rgba(0,0,0,.5)}
.badge.r{color:var(--suit-red)}
.badge.wait{opacity:.6}
.tagwrap{position:absolute;left:50%;top:50%;z-index:4;width:0;height:0;display:flex;align-items:center;justify-content:center;pointer-events:none}

<script type="module">
import * as P from '/shared/paard.js';
import * as B from '/shared/bussen.js';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
// vaste kleur per stoel aan tafel
const PC = ['#4f8dff', '#d690c9', '#ff7a00', '#2fbf71', '#f7c548', '#ff4a24', '#a28fe3', '#36c5d6', '#e86aa0', '#9ccf3c'];
// de paarden: de vier azen, in de volgorde van B.SUITS
const HORSE = ['Harten', 'Ruiten', 'Klaveren', 'Schoppen'];
const sym = (h) => B.SUITS[h].sym;
const ARR = '<span class="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';
const GLASS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l-1.6 16.2a2 2 0 0 1-2 1.8H9.6a2 2 0 0 1-2-1.8z"/><path d="M6.6 9h10.8"/></svg>';
const SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
const FLAG = '<svg class="flag" viewBox="0 0 24 24" aria-label="Finish"><path d="M5 3v19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 4h14v10H6z" fill="#fff"/><path d="M6 4h3.5v2.5H6zM13 4h3.5v2.5H13zM9.5 6.5H13V9H9.5zM16.5 6.5H20V9h-3.5zM6 9h3.5v2.5H6zM13 9h3.5v2.5H13zM9.5 11.5H13V14H9.5zM16.5 11.5H20V14h-3.5z" fill="#141414"/></svg>';
// zo lang duurt het laten zien van een gebeurtenis voordat de volgende komt
const STEP_MS = { start: 1800, kaart: 850, terug: 1500, finish: 1900, inzetten: 0 };

/* ================= OPSLAG (alleen gemak, per telefoon) ================= */
const KEY = { me: 'paard-ik', table: 'paard-tafel', mute: 'paard-stil' };
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k) ?? 'null'); return v ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* opslag niet beschikbaar */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* idem */ } },
};

// wie ben ik: een geheime sleutel per telefoon, zodat je na wegvallen op je eigen plek terugkomt.
// Je naam neemt hij over van een ander spel in Rondje als je die daar al eens hebt ingevuld.
const me = (() => {
  const v = store.get(KEY.me, {}) || {};
  let token = typeof v.token === 'string' && /^[A-Za-z0-9_-]{16,64}$/.test(v.token) ? v.token : null;
  if (!token) {
    const abc = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_', a = new Uint8Array(24);
    crypto.getRandomValues(a);
    token = [...a].map((x) => abc[x & 63]).join('');
  }
  const name = typeof v.name === 'string' && v.name ? v.name : ['bussen-ik', 'boer-ik', 'mexen-ik', 'dealer-ik', 'paard-ik', 'rotonde-ik', 'mijn-ik', 'bord-ik'].filter((k) => k !== KEY.me).map((k) => (store.get(k, {}) || {}).name).find((n) => typeof n === 'string' && n);
  const o = { token, name: typeof name === 'string' ? name.slice(0, P.NAME_MAX) : '' };
  store.set(KEY.me, o);
  return o;
})();
const urlCode = ((location.pathname.match(/^\/paardenrace\/([A-Za-z]{4})$/) || [])[1] || new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);

/* ================= GELUID ================= */
const Snd = {
  ctx: null, out: null, muted: !!store.get(KEY.mute, false),
  ac() {
    if (this.muted) return null;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.out = this.ctx.createDynamicsCompressor();
      this.out.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(f, d, { type = 'sine', vol = .15, at = 0, slide = 0, lp = 0 } = {}) {
    const c = this.ac(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    let node = o;
    if (lp) { const f2 = c.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = lp; o.connect(f2); node = f2; }
    node.connect(g); g.connect(this.out); o.start(t); o.stop(t + d + .05);
  },
  noise(d, { vol = .2, at = 0, freq = 2600 } = {}) {
    const c = this.ac(); if (!c) return;
    const t = c.currentTime + at, len = Math.ceil(c.sampleRate * d), buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = .9; g.gain.value = vol;
    src.connect(bp); bp.connect(g); g.connect(this.out); src.start(t);
  },
  chip() { this.tone(2400, .04, { type: 'triangle', vol: .08 }); this.tone(1800, .05, { type: 'triangle', vol: .06, at: .03 }); },
  flip() { this.noise(.11, { vol: .35, freq: 3200 }); this.tone(1700, .03, { type: 'triangle', vol: .04, at: .07 }); },
  // hoeven op de baan: klip-klop, klip-klop
  gallop() { [0, .1, .24, .34].forEach((at, i) => { this.noise(.05, { vol: .3, freq: i % 2 ? 900 : 1300, at }); this.tone(i % 2 ? 330 : 440, .04, { type: 'triangle', vol: .07, at }); }); },
  // een paard moet terug
  back() { this.tone(330, .32, { type: 'sawtooth', vol: .08, slide: .55, lp: 1400 }); },
  // de trompet voor de start
  bugle() { [[392, 0, .12], [523, .13, .12], [659, .26, .12], [784, .39, .3], [659, .72, .12], [784, .85, .5]].forEach(([f, at, d]) => this.tone(f, d, { type: 'sawtooth', vol: .07, at, lp: 2400 })); },
  turn() { this.tone(988, .09, { type: 'triangle', vol: .1 }); this.tone(1319, .14, { type: 'triangle', vol: .1, at: .1 }); },
  bad() { this.tone(233, .34, { type: 'sawtooth', vol: .08, slide: .6, lp: 1400 }); this.tone(175, .38, { type: 'square', vol: .05, slide: .6, at: .03, lp: 1000 }); },
  win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, .24, { type: 'triangle', vol: .11, at: i * .1 })); },
};
const buzz = (p) => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* niet ondersteund */ } };

// het scherm aan laten zolang je aan tafel zit
let wake = null;
async function keepAwake(on) {
  try {
    if (on && !wake && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wake = await navigator.wakeLock.request('screen');
      wake.addEventListener('release', () => { wake = null; });
    } else if (!on && wake) { const w = wake; wake = null; await w.release(); }
  } catch (e) { wake = null; }
}

/* ================= VERBINDING ================= */
const Net = {
  ws: null, want: null, retry: 0, timer: 0, status: 'idle',
  url: `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/paardenrace`,
  // msg wordt (opnieuw) gestuurd bij elke verbinding: zo kom je na wegvallen vanzelf terug aan tafel
  go(msg) { this.want = msg; if (!this.send(msg)) this.open(); },
  open() {
    if (this.ws && this.ws.readyState <= 1) return;
    clearTimeout(this.timer);
    this.setStatus('connecting');
    let ws;
    try { ws = new WebSocket(this.url); } catch (e) { this.later(); return; }
    this.ws = ws;
    ws.onopen = () => { this.retry = 0; this.setStatus('open'); if (this.want) this.send(this.want); };
    ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } onMessage(m); };
    ws.onclose = () => { if (this.ws !== ws) return; this.ws = null; this.setStatus('closed'); if (this.want) this.later(); };
    ws.onerror = () => {};
  },
  later() { clearTimeout(this.timer); this.timer = setTimeout(() => this.open(), Math.min(5000, 400 * 2 ** this.retry++)); },
  send(o) { if (this.ws && this.ws.readyState === 1) { this.ws.send(JSON.stringify(o)); return true; } return false; },
  stop() { this.want = null; clearTimeout(this.timer); if (this.ws) { const ws = this.ws; this.ws = null; ws.close(); } this.setStatus('idle'); },
  setStatus(s) { this.status = s; netPill(); },
};
const wakeNet = () => { if (Net.want && (!Net.ws || Net.ws.readyState > 1)) { Net.retry = 0; Net.open(); } };
document.addEventListener('visibilitychange', () => { if (!document.hidden) { wakeNet(); if (S) keepAwake(true); } });
addEventListener('online', wakeNet);
setInterval(() => { if (S) Net.send({ t: 'ping' }); }, 20000);

/* ================= STAAT ================= */
let S = null;   // de laatste stand van de server
const ui = {
  joining: false, error: '', name: me.name, code: urlCode,
  seen: 0, banner: null, bannerTimer: 0, lastView: null, lastStep: null, dockPop: false, sheet: null, sheetHtml: null, build: null,
  sent: -1,          // na een tik wachten op de server, zodat een dubbele tik niet twee keer trekt
  wasMine: false,
  pick: null,        // jouw keuze tijdens het inzetten: { horse, bet, race }
  disp: null,        // wat er op de baan te zien is: { pos, track, last }; loopt achter de server aan tijdens de animaties
  fresh: {},         // wat er bij de volgende keer tekenen beweegt: { move: { horse, dy }, flip }
  note: '',          // wat er net gebeurde, voor in de actiebalk
  head: '',          // de kop in de actiebalk zolang een gebeurtenis wordt afgespeeld
};
// de gebeurtenissen van de server worden één voor één afgespeeld
const queue = { list: [], timer: 0 };
const playing = () => !!queue.timer || queue.list.length > 0;

function onMessage(m) {
  if (m.t === 'state') return onState(m);
  if (m.t === 'joinFailed') {
    Net.stop(); store.del(KEY.table);
    S = null; ui.joining = false; ui.error = m.msg;
    return render();
  }
  if (m.t === 'left') return leaveLocal(m.reason);
  if (m.t === 'err') toast(m.msg);
}

function onState(m) {
  // is de server bijgewerkt terwijl deze pagina openstond? Dan opnieuw laden, anders draait hier oude code.
  // Na het laden kom je met je sleutel vanzelf weer op je eigen plek.
  if (m.build) {
    if (ui.build && ui.build !== m.build) { Net.stop(); location.reload(); return; }
    ui.build = m.build;
  }
  const first = !S || S.code !== m.code;
  S = m;
  ui.joining = false; ui.error = '';
  store.set(KEY.table, { code: m.code });
  Net.want = { t: 'join', code: m.code, name: me.name, token: me.token };
  if (location.pathname !== `/paardenrace/${m.code}`) history.replaceState(null, '', `/paardenrace/${m.code}`);
  // je keuze bij het inzetten: begint bij wat de server van je weet
  if (m.phase === 'inzetten' && (first || !ui.pick || ui.pick.race !== m.race)) {
    const p = m.players[m.you];
    ui.pick = { horse: p.horse, bet: p.bet, race: m.race };
  }
  const seq = m.seq || 0;
  if (first || m.phase === 'lobby' || seq < ui.seen) {
    // geen oude gebeurtenissen opnieuw afspelen
    queue.list = []; clearTimeout(queue.timer); queue.timer = 0;
    syncDisp();
  } else {
    for (const ev of m.log || []) if (ev.seq > ui.seen) queue.list.push(ev);
  }
  ui.seen = seq;
  // ben jij nu aan de beurt om te trekken? Even trillen en een toon
  const mine = m.phase === 'race' && myTurn() >= 0;
  if (mine && !ui.wasMine && !first) { buzz(60); Snd.turn(); }
  ui.wasMine = mine;
  keepAwake(true);
  if (!playing()) syncDisp();
  if (queue.list.length && !queue.timer) playNext();
  else render();
}

// de baan zoals de server hem nu heeft
function syncDisp() {
  if (!S || !S.pos) { ui.disp = null; return; }
  ui.disp = { pos: S.pos.slice(), track: S.track.slice(), last: S.last };
}

function playNext() {
  queue.timer = 0;
  if (!S) { queue.list = []; return; }
  // te ver achter (de telefoon lag even weg)? Dan meteen naar de stand van nu
  if (queue.list.length > 8) queue.list = [];
  const ev = queue.list.shift();
  if (!ev) { syncDisp(); ui.fresh = {}; render(); return; }
  const ms = present(ev);
  queue.timer = setTimeout(playNext, reduce ? Math.min(ms, 400) : ms);
  render();
}

function leaveLocal(reason) {
  Net.stop();
  store.del(KEY.table);
  queue.list = []; clearTimeout(queue.timer); queue.timer = 0;
  S = null; ui.banner = null; ui.sheet = null; ui.disp = null; ui.pick = null; ui.code = '';
  history.replaceState(null, '', '/paardenrace');
  keepAwake(false);
  render();
  if (reason) toast(reason);
}

function banner(title, sub = '', ms = 2000) {
  ui.banner = { title, sub };
  clearTimeout(ui.bannerTimer);
  ui.bannerTimer = setTimeout(() => { ui.banner = null; render(); }, ms);
}

// Een gebeurtenis van de server laten zien en horen. Geeft terug hoe lang dat duurt.
function present(ev) {
  const d = ui.disp || (syncDisp(), ui.disp);
  ui.fresh = {};
  switch (ev.type) {
    case 'start': {
      ui.disp = { pos: [0, 0, 0, 0], track: Array(P.TRACK).fill(null), last: null };
      ui.head = 'Daar gaan ze!';
      const mine = ev.racers.find((r) => r.player === S.you);
      banner(mine ? 'Drink je inzet!' : 'De race begint', mine ? `${B.sipsText(mine.bet)} op ${HORSE[mine.horse]}` : `Race ${ev.race}`, STEP_MS.start + 200);
      ui.note = 'De paarden staan klaar. Trek om de beurt een kaart.';
      Snd.bugle(); buzz(mine ? [80, 50, 80] : 40);
      return STEP_MS.start;
    }
    case 'kaart':
      d.pos[ev.horse] = ev.to;
      d.last = ev.card;
      ui.head = `${HORSE[ev.horse]} vooruit!`;
      ui.fresh.move = { horse: ev.horse, dy: 1 };
      ui.note = `${who(ev.player)} trok ${lbl(ev.card)}: <b>${HORSE[ev.horse]}</b> een stap vooruit.`;
      Snd.flip(); setTimeout(() => Snd.gallop(), 120);
      return STEP_MS.kaart;
    case 'terug':
      d.track[ev.index] = ev.card;
      d.pos[ev.horse] = ev.to;
      ui.fresh.flip = ev.index;
      ui.head = `${HORSE[ev.horse]} terug!`;
      ui.fresh.move = { horse: ev.horse, dy: -1 };
      ui.note = `Alle paarden zijn langs kaart ${ev.index + 1}: dat is ${lbl(ev.card)}. <b>${HORSE[ev.horse]}</b> moet een stap terug.`;
      Snd.flip(); setTimeout(() => Snd.back(), 500);
      if (S.players[S.you].horse === ev.horse && S.racers.includes(S.you)) buzz(120);
      return STEP_MS.terug;
    case 'finish': {
      const won = ev.winners.includes(S.you);
      banner(`${HORSE[ev.horse]} wint!`, won ? 'Jouw paard!' : ev.winners.length ? `${ev.winners.map((i) => S.players[i].name).join(' en ')}` : 'Niemand zette erop', STEP_MS.finish + 300);
      Snd.win(); buzz(won ? [90, 50, 90, 50, 160] : [160]);
      if (won) celebrate();
      return STEP_MS.finish;
    }
    default:
      return STEP_MS[ev.type] || 0;
  }
}

/* ================= BOUWSTENEN ================= */
const nameOf = (i) => esc(S.players[i].name);
const who = (i) => i === S.you ? 'Jij' : nameOf(i);
const initial = (name) => [...name.trim()][0]?.toUpperCase() || '?';
const isHost = () => S && S.you === S.host;
const order = () => S.players.map((_, k) => (S.you + k) % S.players.length);
const liveCount = () => S.players.filter((p) => p.connected).length;
const lbl = (c) => `<b>${B.label(c)}</b>`;
const spoken = (c) => `${HORSE[c.s]} ${B.RANK_NAME[c.r] || c.r}`;
const inRace = (i) => S.racers.includes(i);
const list = (names) => names.length < 2 ? names.join('') : `${names.slice(0, -1).join(', ')} en ${names[names.length - 1]}`;
// voor wie jij nu mag trekken: jezelf, of als host iemand die weg is
const myTurn = () => {
  const t = S.turn;

function cardHTML(c, { cls = '', reveal = false } = {}) {
  if (!c) return `<div class="card down ${cls}" role="img" aria-label="dichte kaart"><div class="cin"><div class="face front"></div><div class="face back"></div></div></div>`;
  const rk = B.rankLabel(c), s = B.SUITS[c.s].sym;
  const mid = c.r >= 11 && c.r <= 13 ? `<span class="pip court">${rk}<i>${s}</i></span>` : `<span class="pip">${s}</span>`;
  return `<div class="card${B.isRed(c) ? ' red' : ''}${reveal ? ' reveal' : ''} ${cls}" role="img" aria-label="${spoken(c)}"><div class="cin"><div class="face front"><span class="ix">${rk}<i>${s}</i></span>${mid}<span class="ix b">${rk}<i>${s}</i></span></div><div class="face back"></div></div></div>`;
}

// De renbaan. pos: per paard de rij, track: de zeven kaarten (null = dicht), bettors: wie op welk paard zet.
function courseHTML({ pos, track, winner = -1, bettors = [] }) {
  const mine = bettors.find((b) => b.player === S.you);
  const f = ui.fresh;
  let html = '<div class="lanes">';
  for (let h = 0; h < P.HORSES; h++) html += `<div class="lane${mine && mine.horse === h ? ' mine' : ''}${h === winner ? ' won' : ''}" style="--c:${h + 1}"></div>`;
  html += `<div class="finish"></div><div class="startline"></div><div class="cell" style="--c:0;--r:${P.FINISH}">${FLAG}</div><div class="cell" style="--c:0;--r:0"><span class="lbl">Start</span></div>`;
  track.forEach((card, k) => {
    const fresh = f.flip === k;
    html += `<div class="cell tc" style="--c:0;--r:${k + 1}">${cardHTML(card, { cls: `mini${fresh ? ' fresh' : card ? ' old' : ''}`, reveal: fresh })}</div>`;
  });
  for (let h = 0; h < P.HORSES; h++) {
    const mv = f.move && f.move.horse === h ? f.move : null;
    const cls = `${mv ? (mv.dy > 0 ? ' go' : ' back') : ''}${h === winner ? ' win' : ''}${mine && mine.horse === h ? ' mine' : ''}`;
    html += `<div class="cell horse${cls}" style="--c:${h + 1};--r:${pos[h]}${mv ? `;--dy:${mv.dy}` : ''}">${cardHTML({ r: 14, s: h }, { cls: 'mini' })}</div>`;
  }
  html += '</div><div class="bettors" aria-hidden="true"><div></div>';
  for (let h = 0; h < P.HORSES; h++) html += `<div>${bettors.filter((b) => b.horse === h).map((b) => `<i class="${b.ready ? '' : 'wait'}" style="--pc:${PC[b.player % PC.length]}" title="${esc(S.players[b.player].name)}"></i>`).join('')}</div>`;
  return `<div class="course" role="img" aria-label="${courseLabel(pos, track)}">${html}</div></div>`;
}

const courseLabel = (pos, track) => `Renbaan: ${HORSE.map((n, h) => `${n} ${pos[h] >= P.FINISH ? 'over de finish' : pos[h] ? `bij kaart ${pos[h]}` : 'op de start'}`).join(', ')}. ${track.filter(Boolean).length} van de ${P.TRACK} kaarten naast de baan zijn open.`;

// wie er op welk paard zet: tijdens het inzetten iedereen die al koos, tijdens en na de race wie meedoet
const bettorsNow = () => S.phase === 'inzetten'
  ? S.players.flatMap((p, i) => (p.horse >= 0 ? [{ player: i, horse: p.horse, ready: p.ready }] : []))
  : S.racers.map((i) => ({ player: i, horse: S.players[i].horse, ready: true }));

// Stoelen op gelijke afstand langs de rand van de tafel: jij onderaan, daarna met de klok mee.
const seatCache = new Map();
function seatPositions(n, aspect) {
  const key = `${n}:${aspect.toFixed(2)}`;
  if (seatCache.has(key)) return seatCache.get(key);
  // de rand in procenten van de tafel (zie .rail): zijkanten op 6% en 94%, boven- en onderkant als halve ellips
  const rx = 44, ry = 25.5, top = 30.5, bot = 64.5, pts = [];
  const cap = (cy, a0, a1) => { for (let k = 0; k <= 48; k++) { const a = a0 + (a1 - a0) * k / 48; pts.push([50 + rx * Math.cos(a), cy + ry * Math.sin(a)]); } };
  cap(bot, Math.PI / 2, Math.PI);
  cap(top, Math.PI, Math.PI * 2);
  cap(bot, 0, Math.PI / 2);
  // afstanden in echte verhoudingen, zodat de stoelen ook op een smalle tafel gelijk verdeeld zijn
  const len = [0];
  for (let i = 1; i < pts.length; i++) len.push(len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], (pts[i][1] - pts[i - 1][1]) / aspect));
  const total = len[len.length - 1], out = [];
  for (let s = 0; s < n; s++) {
    const want = total * s / n;
    let i = 1;
    while (i < len.length - 1 && len[i] < want) i++;
    const t = (want - len[i - 1]) / ((len[i] - len[i - 1]) || 1);
    out.push([pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]);
  }
  seatCache.set(key, out);
  return out;
}

// Zet de stoelen op hun plek. Valt een naambordje of label buiten het scherm, dan schuift het naar binnen.
function placeSeats() {
  const scr = $('#screen').getBoundingClientRect(), minX = scr.left + 4, maxX = scr.right - 4;
  const inward = (cx, half) => cx - half < minX ? minX - (cx - half) : cx + half > maxX ? maxX - (cx + half) : 0;
  for (const t of document.querySelectorAll('.table')) {
    const r = t.getBoundingClientRect();
    if (!r.width || !r.height) continue;
    const seats = t.querySelectorAll('.seat');
    const pos = seatPositions(seats.length, r.width / r.height);
    seats.forEach((el, i) => {
      const [x, y] = pos[i];
      const cx = r.left + x / 100 * r.width;
      const shift = inward(cx, el.querySelector('.plate').offsetWidth / 2);
      el.style.left = shift ? `calc(${x}% + ${shift}px)` : `${x}%`;
      el.style.top = `${y}%`;
      const tag = el.querySelector('.tag');
      if (tag) tag.style.setProperty('--tx', `${inward(cx + shift, tag.offsetWidth / 2 + 4)}px`);
    });
    const d = t.querySelector('.dealer');
    if (d && pos.length) {
      const [x, y] = pos[+d.dataset.seat] || pos[0];
      d.style.left = `${x + (50 - x) * .2 + (x < 50 ? 9 : -9)}%`; d.style.top = `${y + (50 - y) * .22}%`;
    }
  }
}

// De tafel: rand, vilt, iets in het midden en de spelers eromheen (order: wie op welke stoel, jij eerst).
// seat(i) -> { now, dim, kick, horse: [paard, klaar], tag: [soort, tekst] }
function tableHTML({ order: seatsOrder, people, center = '', seat = () => ({}), dealer = -1, cls = '' }) {
  const seats = seatsOrder.map((i) => {
    const p = people[i], o = seat(i) || {};
    const btn = o.kick ? ` type="button" data-act="kickask" data-seat="${i}" aria-label="${esc(p.name)} van tafel halen"` : '';
    const el = btn ? 'button' : 'div';
    const line = p.empty ? '' : p.connected === false ? '<span class="off">weg</span>'
      : p.sips != null ? `<span class="${p.sips ? '' : 'zero'}" title="Slokken gedronken">${GLASS}${p.sips}</span>` : '';
    const badge = o.horse ? `<span class="badge${B.SUITS[o.horse[0]].red ? ' r' : ''}${o.horse[1] ? '' : ' wait'}" title="${HORSE[o.horse[0]]}">${sym(o.horse[0])}</span>` : '';
    const isMe = S && i === S.you && !p.empty;
    return `<${el} class="seat${o.now ? ' now' : ''}${o.dim ? ' dim' : ''}${p.empty ? ' empty' : ''}${isMe ? ' me' : ''}${p.connected === false ? ' off' : ''}" style="--pc:${PC[i % PC.length]}"${btn}>
      <span class="ava">${p.empty ? '+' : esc(initial(p.name))}</span>${badge}
      <span class="plate"><b>${p.empty ? 'Vrij' : esc(p.name)}</b>${line}</span>
      ${o.tag ? `<span class="tagwrap"><span class="tag ${o.tag[0]}">${o.tag[1]}</span></span>` : ''}
    </${el}>`;
  }).join('');
  const d = seatsOrder.indexOf(dealer);
  const ban = ui.banner ? `<div class="banner"><p class="felt-sub">${esc(ui.banner.sub)}</p><p class="banner-t">${esc(ui.banner.title)}</p></div>` : '';
  return `<div class="table ${cls}"><div class="rail"></div><div class="felt"></div>${d >= 0 ? `<span class="dealer" data-seat="${d}" title="Host" aria-hidden="true">H</span>` : ''}${center}${seats}${ban}</div>`;
}

const sheetTop = (title, kick = '', close = true) => `<div class="sheet-top"><div>${kick ? `<p class="kick">${kick}</p>` : ''}<h2 class="sheet-title" id="sheetTitle">${title}</h2></div>${close ? '<button class="xbtn" type="button" data-act="close" aria-label="Sluiten">✕</button>' : ''}</div>`;

// Inzetten: iedereen kiest een paard en een inzet en tikt op klaar.
function vInzetten() {
  const course = courseHTML({ pos: [0, 0, 0, 0], track: Array(P.TRACK).fill(null), bettors: bettorsNow() });
  const seat = (i) => {
    const p = S.players[i];
    return { horse: p.horse >= 0 ? [p.horse, p.ready] : null, tag: p.ready ? ['calm', 'Klaar'] : null };
  };
  return `${gameTable(course, seat)}<div class="dock${ui.dockPop ? ' pop' : ''}">${betDock()}</div>`;
}

function betDock() {
  const p = S.players[S.you], pick = ui.pick || { horse: p.horse, bet: p.bet };
  const ready = S.players.filter((x) => x.ready && x.horse >= 0).length;
  const waiting = S.players.flatMap((x, i) => (x.connected && !x.ready ? [nameOf(i)] : []));
  const host = isHost(), title = S.race ? `Race ${S.race + 1}` : 'Race 1';
  const go = host && ready >= P.MIN_PLAYERS && waiting.length
    ? `<button class="ghostbtn" type="button" data-act="go">Nu starten met ${ready} ${ready === 1 ? 'speler' : 'spelers'}</button>` : '';
  if (p.ready) {
    return `<div class="ask-h"><h2>Jij zet ${p.bet} op ${HORSE[p.horse]}</h2><span class="racechip">${title}</span></div>
      <p class="sub">Als de race begint, drink je eerst je inzet: ${B.sipsText(p.bet)}.</p>
      ${waiting.length ? `<p class="waitline">Wachten op ${list(waiting)}</p>` : '<p class="waitline">De race begint</p>'}
      ${go}
      <button class="linkbtn" type="button" data-act="unready">Paard of inzet wijzigen</button>`;
  }
  const count = (h) => S.players.filter((x, i) => i !== S.you && x.horse === h).length;
  const horses = [0, 1, 2, 3].map((h) => `<button class="hz" type="button" data-act="horse" data-h="${h}" aria-pressed="${pick.horse === h}">${cardHTML({ r: 14, s: h }, { cls: 'mini' })}<b>${HORSE[h]}</b><small>${count(h) ? `+${count(h)} ${count(h) === 1 ? 'ander' : 'anderen'}` : 'nog niemand'}</small></button>`).join('');
  return `<div class="ask-h"><h2>Kies je paard</h2><span class="racechip">${title}</span></div>
    <div class="horses">${horses}</div>
    <div class="optrow"><span>Inzet</span><div class="stepper"><button type="button" data-act="less" aria-label="Minder" ${pick.bet <= P.BET_MIN ? 'disabled' : ''}>−</button><b>${B.sipsText(pick.bet)}</b><button type="button" data-act="more" aria-label="Meer" ${pick.bet >= P.BET_MAX ? 'disabled' : ''}>+</button></div></div>
    <button class="cta hot" type="button" data-act="ready" ${pick.horse < 0 ? 'disabled' : ''}><span>${pick.horse < 0 ? 'Kies eerst een paard' : `Klaar: ${pick.bet} op ${HORSE[pick.horse]}`}</span>${ARR}</button>
    ${go}`;
}

// De race (en tijdens het afspelen van de laatste kaarten ook nog als de server al bij de uitslag is).
function vRace() {
  const d = ui.disp || (syncDisp(), ui.disp);
  const course = courseHTML({ pos: d.pos, track: d.track, bettors: bettorsNow() });
  const seat = (i) => {
    const p = S.players[i], racing = inRace(i);
    return { horse: racing ? [p.horse, true] : null, now: !playing() && i === S.turn, dim: !racing };
  };
  return `${gameTable(course, seat)}<div class="dock${ui.dockPop ? ' pop' : ''}">${raceDock()}</div>`;
}

function raceDock() {
  const d = ui.disp, p = S.players[S.you], actor = myTurn(), busy = playing() || ui.sent === S.seq;
  const t = S.turn;
  // zolang een kaart nog wordt afgespeeld, gaat het over wie hem trok
  const head = playing() && ui.head ? ui.head
    : actor === S.you ? 'Jij trekt' : actor >= 0 ? `Jij trekt voor ${nameOf(actor)}` : t >= 0 ? `${nameOf(t)} trekt` : 'Over de finish';
  const last = d.last ? cardHTML(d.last, { reveal: !!ui.fresh.move && ui.fresh.move.dy > 0 }) : '<div class="card slot" aria-hidden="true"></div>';
  const forNote = actor >= 0 && actor !== S.you ? `<p class="fine warn">${nameOf(actor)} is weg. Jij trekt nu voor ${nameOf(actor)}.</p>` : '';
  const action = actor >= 0
    ? `<button class="cta hot" type="button" data-act="draw" ${busy ? 'disabled' : ''}><span>Trek een kaart</span>${ARR}</button>`
    : t >= 0 ? `<p class="waitline">Wachten op ${nameOf(t)}</p>` : '';
  const mine = inRace(S.you) ? `Jij zette ${B.sipsText(p.bet)} op ${HORSE[p.horse]}.` : 'Jij kijkt deze race mee en zet in voor de volgende.';
  return `${forNote}<div class="drawn">${last}<div><h2>${head}</h2><p class="sub">${ui.note || 'Trek om de beurt een kaart: het paard met die vorm doet een stap vooruit.'}</p></div></div>
    ${action}<p class="fine">${mine} Nog ${S.pileLeft} kaarten op de stapel.</p>`;
}

function vUitslag() {
  const d = ui.disp || (syncDisp(), ui.disp);
  const course = courseHTML({ pos: d.pos, track: d.track, winner: S.winner, bettors: bettorsNow() });
  const seat = (i) => {
    const dr = S.drinks[i], p = S.players[i];
    const tag = !dr ? null : dr.total ? ['bad', `Drinkt ${dr.total}`] : ['', 'Wint!'];
    return { horse: dr ? [p.horse, true] : null, tag, dim: !dr };
  };
  return `${gameTable(course, seat)}<div class="dock${ui.dockPop ? ' pop' : ''}">${resultDock()}</div>`;
}

function resultDock() {
  const h = S.winner, mine = S.drinks[S.you];
  const winners = S.racers.filter((i) => S.drinks[i] && !S.drinks[i].total);
  const head = `${HORSE[h]} wint!`;
  const explain = winners.length ? `${list(winners.map(who))} ${winners.length === 1 ? 'zette' : 'zetten'} op ${HORSE[h]}.` : `Niemand zette op ${HORSE[h]}: iedereen drinkt alleen zijn eigen inzet.`;
  const myLine = !mine ? '' : mine.total
    ? `<div class="action">${GLASS}<span>Jij drinkt ${B.sipsText(mine.total)}<small>Je eigen inzet ${mine.own}${mine.winner ? ` + ${mine.winner} van de winnaar${winners.length > 1 ? 's' : ''}` : ''}</small></span></div>`
    : `<div class="action">${GLASS}<span>Jij wint!<small>De anderen drinken jouw inzet.</small></span></div>`;
  const rows = S.racers.filter((i) => i !== S.you).map((i) => {
    const dr = S.drinks[i];
    return `<div class="${dr.total ? '' : 'won'}" style="--pc:${PC[i % PC.length]}"><span><i></i>${nameOf(i)} <small>${sym(S.players[i].horse)}</small></span><b>${dr.total ? `drinkt ${dr.total}` : 'wint'}</b></div>`;
  }).join('');
  const action = isHost()
    ? `<button class="cta hot" type="button" data-act="next"><span>Volgende race</span>${ARR}</button>`
    : `<p class="waitline">Wachten tot ${nameOf(S.host)} de volgende race start</p>`;
  return `<div class="res-h ${mine && mine.total ? 'bad' : 'good'}"><span class="verdict">${head}</span><span class="sub">${explain}</span></div>
    ${myLine}${rows ? `<div class="drinks">${rows}</div>` : ''}${action}`;
}

/* ================= VELLEN ================= */
function menuHTML() {
  const host = isHost(), game = S && S.phase !== 'lobby';
  return `${sheetTop('Menu')}
  <nav class="mlist">
    <button type="button" data-act="rules">Spelregels <span>›</span></button>
    ${game ? '<button type="button" data-act="score">Stand <span>›</span></button>' : ''}
    <button type="button" data-act="mute">Geluid <span>${Snd.muted ? 'uit' : 'aan'}</span></button>
    ${S ? `<button type="button" data-act="share">Uitnodigen <span>${S.code}</span></button>` : ''}
    ${game && host ? '<button type="button" data-act="againask">Terug naar de lobby <span>›</span></button>' : ''}
    ${S ? '<button type="button" data-act="leaveask">Verlaat tafel <span>›</span></button>' : ''}
    <a href="/melden?spel=paardenrace${S ? `&code=${S.code}` : ''}">Iets melden <span>›</span></a>
    <a href="/">Naar Rondje <span>›</span></a>
  </nav>`;
}

function scoreHTML() {
  const rows = S.players.map((p, i) => ({ p, i })).sort((a, b) => b.p.sips - a.p.sips);
  return `${sheetTop('Stand')}
  <div class="scorecard"><table>
    <thead><tr><th>Speler</th><th>Slokken</th><th>Gewonnen</th><th>Races</th></tr></thead>
    <tbody>${rows.map(({ p, i }) => `<tr style="--pc:${PC[i % PC.length]}"><td><i></i>${esc(p.name)}</td><td>${p.sips}</td><td>${p.wins}</td><td>${p.races}</td></tr>`).join('')}</tbody>
  </table></div>
  <p class="sub">Slokken: hoeveel iemand moest drinken, ook de inzet vooraf. Gewonnen: hoe vaak iemands paard als eerste over de finish kwam.</p>`;
}

function rulesHTML() {
  return `${sheetTop('Spelregels', 'Paardenrace')}
  <div class="rules">
    <p>Iedereen speelt op zijn eigen telefoon. Maak een tafel en deel de code, of doe mee met de code van een ander. De vier azen zijn de paarden: harten, ruiten, klaveren en schoppen.</p>
    <ol>
      <li><b>Inzetten.</b> Kies een aas als paard en zet ${P.BET_MIN} tot ${P.BET_MAX} slokken in. Meer spelers mogen op hetzelfde paard. Is iedereen klaar, dan begint de race.</li>
      <li><b>Drink je inzet.</b> Bij de start drinkt iedereen eerst de slokken die hij inzette.</li>
      <li><b>De baan.</b> Naast de baan liggen ${P.TRACK} dichte kaarten, de azen staan op de start. Om de beurt trek je een kaart van de stapel: het paard met die vorm doet een stap vooruit.</li>
      <li><b>Een stap terug.</b> Zijn alle vier de paarden langs een dichte kaart, dan gaat die open. Het paard met dezelfde vorm moet een stap terug.</li>
      <li><b>Finish.</b> Het eerste paard voorbij de ${P.TRACK}e kaart wint. Wie op een ander paard zette, drinkt zijn eigen inzet nog een keer, plus de inzet van de winnaar. Zetten er meer spelers op het winnende paard, dan tellen hun inzetten bij elkaar op.</li>
    </ol>
    <p class="small">Wint er een paard waar niemand op zette, dan drinkt iedereen alleen zijn eigen inzet. Wie later aanschuift, zet in voor de volgende race. Valt wie aan de beurt is weg, dan trekt de volgende. Drink met mate: water of karnemelk telt ook.</p>
  </div>`;
}

function openSheet(key, html) { ui.sheet = { key, html }; renderSheet(); }
function closeSheet() { ui.sheet = null; renderSheet(); }

function renderSheet() {
  const ov = $('#overlay'), sh = $('#sheet');
  if (!ui.sheet) { if (!ov.hidden) { ov.hidden = true; sh.innerHTML = ''; } ui.sheetHtml = null; return; }
  const wasHidden = ov.hidden;
  if (!wasHidden && ui.sheetHtml === ui.sheet.html) return;
  sh.innerHTML = ui.sheet.html;
  sh.classList.toggle('anim', wasHidden);
  ov.hidden = false;
  ui.sheetHtml = ui.sheet.html;
  if (wasHidden) { const first = sh.querySelector('button, a'); if (first) first.focus({ preventScroll: true }); }
}

function toast(msg, cls = '') {
  const box = $('#toasts'), el = document.createElement('div');
  // dezelfde melding nog in beeld (bijvoorbeeld na een paar keer tikken)? Dan alleen de nieuwe
  for (const old of box.querySelectorAll('div:not(.net)')) if (old.textContent === msg) old.remove();
  el.textContent = msg; if (cls) el.className = cls;
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 2800);
}

function netPill() {
  const box = $('#toasts');
  let el = box.querySelector('.net');
  const bad = S && Net.status !== 'open';
  if (bad && !el) { el = document.createElement('div'); el.className = 'net'; el.textContent = 'Verbinding kwijt, opnieuw verbinden…'; box.prepend(el); }
  if (!bad && el) el.remove();
}

function celebrate() {
  if (reduce) return;
  const box = $('#confetti'), cols = ['#f7c548', '#a6d83c', '#ff6b8b', '#2fbf71', '#ff7a00', '#f3efdb'];
  box.innerHTML = Array.from({ length: 70 }, () => `<i style="left:${(Math.random() * 100).toFixed(1)}%;background:${cols[Math.floor(Math.random() * cols.length)]};--t:${(2.4 + Math.random() * 2).toFixed(2)}s;--dl:${(Math.random() * .6).toFixed(2)}s;--x:${Math.round((Math.random() - .5) * 160)}px;--r:${Math.round(360 + Math.random() * 720)}deg"></i>`).join('');
  setTimeout(() => { box.innerHTML = ''; }, 5200);
}

/* ================= TEKENEN ================= */
function view() {
  if (!S) return 'home';
  if (S.phase === 'lobby') return 'lobby';
  if (S.phase === 'inzetten') return 'inzetten';
  // de uitslag pas als de laatste kaart is afgespeeld
  if (S.phase === 'uitslag' && !playing()) return 'uitslag';
  return 'race';
}

function render() {
  const v = view();
  // een nieuwe stap: het dock springt even op
  const step = S ? `${v}:${S.turn}:${S.players[S.you] ? S.players[S.you].ready : ''}` : v;
  ui.dockPop = step !== ui.lastStep;
  ui.lastStep = step;
  document.documentElement.dataset.view = v;
  const scr = $('#screen');
  const nameIn = $('#nameIn'), codeIn = $('#codeIn');
  if (nameIn) ui.name = nameIn.value;
  if (codeIn) ui.code = codeIn.value;
  const keep = v === ui.lastView ? scr.scrollTop : 0;
  const html = { home: vHome, lobby: vLobby, inzetten: vInzetten, race: vRace, uitslag: vUitslag }[v]();
  scr.classList.toggle('is-game', v !== 'home');
  scr.innerHTML = `<div class="view v-${v}${v !== 'home' ? ' game' : ''}">${html}</div>`;
  placeSeats();
  scr.scrollTop = keep;
  ui.lastView = v;
  // een beweging speelt maar één keer af, ook als er tussendoor opnieuw getekend wordt
  ui.fresh = {};
  const own = $('#owe');
  if (S && S.phase !== 'lobby') {
    const n = S.players[S.you].sips;
    own.hidden = false;
    own.classList.toggle('zero', !n);
    own.innerHTML = `${GLASS}${n}`;
    own.setAttribute('aria-label', `Jij dronk ${B.sipsText(n)}`);
  } else own.hidden = true;
  if (ui.sheet && ui.sheet.key === 'menu') ui.sheet.html = menuHTML();
  if (ui.sheet && ui.sheet.key === 'score' && S) ui.sheet.html = scoreHTML();
  renderSheet();
  netPill();
}

/* ================= BEDIENING ================= */
function myName() {
  const input = $('#nameIn');
  const name = P.cleanNames([input ? input.value : ui.name])[0] || '';
  if (!name) { ui.error = 'Vul eerst je naam in.'; render(); const n = $('#nameIn'); if (n) n.focus(); return null; }
  me.name = name; ui.name = name; store.set(KEY.me, me);
  return name;
}

function joinWith(code) {
  const name = myName();
  if (!name) return;
  code = String(code || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (code.length !== 4) { ui.error = 'Vul de code van 4 letters in.'; render(); return; }
  ui.joining = true; ui.error = ''; ui.code = code;
  Snd.ac();
  Net.go({ t: 'join', code, name, token: me.token });
  render();
}

// je keuze bij het inzetten naar de server, zodat de anderen hem zien
function sendPick(ready) {
  const pick = ui.pick;
  Snd.ac(); Snd.chip();
  Net.send({ t: 'bet', horse: pick.horse, bet: pick.bet, ready });
  render();
}

const actions = {
  create() {
    const name = myName();
    if (!name) return;
    ui.joining = true; ui.error = '';
    Snd.ac();
    Net.go({ t: 'create', name, token: me.token });
    render();
  },
  start() { Snd.ac(); Net.send({ t: 'start' }); },
  share() {
    const url = `${location.origin}/paardenrace/${S.code}`, text = `Doe mee met Paardenrace aan tafel ${S.code}`;
    closeSheet();
    if (navigator.share) navigator.share({ title: 'Paardenrace', text, url }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Link gekopieerd'), () => toast(url));
    else toast(url);
  },
  kickask(el) {
    const i = +el.dataset.seat;
    openSheet('kick', `${sheetTop(`${nameOf(i)} van tafel halen?`)}
      <p>${nameOf(i)} kan daarna opnieuw meedoen met de code.</p>
      <button class="cta" type="button" data-act="kick" data-seat="${i}"><span>Ja, van tafel halen</span>${ARR}</button>
      <button class="ghostbtn" type="button" data-act="close">Nee</button>`);
  },
  kick(el) { Net.send({ t: 'kick', seat: +el.dataset.seat }); closeSheet(); },
  horse(el) { ui.pick.horse = +el.dataset.h; sendPick(false); },
  less() { ui.pick.bet = Math.max(P.BET_MIN, ui.pick.bet - 1); sendPick(false); },
  more() { ui.pick.bet = Math.min(P.BET_MAX, ui.pick.bet + 1); sendPick(false); },
  ready() { if (ui.pick.horse >= 0) sendPick(true); },
  unready() { const p = S.players[S.you]; ui.pick = { horse: p.horse, bet: p.bet, race: S.race }; sendPick(false); },
  go() { Snd.ac(); Net.send({ t: 'go' }); },
  // na een tik even wachten op de server, zodat een dubbele tik niet twee keer trekt
  draw() {
    Snd.ac();
    const seq = S.seq;
    ui.sent = seq;
    Net.send({ t: 'draw' });
    setTimeout(() => { if (ui.sent === seq) { ui.sent = -1; render(); } }, 2500);
    render();
  },
  next() { Snd.ac(); Net.send({ t: 'next' }); },
  mine() {
    const n = S.players[S.you].sips;
    toast(n ? `Jij dronk al ${B.sipsText(n)}` : 'Jij hebt nog niks hoeven drinken');
  },
  menu() { openSheet('menu', menuHTML()); },
  rules() { openSheet('rules', rulesHTML()); },
  score() { openSheet('score', scoreHTML()); },
  mute() { Snd.muted = !Snd.muted; store.set(KEY.mute, Snd.muted); if (!Snd.muted) Snd.chip(); openSheet('menu', menuHTML()); },
  againask() {
    openSheet('again', `${sheetTop('Terug naar de lobby?')}
      <p>De stand begint dan opnieuw. In de lobby kunnen nieuwe spelers aanschuiven en kun je spelers van tafel halen.</p>
      <button class="cta" type="button" data-act="again"><span>Ja, terug naar de lobby</span>${ARR}</button>
      <button class="ghostbtn" type="button" data-act="close">Nee, verder spelen</button>`);
  },
  again() { Net.send({ t: 'again' }); closeSheet(); },
  leaveask() {
    openSheet('leave', `${sheetTop('Tafel verlaten?')}
      <p>${S && S.phase !== 'lobby' ? 'Met de code kom je terug op je eigen plek, met je eigen stand.' : 'Met de code kun je later weer aanschuiven.'}</p>
      <button class="cta" type="button" data-act="leave"><span>Ja, verlaten</span>${ARR}</button>
      <button class="ghostbtn" type="button" data-act="close">Nee, blijven</button>`);
  },
  leave() { Net.send({ t: 'leave' }); leaveLocal(); },
  close: closeSheet,
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled && actions[el.dataset.act]) { actions[el.dataset.act](el); return; }
  if (e.target === $('#overlay')) closeSheet();
});
document.addEventListener('submit', (e) => { if (e.target.id === 'joinForm') { e.preventDefault(); joinWith($('#codeIn').value); } });
document.addEventListener('input', (e) => {
  if (e.target.id === 'codeIn') { const v = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); if (v !== e.target.value) e.target.value = v; }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#overlay').hidden) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'nameIn') { e.preventDefault(); const c = $('#codeIn'); if (c && c.value.length === 4) joinWith(c.value); else if (c) c.focus(); }
});
addEventListener('resize', placeSeats);

/* ================= START ================= */
// zat je net nog aan een tafel (en open je niet een andere link)? Dan meteen terug op je plek.
const lastTable = store.get(KEY.table, null);
if (lastTable && typeof lastTable.code === 'string' && (!urlCode || urlCode === lastTable.code)) {
  ui.joining = true;
  Net.go({ t: 'join', code: lastTable.code, name: me.name, token: me.token });
}
render();
if (urlCode && !ui.joining) { const n = $('#nameIn'); if (n && !n.value) n.focus(); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeSeats);
</script>
</body>
</html>
