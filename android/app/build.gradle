// De app zelf. Bouwen: zie android/LEESMIJ.md.
// Ondertekenen gebeurt alleen als de omgevingsvariabelen hieronder gezet zijn; de sleutel staat NIET in de repository.
plugins {
    id 'com.android.application'
}

def keystore = System.getenv('SPELKEET_KEYSTORE')

android {
    namespace 'nl.spelkeet.app'
    compileSdk 36

    defaultConfig {
        applicationId 'nl.spelkeet.app'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        if (keystore) {
            upload {
                storeFile file(keystore)
                storePassword System.getenv('SPELKEET_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SPELKEET_KEY_ALIAS') ?: 'spelkeet'
                keyPassword System.getenv('SPELKEET_KEY_PASSWORD') ?: System.getenv('SPELKEET_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // klein genoeg; zonder verkleinen blijft de brug naar de site (@JavascriptInterface) zeker heel
            minifyEnabled false
            if (keystore) signingConfig signingConfigs.upload
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}
