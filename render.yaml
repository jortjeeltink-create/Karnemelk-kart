# Render.com blueprint (Dashboard -> New -> Blueprint -> kies je repository)
# Je hoeft niks in te vullen: MP-punten staan als ondertekende reservekopie op ieders telefoon
# en komen vanzelf terug als de server opnieuw opstart.
services:
  - type: web
    name: spelkeet      # het adres wordt https://spelkeet.onrender.com
    runtime: node
    # Starter (betaald, ongeveer $7 per maand): de server valt niet in slaap, zodat de app meteen opent.
    # Op het gratis plan slaapt hij na 15 minuten zonder bezoekers en wacht de eerste speler bijna een minuut.
    plan: starter
    region: frankfurt   # dichtbij Nederland: minder vertraging in de race
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # geheim waarmee de server de reservekopieën ondertekent (Render maakt dit zelf aan)
      - key: KK_SECRET
        generateValue: true
      # voor de Play Store (zie PLAY-STORE.md): het contactadres op het privacybeleid, het geheime woord om
      # meldingen te lezen, en de koppeling met de Android-app (pakketnaam en vingerafdrukken)
      - key: CONTACT_EMAIL
        sync: false
      - key: MELD_SLEUTEL
        generateValue: true
      # een mail bij elke melding (naar despelkeet@gmail.com): de API-sleutel van resend.com
      - key: RESEND_API_KEY
        sync: false
      - key: ANDROID_PACKAGE
        sync: false
      - key: ANDROID_SHA256
        sync: false
