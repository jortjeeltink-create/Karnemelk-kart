# Render.com blueprint (Dashboard -> New -> Blueprint -> kies je repository)
# Je hoeft niks in te vullen: MP-punten staan als ondertekende reservekopie op ieders telefoon
# en komen vanzelf terug als de gratis server opnieuw opstart.
services:
  - type: web
    name: karnemelk-kart
    runtime: node
    plan: free
    region: frankfurt   # dichtbij Nederland: minder vertraging in de race
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # geheim waarmee de server de reservekopieën ondertekent (Render maakt dit zelf aan)
      - key: KK_SECRET
        generateValue: true
      # voor de Play Store (zie PLAY-STORE.md): het contactadres op het privacybeleid, het geheime woord om
      # meldingen te lezen, en de koppeling met de Android-app (pakketnaam en vingerafdrukken)
      - key: CONTACT_EMAIL
        sync: false
      - key: MELD_SLEUTEL
        generateValue: true
      - key: ANDROID_PACKAGE
        sync: false
      - key: ANDROID_SHA256
        sync: false
